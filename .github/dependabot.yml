version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:15"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 6
    rebase-strategy: "auto"
    assignees:
      - "siricarsen-cmd"
    commit-message:
      prefix: "deps"
    groups:
      production-minor-patch:
        applies-to: "version-updates"
        dependency-type: "production"
        patterns:
          - "*"
        exclude-patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@supabase/*"
          - "stripe"
          - "pdf-parse"
          - "pdf2json"
          - "pdfjs-dist"
          - "mammoth"
          - "tesseract.js"
          - "@napi-rs/*"
          - "sharp"
        update-types:
          - "minor"
          - "patch"
      development-minor-patch:
        applies-to: "version-updates"
        dependency-type: "development"
        patterns:
          - "*"
        exclude-patterns:
          - "eslint-config-next"
          - "typescript"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "08:45"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 2
    rebase-strategy: "auto"
    assignees:
      - "siricarsen-cmd"
    commit-message:
      prefix: "ci"
    groups:
      actions-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
