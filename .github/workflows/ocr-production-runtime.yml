name: OCR Production Runtime

on:
  pull_request:
    paths:
      - "next.config.ts"
      - "lib/analyzer/extract.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/verify-analyzer-runtime-trace.mjs"
      - ".github/workflows/ocr-production-runtime.yml"
  push:
    branches:
      - main
    paths:
      - "next.config.ts"
      - "lib/analyzer/extract.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/verify-analyzer-runtime-trace.mjs"
      - ".github/workflows/ocr-production-runtime.yml"

permissions:
  contents: read

jobs:
  verify-analyzer-runtime-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint runtime configuration
        run: npx eslint next.config.ts

      - name: Validate TypeScript
        run: npx tsc --noEmit

      - name: Build production bundle
        env:
          VERCEL_ENV: production
          NEXT_PUBLIC_BASE_URL: https://www.subshield.net
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          NEXT_PUBLIC_STRIPE_PRICE_SINGLE_REVIEW_CYCLE: price_ci_single
          NEXT_PUBLIC_STRIPE_PRICE_ACTIVE_BIDDER_PLAN: price_ci_active
          NEXT_PUBLIC_STRIPE_PRICE_ENTERPRISE_PLAN: price_ci_enterprise
          OPENAI_API_KEY: sk-ci-placeholder
          RESEND_API_KEY: re_ci_placeholder
          CONTACT_FROM_EMAIL: ci@example.com
          CONTACT_TO_EMAIL: ci@example.com
        run: npm run build

      - name: Verify analyzer function trace
        run: node scripts/verify-analyzer-runtime-trace.mjs
