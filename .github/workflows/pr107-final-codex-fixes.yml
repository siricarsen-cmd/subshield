name: PR107 Final Codex Fixes

on:
  push:
    branches:
      - fix/orion-parity-grounding-invoice-waiver
    paths:
      - .github/workflows/pr107-final-codex-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: trigger immediate PR107 final Codex patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/orion-parity-grounding-invoice-waiver
          fetch-depth: 0

      - name: Apply exact reviewed fixes and regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          deterministic_path = Path('lib/analyzer/deterministic.ts')
          deterministic = deterministic_path.read_text()

          old = '''  const activePreservation = new RegExp(
            `(?:does|shall|will)\\s+not\\s+(?:waive|forfeit)${boundedGap}{0,100}${invoiceRef}${boundedGap}{0,100}(?:right|entitlement)\\s+to\\s+payment`,
            "i"
          );
          return (
            invoiceThenPreserved.test(sentence) ||
            preservedThenInvoice.test(sentence) ||
            activePreservation.test(sentence)
          );'''
          new = '''  const activePreservation = new RegExp(
            `(?:does|shall|will)\\s+not\\s+(?:waive|forfeit)${boundedGap}{0,100}${invoiceRef}${boundedGap}{0,100}(?:right|entitlement)\\s+to\\s+payment`,
            "i"
          );
          const activePreservationRightThenInvoice = new RegExp(
            `(?:does|shall|will)\\s+not\\s+(?:waive|forfeit)${boundedGap}{0,100}(?:right|entitlement)\\s+to\\s+payment${boundedGap}{0,100}\\b(?:under|for)\\s+${invoiceRef}`,
            "i"
          );
          return (
            invoiceThenPreserved.test(sentence) ||
            preservedThenInvoice.test(sentence) ||
            activePreservation.test(sentence) ||
            activePreservationRightThenInvoice.test(sentence)
          );'''
          if old not in deterministic:
              raise SystemExit('named-invoice preservation marker not found')
          deterministic = deterministic.replace(old, new, 1)

          old = '''  return /^\\s*(?:\\([A-Z0-9][A-Z0-9&/.\\s-]{0,30}\\)\\s*)?(?:,\\s*(?:dated|effective|revision|rev\\.?|version)\\s+[A-Za-z0-9,./\\s-]{1,50}\\s*)?(?:[-–—:]\\s*)?(?:is\\s+)?$/i.test(
            betweenTitleAndStatus
          );'''
          new = '''  return /^\\s*(?:\\([A-Z0-9][A-Z0-9&/.\\s-]{0,30}\\)\\s*)?(?:,\\s*(?:dated|effective|revision|rev\\.?|version)\\s+[A-Za-z0-9,./\\s-]{1,50}\\s*)?(?:[-–—:]\\s*)?(?:(?:is|will|shall)\\s+(?:be\\s+)?)?$/i.test(
            betweenTitleAndStatus
          );'''
          if old not in deterministic:
              raise SystemExit('attachment-row separator marker not found')
          deterministic = deterministic.replace(old, new, 1)

          old = '''  /(?:Prime\\s+Contractor\\b(?!['\\u2019]s\\b)(?![\\s-]+(?:customers?|clients?|affiliates?|agenc(?:y|ies)|end[\\s-]?users?|affiliated(?:[\\s-]+entities?)?)\\b)|Prime\\b(?!['\\u2019]s\\b)(?!\\s+Contractor\\b)(?![\\s-]+(?:customers?|clients?|affiliates?|agenc(?:y|ies)|end[\\s-]?users?|affiliated(?:[\\s-]+entities?)?)\\b))\\s+(?:(?:may|shall|will)\\s+use|(?:has|shall\\s+have|will\\s+have)\\s+the\\s+right\\s+to\\s+use|(?:is|shall\\s+be|will\\s+be)\\s+entitled\\s+to\\s+use)\\s+(?:(?:all|any|the|such|stated|those|Subcontractor(?:['\\u2019]s|[\\s-](?:created|owned)))\\s+){0,3}(?:improvements?(?:\\s+or\\s+adaptations?)?|adaptations?)\\b/i;'''
          new = '''  /(?:Prime\\s+Contractor\\b(?!['\\u2019]s\\b)(?![\\s-]+(?:customers?|clients?|affiliates?|agenc(?:y|ies)|end[\\s-]?users?|affiliated(?:[\\s-]+entities?)?)\\b)|Prime\\b(?!['\\u2019]s\\b)(?!\\s+Contractor\\b)(?![\\s-]+(?:customers?|clients?|affiliates?|agenc(?:y|ies)|end[\\s-]?users?|affiliated(?:[\\s-]+entities?)?)\\b))\\s+(?:(?:may|shall|will)\\s+use|(?:has|shall\\s+have|will\\s+have)\\s+the\\s+right\\s+to\\s+use|(?:is|shall\\s+be|will\\s+be)\\s+entitled\\s+to\\s+use)\\s+(?:(?:(?:any\\s+and\\s+all)|all|any|the|such|stated|those|Subcontractor(?:['\\u2019]s|[\\s-](?:created|owned)))\\s+){0,3}(?:improvements?(?:\\s+or\\s+adaptations?)?|adaptations?)\\b/i;'''
          if old not in deterministic:
              raise SystemExit('active improvements determiner marker not found')
          deterministic = deterministic.replace(old, new, 1)
          deterministic_path.write_text(deterministic)

          sanity_path = Path('lib/analyzer/sanity.ts')
          sanity = sanity_path.read_text()
          old = '''  const unpaidImprovementClaim =
            /(?:improvements?|adaptations?)[^.]{0,100}(?:without\\s+(?:additional\\s+)?(?:payment|compensation)|unpaid|free\\s+use)|(?:without\\s+(?:additional\\s+)?(?:payment|compensation)|unpaid|free\\s+use)[^.]{0,100}(?:improvements?|adaptations?)/i.test(claim);'''
          new = '''  const unpaidImprovementClaim =
            /(?:improvements?|adaptations?)[^.]{0,100}(?:without\\s+(?:additional\\s+)?(?:payment|compensation)|unpaid|free\\s+use|royalty[\\s-]?free|free\\s+of\\s+charge)|(?:without\\s+(?:additional\\s+)?(?:payment|compensation)|unpaid|free\\s+use|royalty[\\s-]?free|free\\s+of\\s+charge)[^.]{0,100}(?:improvements?|adaptations?)/i.test(claim);'''
          if old not in sanity:
              raise SystemExit('unpaid-improvement claim marker not found')
          sanity = sanity.replace(old, new, 1)
          sanity_path.write_text(sanity)

          test_path = Path('lib/analyzer/__tests__/orion-parity-regression.test.mjs')
          tests = test_path.read_text()
          marker = '\nif (failures > 0) {'
          if marker not in tests:
              raise SystemExit('test footer marker not found')
          additions = r'''

const activeSameInvoicePaymentPreservation = productionPath(`
2.8 Invoice Requirements
Failure to submit Invoice 104 within 30 calendar days waives the right to payment for Invoice 104. This does not waive the right to payment for Invoice 104.
`);
check(
  "active same-invoice payment preservation suppresses invoice waiver",
  !activeSameInvoicePaymentPreservation.findings.some(
    (finding) => finding.regulation === "Invoice Submission Deadline / Payment Waiver"
  )
);

const ownershipOnlyQuote = "All Improvements are owned by Prime Contractor.";
const unsupportedRoyaltyFreeFinding = {
  triggerType: "Contract Risk Trigger",
  regulation: "Conditioned Pre-Existing IP Retention / Unpaid Use of Improvements",
  severity: "High",
  foundText: ownershipOnlyQuote,
  riskAnalysis:
    "This clause gives Prime Contractor royalty-free use of Subcontractor-created Improvements.",
  redlineFix:
    "Limit any license to stated deliverables and require separate compensation for broader use.",
};
check(
  "unsupported royalty-free improvement-use claim is rejected by finding-local verification",
  verifyFindings([unsupportedRoyaltyFreeFinding], ownershipOnlyQuote).verified.length === 0
);

const fullSentenceDeferredAttachmentRows = productionPath(`
1. Attachment List
1. Statement of Work will be included after award.
2. Prime Contract Flow-Down Matrix shall be provided after award.
3. Certifications
Subcontractor certifies that its representations remain current.
`);
const fullSentenceDeferredAttachmentFinding = fullSentenceDeferredAttachmentRows.findings.find(
  (finding) => finding.regulation === "Missing / Deferred Contract Documents"
);
check(
  "full-sentence deferred attachment rows remain inside focused Attachment List evidence",
  Boolean(
    fullSentenceDeferredAttachmentFinding &&
      /Statement of Work/i.test(fullSentenceDeferredAttachmentFinding.foundText) &&
      /Flow-Down Matrix/i.test(fullSentenceDeferredAttachmentFinding.foundText)
  ),
  fullSentenceDeferredAttachmentFinding?.foundText ?? "missing finding"
);
check(
  "full-sentence deferred attachment rows exclude the next peer section",
  Boolean(fullSentenceDeferredAttachmentFinding && !/Certifications/i.test(fullSentenceDeferredAttachmentFinding.foundText)),
  fullSentenceDeferredAttachmentFinding?.foundText ?? "missing finding"
);

const anyAndAllImprovementsUse = productionPath(`
2.17 Improvements
Prime Contractor may use any and all Improvements without additional payment to Subcontractor.
`);
const anyAndAllImprovementsFinding = anyAndAllImprovementsUse.findings.find(
  (finding) => finding.regulation === "Conditioned Pre-Existing IP Retention / Unpaid Use of Improvements"
);
check(
  "any-and-all Improvements unpaid-use grant triggers",
  Boolean(anyAndAllImprovementsFinding)
);
check(
  "any-and-all Improvements analysis remains finding-local",
  Boolean(
    anyAndAllImprovementsFinding &&
      verifyFindings([anyAndAllImprovementsFinding], anyAndAllImprovementsFinding.foundText).verified.length === 1
  )
);
'''
          tests = tests.replace(marker, additions + marker, 1)
          test_path.write_text(tests)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/analyzer/deterministic.ts lib/analyzer/sanity.ts lib/analyzer/__tests__/orion-parity-regression.test.mjs
          git diff --cached --check
          git commit -m "fix: address final PR107 Codex findings"
          git push origin HEAD:fix/orion-parity-grounding-invoice-waiver
