name: One-time Orion review edge-case fix

on:
  push:
    branches:
      - fix/orion-parity-grounding-invoice-waiver

permissions:
  contents: write

jobs:
  apply-verify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/orion-parity-grounding-invoice-waiver
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply exact reviewed edge-case patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              file_path.write_text(text.replace(old, new, 1))

          replace_once(
              'lib/analyzer/anchors.ts',
              r'''  /(?:subcontract\s+type|type\s+of\s+(?:subcontract|agreement)|contract\s+type)\s*(?::|[-\u2010-\u2015])?\s*(?:\n\s*)?((?:firm[\s-]*fixed[\s-]*price|time[\s-]*(?:and|&)[\s-]*materials|labor[\s-]hour|cost[\s-]*plus[\s-]*fixed[\s-]*fee|cost[\s-]reimburs(?:ement|able)|indefinite[\s-]delivery|IDIQ|purchase\s+order|teaming\s+agreement)[^\n]{0,60})/i;''',
              r'''  /(?:subcontract\s+type|type\s+of\s+(?:subcontract|agreement)|contract\s+type)\s*(?::|[-\u2010-\u2015])?\s*(?:\n\s*)?((?:T\s*&\s*M|FFP|firm[\s-]*fixed[\s-]*price|time[\s-]*(?:and|&)[\s-]*materials|labor[\s-]hour|cost[\s-]*plus[\s-]*fixed[\s-]*fee|cost[\s-]reimburs(?:ement|able)|indefinite[\s-]delivery|IDIQ|purchase\s+order|teaming\s+agreement)[^\n]{0,60})/i;''',
              'abbreviated hybrid type labels',
          )

          replace_once(
              'lib/analyzer/deterministic.ts',
              r'''const ATTACHMENT_LIST_END_RE =
  /\b(?:\d+\.\s*)?(?:Subcontractor\s+Questions\s+Form|Quote\s+Submission\s+Instructions)\b/i;''',
              r'''const ATTACHMENT_LIST_END_RE =
  /\b\d+\.\s+(?!\d)(?:[A-Z][A-Za-z0-9/&()'\u2019-]*(?:\s+[A-Z][A-Za-z0-9/&()'\u2019-]*){0,10})\b/;''',
              'generic next section after Attachment List',
          )

          replace_once(
              'lib/analyzer/deterministic.ts',
              r'''const INVOICE_PAYMENT_WAIVER_RE =
  /failure\s+to\s+submit[^.]{0,140}(?:complete\s+)?invoice[^.]{0,140}(?:within|no\s+later\s+than)\s+\d{1,3}\s*(?:calendar|business|working)?\s*days?[^.]{0,180}(?:waives?|forfeits?)[^.]{0,100}(?:right|entitlement)\s+to\s+payment/i;

function findInvoicePaymentWaiverCandidate(documentText: string): string | null {
  return findClauseCandidate(documentText, (block) => INVOICE_PAYMENT_WAIVER_RE.test(block));
}''',
              r'''const INVOICE_PAYMENT_WAIVER_RE =
  /failure\s+to\s+submit[^.]{0,140}(?:complete\s+)?invoice[^.]{0,140}(?:within|no\s+later\s+than)\s+\d{1,3}\s*(?:calendar|business|working)?\s*days?[^.]{0,120}(?:waives?|forfeits?)\s+(?:Subcontractor(?:'s|\u2019s)?\s+)?(?:the\s+)?(?:right|entitlement)\s+to\s+payment/i;
const PAYMENT_RIGHT_PRESERVED_RE =
  /(?:does|shall|will)\s+not\s+(?:waive|forfeit)[^.]{0,80}(?:right|entitlement)\s+to\s+payment|(?:right|entitlement)\s+to\s+payment[^.]{0,80}(?:is|shall|will)\s+not\s+(?:waived|forfeited)/i;

function findInvoicePaymentWaiverCandidate(documentText: string): string | null {
  return findClauseCandidate(
    documentText,
    (block) => INVOICE_PAYMENT_WAIVER_RE.test(block) && !PAYMENT_RIGHT_PRESERVED_RE.test(block)
  );
}''',
              'invoice waiver payment linkage and preservation guard',
          )

          replace_once(
              'lib/analyzer/deterministic.ts',
              r'''const UNPAID_IMPROVEMENTS_USE_RE =
  /(?:improvements?|adaptations?)[^.]{0,180}(?:may\s+be\s+used\s+by|Prime(?:\s+Contractor)?\s+may\s+use)[^.]{0,160}without\s+(?:additional\s+)?(?:payment|compensation|charge|fee)|(?:may\s+be\s+used\s+by|Prime(?:\s+Contractor)?\s+may\s+use)[^.]{0,160}(?:improvements?|adaptations?)[^.]{0,160}without\s+(?:additional\s+)?(?:payment|compensation|charge|fee)/i;''',
              r'''const UNPAID_IMPROVEMENTS_USE_RE =
  /(?:improvements?|adaptations?)[^.]{0,180}may\s+be\s+used\s+by\s+Prime(?:\s+Contractor)?[^.]{0,160}without\s+(?:additional\s+)?(?:payment|compensation|charge|fee)|Prime(?:\s+Contractor)?\s+may\s+use[^.]{0,160}(?:improvements?|adaptations?)[^.]{0,160}without\s+(?:additional\s+)?(?:payment|compensation|charge|fee)/i;''',
              'Prime actor for unpaid improvements use',
          )

          replace_once(
              'lib/analyzer/deterministic.ts',
              r'''const VENUE_OR_ARBITRATION_EVIDENCE_RE =
  /(?:exclusive\s+)?(?:venue|jurisdiction)\s+(?:shall\s+be\s+|is\s+|lies\s+|must\s+be\s+)?(?:in|located\s+in)[^.]{0,120}(?:courts?|County|State|Commonwealth)|binding\s+arbitration|(?:arbitration|mediation|court\s+proceeding)[^.]{0,180}(?:(?:must|shall)\s+be\s+)?(?:brought|filed)\s+(?:exclusively\s+)?in|Prime(?:\s+Contractor)?\s+elects?\s+(?:another|a\s+different|an\s+alternate)\s+forum/i;''',
              r'''const VENUE_OR_ARBITRATION_EVIDENCE_RE =
  /(?:exclusive\s+)?(?:venue|jurisdiction)\s+(?:shall\s+be\s+|is\s+|lies\s+|must\s+be\s+)?(?:in|located\s+in)[^.]{0,120}(?:courts?|County|State|Commonwealth)|binding\s+arbitration|(?:(?:any\s+)?(?:action|lawsuit|claim|dispute|proceeding)|arbitration|mediation|court\s+proceeding)[^.]{0,180}(?:(?:must|shall)\s+be\s+)?(?:brought|filed)\s+(?:exclusively\s+)?in|Prime(?:\s+Contractor)?\s+elects?\s+(?:another|a\s+different|an\s+alternate)\s+forum/i;
const BILATERAL_DEFENDANT_VENUE_RE =
  /(?:exclusive\s+)?venue[^.]{0,220}(?:where|located\s+where)[^.]{0,80}\bdefendant\b[^.]{0,80}(?:resides?|is\s+located|has\s+its\s+principal\s+place\s+of\s+business)/i;''',
              'mandatory venue recall and defendant-location guard',
          )

          replace_once(
              'lib/analyzer/deterministic.ts',
              r'''function findVenueOrGoverningLawCandidate(documentText: string): string | null {
  return findClauseCandidate(
    documentText,
    (block) => VENUE_OR_ARBITRATION_EVIDENCE_RE.test(block)
  );
}''',
              r'''function findVenueOrGoverningLawCandidate(documentText: string): string | null {
  return findClauseCandidate(
    documentText,
    (block) =>
      VENUE_OR_ARBITRATION_EVIDENCE_RE.test(block) &&
      !BILATERAL_DEFENDANT_VENUE_RE.test(block)
  );
}''',
              'venue candidate defendant-location exclusion',
          )

          replace_once(
              'lib/analyzer/sanity.ts',
              r'''  const forumBurdenEvidence =
    /(?:exclusive\s+)?(?:venue|jurisdiction)\b|binding\s+arbitration|(?:arbitration|mediation|court\s+proceeding)[^.]{0,180}(?:brought|filed)\s+in|Prime(?:\s+Contractor)?\s+elects?\s+(?:another|a\s+different|an\s+alternate)\s+forum/i.test(quote);''',
              r'''  const forumBurdenEvidence =
    /(?:exclusive\s+)?(?:venue|jurisdiction)\b|binding\s+arbitration|(?:(?:any\s+)?(?:action|lawsuit|claim|dispute|proceeding)|arbitration|mediation|court\s+proceeding)[^.]{0,180}(?:brought|filed)\s+(?:exclusively\s+)?in|Prime(?:\s+Contractor)?\s+elects?\s+(?:another|a\s+different|an\s+alternate)\s+forum/i.test(quote);''',
              'finding-local mandatory forum evidence',
          )

          replace_once(
              'lib/analyzer/sanity.ts',
              r'''  const unpaidImprovementEvidence =
    /improvements?|adaptations?/i.test(quote) &&
    /without\s+(?:additional\s+)?(?:payment|compensation|charge|fee)/i.test(quote);''',
              r'''  const unpaidImprovementEvidence =
    /(?:improvements?|adaptations?)[^.]{0,180}may\s+be\s+used\s+by\s+Prime(?:\s+Contractor)?[^.]{0,160}without\s+(?:additional\s+)?(?:payment|compensation|charge|fee)|Prime(?:\s+Contractor)?\s+may\s+use[^.]{0,160}(?:improvements?|adaptations?)[^.]{0,160}without\s+(?:additional\s+)?(?:payment|compensation|charge|fee)/i.test(quote);''',
              'finding-local Prime actor for improvements',
          )

          test_path = Path('lib/analyzer/__tests__/orion-parity-regression.test.mjs')
          tests = test_path.read_text()
          marker = '// Negative controls ensure the targeted recall fixes do not create new false positives.\n'
          positive_controls = '''for (const [label, text] of [
  ["inline abbreviated label", "Subcontract Type: T&M / FFP"],
  ["newline abbreviated label", "Subcontract Type\\nT&M / FFP"],
]) {
  const anchor = extractAnchorCandidates(text, `${label}.txt`).subcontractType ?? "";
  check(
    `${label}: anchor preserves abbreviated T&M and FFP evidence`,
    /T\\s*&\\s*M/i.test(anchor) && /\\bFFP\\b/i.test(anchor),
    `anchor=${anchor || "missing"}`
  );
}

'''
          if tests.count(marker) != 1:
              raise SystemExit('positive-control insertion marker missing or duplicated')
          tests = tests.replace(marker, positive_controls + marker, 1)

          marker2 = 'const conditionedIpOnly = productionPath(`\n'
          edge_controls = '''const preservedPayment = productionPath(`
2.8 Invoice Requirements
Failure to submit a complete invoice within 30 calendar days waives the right to dispute rejection, but does not waive the right to payment.
`);
check(
  "procedural waiver that preserves payment does not trigger invoice payment waiver",
  !preservedPayment.findings.some((finding) => finding.regulation === "Invoice Submission Deadline / Payment Waiver")
);

const reverseIpActor = productionPath(`
2.17 Improvements
Improvements may be used by Subcontractor without additional payment to Prime Contractor.
`);
check(
  "Subcontractor use of improvements does not become unpaid Prime use",
  !reverseIpActor.findings.some((finding) => finding.regulation === "Conditioned Pre-Existing IP Retention / Unpaid Use of Improvements")
);

const neutralDefendantVenue = productionPath(`
2.23 Venue
Exclusive venue shall be in the courts located where the defendant resides.
`);
check(
  "bilateral defendant-location venue remains clean",
  !neutralDefendantVenue.findings.some((finding) => finding.regulation === "Out-of-State Venue, Governing Law, or Arbitration Burden")
);

for (const [label, clause] of [
  ["mandatory action", "Any action must be brought in Arlington County, Virginia."],
  ["mandatory lawsuit", "Any lawsuit shall be filed exclusively in Arlington County, Virginia."],
]) {
  const result = productionPath(`2.23 Venue\\n${clause}`);
  const finding = result.findings.find((candidate) => candidate.regulation === "Out-of-State Venue, Governing Law, or Arbitration Burden");
  check(`${label}: direct Arlington forum language triggers`, Boolean(finding && /Arlington\\s+County/i.test(finding.foundText)));
  check(`${label}: venue analysis remains finding-local`, Boolean(finding && verifyFindings([finding], finding.foundText).verified.length === 1));
}

const genericNextSection = productionPath(`
5. Attachment List
Attachment B Prime Contract Flow-Down Matrix To be provided after award.
6. Certifications
Subcontractor certifies that its representations remain current.
`);
const boundedMissing = genericNextSection.findings.find((finding) => finding.regulation === "Missing / Deferred Contract Documents");
check("generic numbered section bounds Attachment List evidence", Boolean(boundedMissing && !/Certifications/i.test(boundedMissing.foundText)));

'''
          if tests.count(marker2) != 1:
              raise SystemExit('edge-control insertion marker missing or duplicated')
          tests = tests.replace(marker2, edge_controls + marker2, 1)
          test_path.write_text(tests)
          PY
      - name: Install locked dependencies
        run: npm ci
      - name: Run analyzer accuracy suite
        run: npm run test:accuracy
      - name: Validate TypeScript
        run: npx tsc --noEmit
      - name: Build production application
        run: NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co NEXT_PUBLIC_SUPABASE_ANON_KEY=build-placeholder npm run build
      - name: Commit verified edge-case fixes
        shell: bash
        run: |
          rm -f .github/workflows/orion-review-edge-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Address Orion analyzer review edge cases"
          git push origin HEAD:fix/orion-parity-grounding-invoice-waiver
