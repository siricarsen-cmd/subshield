name: Trigger Public Supabase Config Cleanup

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/apply-public-supabase-config.yml"
      - ".github/workflows/trigger-public-supabase-config.yml"

permissions:
  contents: write

jobs:
  apply-cleanup:
    if: github.head_ref == 'fix/public-supabase-env-config' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: fix/public-supabase-env-config
          fetch-depth: 0

      - name: Extract and run the asserted replacement script
        shell: bash
        run: |
          awk '
            found && $0 == "          PY" { exit }
            found { sub(/^          /, ""); print }
            /python - <<'"'"'PY'"'"'/ { found = 1 }
          ' .github/workflows/apply-public-supabase-config.yml > /tmp/apply-public-supabase-config.py
          python /tmp/apply-public-supabase-config.py

      - name: Push application and test changes only
        shell: bash
        run: |
          git checkout -- .github/workflows/billing-runtime-readiness.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app lib
          git commit -m "fix: require public Supabase environment configuration"
          git push origin HEAD:fix/public-supabase-env-config
