name: One-time Next.js security update

on:
  push:
    branches:
      - fix/nextjs-16-2-12-security-update

permissions:
  contents: write

jobs:
  update-and-validate:
    if: github.event.head_commit.message != 'chore: update Next.js to 16.2.12 [skip security-update]'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out security-update branch
        uses: actions/checkout@v4
        with:
          ref: fix/nextjs-16-2-12-security-update
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact patched Next.js versions
        run: npm install --save-exact next@16.2.12 eslint-config-next@16.2.12

      - name: Correct stale Vercel duration comment
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'app/api/analyze-contract/route.ts';
          const source = fs.readFileSync(path, 'utf8');
          const oldText = `// OCR fallback (rasterize + tesseract.js) can legitimately take tens of
          // seconds on a scanned PDF. Raise the function's max duration accordingly -
          // confirm this matches your actual Vercel plan (Hobby caps at 10s regardless
          // of this value; Pro/Enterprise can go higher) before deploying.`;
          const newText = `// OCR fallback (rasterize + tesseract.js) can legitimately take tens of
          // seconds on a scanned PDF. The deployed Vercel plan/project's current Fluid
          // Compute and function-duration settings must support this configured limit.`;
          if (!source.includes(oldText)) {
            throw new Error('Expected analyzer duration comment was not found.');
          }
          fs.writeFileSync(path, source.replace(oldText, newText));
          NODE

      - name: Install from regenerated lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate TypeScript
        run: npx tsc --noEmit

      - name: Run analyzer accuracy suite
        run: npm run test:accuracy

      - name: Run full regulatory suite
        run: npm run test:regulatory

      - name: Build production application
        env:
          NEXT_PUBLIC_BASE_URL: https://www.subshield.net
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          NEXT_PUBLIC_STRIPE_PRICE_SINGLE_REVIEW_CYCLE: price_ci_single
          NEXT_PUBLIC_STRIPE_PRICE_ACTIVE_BIDDER_PLAN: price_ci_active
          NEXT_PUBLIC_STRIPE_PRICE_ENTERPRISE_PLAN: price_ci_enterprise
          OPENAI_API_KEY: sk-ci-placeholder
          RESEND_API_KEY: re_ci_placeholder
          CONTACT_FROM_EMAIL: ci@example.com
          CONTACT_TO_EMAIL: ci@example.com
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify exact versions and intended diff
        shell: bash
        run: |
          node -e "const p=require('./package.json'); if(p.dependencies.next!=='16.2.12'||p.devDependencies['eslint-config-next']!=='16.2.12') process.exit(1)"
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' 'app/api/analyze-contract/route.ts' 'package-lock.json' 'package.json' | sort)"
          test "$changed" = "$expected"

      - name: Remove one-time workflow and commit validated update
        shell: bash
        run: |
          rm .github/workflows/one-time-next-security-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json app/api/analyze-contract/route.ts .github/workflows/one-time-next-security-update.yml
          git diff --cached --check
          git commit -m "chore: update Next.js to 16.2.12 [skip security-update]"
          git push origin HEAD:fix/nextjs-16-2-12-security-update
