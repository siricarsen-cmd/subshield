name: One-use Node Runtime Policy Updater

on:
  pull_request:
    paths:
      - ".github/workflows/node-runtime-policy-updater.yml"

permissions:
  contents: write

concurrency:
  group: node-runtime-policy-updater
  cancel-in-progress: false

jobs:
  update-runtime-policy:
    if: github.head_ref == 'chore/align-node-runtime-policy'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out runtime-policy branch
        uses: actions/checkout@v4
        with:
          ref: chore/align-node-runtime-policy
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply primary and compatibility runtime policy
        shell: bash
        run: |
          python <<'PY'
          import json
          import pathlib
          import re

          root = pathlib.Path('.')
          compatibility = root / '.github/workflows/node-runtime-compatibility.yml'
          updater = root / '.github/workflows/node-runtime-policy-updater.yml'

          changed_primary = []
          for workflow in sorted((root / '.github/workflows').glob('*.yml')):
              if workflow in {compatibility, updater}:
                  continue
              text = workflow.read_text()
              if 'node-version: 22' not in text:
                  continue
              updated = text.replace('Use Node.js 22', 'Use Node.js 24').replace('node-version: 22', 'node-version: 24')
              workflow.write_text(updated)
              changed_primary.append(str(workflow))

          expected_primary = {
              '.github/workflows/analyzer-accuracy.yml',
              '.github/workflows/billing-runtime-readiness.yml',
              '.github/workflows/production-dependency-audit.yml',
              '.github/workflows/regulatory-grounding.yml',
              '.github/workflows/regulatory-source-ingestion.yml',
              '.github/workflows/security-headers.yml',
          }
          missing = expected_primary.difference(changed_primary)
          if missing:
              raise SystemExit(f'Expected Node 22 primary workflows were not updated: {sorted(missing)}')

          (root / '.nvmrc').write_text('24\n')

          package_path = root / 'package.json'
          package = json.loads(package_path.read_text())
          package['engines'] = {'node': '>=22 <25'}
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          compatibility.write_text('''name: Node 22 Compatibility\n\non:\n  pull_request:\n    paths:\n      - ".nvmrc"\n      - "package.json"\n      - "package-lock.json"\n      - ".github/workflows/**"\n      - "scripts/check-node-runtime-policy.mjs"\n      - "next.config.ts"\n      - "app/**"\n      - "lib/**"\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  node-22-compatibility:\n    name: Node 22 compatibility\n    runs-on: ubuntu-latest\n    timeout-minutes: 30\n\n    steps:\n      - name: Check out repository\n        uses: actions/checkout@v4\n\n      - name: Use Node.js 22\n        uses: actions/setup-node@v4\n        with:\n          node-version: 22\n          cache: npm\n\n      - name: Validate runtime policy contract\n        run: node scripts/check-node-runtime-policy.mjs\n\n      - name: Install locked dependencies\n        run: npm ci\n\n      - name: Audit production dependencies\n        run: npm audit --omit=dev --audit-level=high\n\n      - name: Verify native and document-processing packages load\n        run: >-\n          node --input-type=module -e "\n          await import('sharp');\n          await import('@napi-rs/canvas');\n          await import('pdf-parse');\n          await import('pdfjs-dist/legacy/build/pdf.mjs');\n          await import('tesseract.js');\n          console.log('Native and document-processing imports passed.');\n          "\n\n      - name: Validate TypeScript\n        run: npx tsc --noEmit\n\n      - name: Preserve analyzer accuracy\n        run: npm run test:accuracy\n\n      - name: Build production application\n        env:\n          VERCEL_ENV: production\n          NEXT_PUBLIC_BASE_URL: https://www.subshield.net\n          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co\n          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key\n          SUPABASE_URL: https://example.supabase.co\n          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key\n          STRIPE_SECRET_KEY: sk_test_ci_placeholder\n          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder\n          NEXT_PUBLIC_STRIPE_PRICE_SINGLE_REVIEW_CYCLE: price_ci_single\n          NEXT_PUBLIC_STRIPE_PRICE_ACTIVE_BIDDER_PLAN: price_ci_active\n          NEXT_PUBLIC_STRIPE_PRICE_ENTERPRISE_PLAN: price_ci_enterprise\n          OPENAI_API_KEY: sk-ci-placeholder\n          RESEND_API_KEY: re_ci_placeholder\n          CONTACT_FROM_EMAIL: ci@example.com\n          CONTACT_TO_EMAIL: ci@example.com\n        run: npm run build\n''')

          scripts = root / 'scripts'
          scripts.mkdir(exist_ok=True)
          (scripts / 'check-node-runtime-policy.mjs').write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nimport path from "node:path";\n\nconst root = process.cwd();\nconst read = (file) => fs.readFileSync(path.join(root, file), "utf8");\n\nassert.equal(read(".nvmrc").trim(), "24", ".nvmrc must select Node 24");\n\nconst packageJson = JSON.parse(read("package.json"));\nassert.equal(packageJson.engines?.node, ">=22 <25", "package.json must support Node >=22 <25");\n\nconst packageLock = JSON.parse(read("package-lock.json"));\nassert.equal(packageLock.packages?.[""]?.engines?.node, ">=22 <25", "package-lock root engines must match package.json");\n\nconst workflowDirectory = path.join(root, ".github", "workflows");\nconst compatibilityName = "node-runtime-compatibility.yml";\nlet primaryRuntimeWorkflows = 0;\nlet compatibilityWorkflows = 0;\n\nfor (const name of fs.readdirSync(workflowDirectory).filter((entry) => entry.endsWith(".yml"))) {\n  const text = fs.readFileSync(path.join(workflowDirectory, name), "utf8");\n  if (!text.includes("actions/setup-node@")) continue;\n\n  if (name === compatibilityName) {\n    assert.match(text, /node-version:\\s*22\\b/, "compatibility workflow must use Node 22");\n    assert.doesNotMatch(text, /node-version:\\s*24\\b/, "compatibility workflow must remain Node 22 only");\n    compatibilityWorkflows += 1;\n    continue;\n  }\n\n  assert.doesNotMatch(text, /node-version:\\s*22\\b/, `${name} must not use Node 22 as a primary runtime`);\n  assert.match(text, /node-version:\\s*24\\b/, `${name} must use Node 24`);\n  primaryRuntimeWorkflows += 1;\n}\n\nassert.equal(compatibilityWorkflows, 1, "exactly one Node 22 compatibility workflow is required");\nassert.ok(primaryRuntimeWorkflows >= 6, "expected all established primary workflows to use Node 24");\nconsole.log(`Runtime policy valid: ${primaryRuntimeWorkflows} primary Node 24 workflows and one Node 22 compatibility lane.`);\n''')

          runbook_path = root / 'docs/dependency-update-runbook.md'
          runbook = runbook_path.read_text()
          replacement = '''## Runtime-version boundary\n\nNode.js 24 is SubShield's primary CI and Vercel production major. Local development defaults to Node 24 through `.nvmrc`. The repository declares Node `>=22 <25`: Node 22 remains a temporary compatibility lane while it is supported, and Node 25 or newer is unsupported until a separate compatibility audit approves it.\n\nEvery dependency and runtime-sensitive update must retain:\n\n- all primary exact-head workflows on Node.js 24;\n- the explicit Node.js 22 compatibility workflow; and\n- an exact-head Vercel Preview build on the configured Node.js 24.x production environment.\n\nDo not change the supported runtime range, remove the compatibility lane, or adopt Node 25+ inside an unrelated dependency or feature pull request.\n'''
          updated_runbook, count = re.subn(
              r'## Runtime-version boundary\n.*?(?=\n## Permissions and secrets)',
              replacement.rstrip(),
              runbook,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'Expected one runtime-version boundary section, found {count}')
          runbook_path.write_text(updated_runbook)

          print('Updated primary workflows:', *changed_primary, sep='\n- ')
          PY

      - name: Regenerate lockfile with npm
        run: npm install --package-lock-only --ignore-scripts

      - name: Validate generated runtime policy
        run: |
          rm .github/workflows/node-runtime-policy-updater.yml
          node scripts/check-node-runtime-policy.mjs
          npm ci
          npm audit --omit=dev --audit-level=high
          git diff --check

      - name: Commit phase-two runtime policy
        shell: bash
        run: |
          git config user.name "subshield-runtime-policy-bot"
          git config user.email "subshield-runtime-policy-bot@users.noreply.github.com"
          git add .nvmrc package.json package-lock.json docs/dependency-update-runbook.md scripts/check-node-runtime-policy.mjs .github/workflows
          git commit -m "chore: align primary CI with Node 24 runtime"
          git push origin HEAD:chore/align-node-runtime-policy
