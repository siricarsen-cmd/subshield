name: PR 65 cursor fix publisher v3

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/regulatory-implementation-merge-authorization'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - id: gate
        shell: bash
        run: |
          if [ "$(git log -1 --pretty=%s)" = "Trigger PR 65 cursor fix publisher v3" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply structural two-file correction
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          adapter_path = Path("lib/regulatory/registry-implementation-merge-production-adapter.ts")
          lines = adapter_path.read_text(encoding="utf-8").splitlines(keepends=True)

          starts = [
              i for i, line in enumerate(lines)
              if line.strip() == "const query = ["
              and i + 1 < len(lines)
              and 'query($number:Int!,$after:String)' in lines[i + 1]
          ]
          if len(starts) != 1:
              raise SystemExit(f"expected one old review query, found {len(starts)}")
          query_start = starts[0]
          query_end = next(
              (i for i in range(query_start + 1, len(lines)) if lines[i].strip() == '].join("");'),
              None,
          )
          if query_end is None:
              raise SystemExit("old review query end not found")
          del lines[query_start:query_end + 1]

          arg_indices = [
              i for i, line in enumerate(lines)
              if line.strip() == '...(cursor ? ["-f", `after=${cursor}`] : ["-f", "after="]),' 
          ]
          if len(arg_indices) != 1:
              raise SystemExit(f"expected one old cursor argument, found {len(arg_indices)}")
          arg_index = arg_indices[0]
          args_start = next(
              (i for i in range(arg_index - 1, -1, -1) if lines[i].strip() == "const args = ["),
              None,
          )
          if args_start is None:
              raise SystemExit("review args start not found")
          query_lines = [
              "      const query = [\n",
              "        cursor\n",
              "          ? \"query($number:Int!,$after:String!){\"\n",
              "          : \"query($number:Int!){\",\n",
              "        'repository(owner:\"siricarsen-cmd\",name:\"subshield\"){',\n",
              "        \"pullRequest(number:$number){\",\n",
              "        cursor\n",
              "          ? \"reviewThreads(first:100,after:$after){\"\n",
              "          : \"reviewThreads(first:100){\",\n",
              "        \"nodes{isResolved}\",\n",
              "        \"pageInfo{hasNextPage endCursor}\",\n",
              "        \"}}}}\",\n",
              "      ].join(\"\");\n",
          ]
          lines[args_start:args_start] = query_lines
          arg_index += len(query_lines)
          lines[arg_index] = '        ...(cursor ? ["-f", `after=${cursor}`] : []),\n'
          adapter_path.write_text("".join(lines), encoding="utf-8")

          test_path = Path("lib/regulatory/__tests__/registry-implementation-merge-production-adapter.test.mjs")
          test_lines = test_path.read_text(encoding="utf-8").splitlines(keepends=True)

          harness_starts = [
              i for i, line in enumerate(test_lines)
              if 'const after = api.find(value => value.startsWith("after="))' in line
          ]
          if len(harness_starts) != 1:
              raise SystemExit(f"expected one old harness cursor block, found {len(harness_starts)}")
          harness_start = harness_starts[0]
          paginate_start = next(
              (i for i in range(harness_start + 1, len(test_lines)) if test_lines[i].startswith('if (api.includes("--paginate")')),
              None,
          )
          if paginate_start is None or paginate_start < 2 or test_lines[paginate_start - 1].strip() != "}":
              raise SystemExit("harness closing boundary not found")
          harness_end = paginate_start - 1
          new_harness = [
              '  const afterArguments = api.filter(value => value.startsWith("after="));\n',
              '  const hasAfterVariable = query.includes("$after");\n',
              '  const hasAfterField = query.includes("after:$after");\n',
              '  if (afterArguments.length === 0) {\n',
              '    if (hasAfterVariable || hasAfterField) fail("first-page cursor must be omitted");\n',
              '    output({\n',
              '      data: { repository: { pullRequest: { reviewThreads: {\n',
              '        nodes: [{ isResolved: !state.unresolvedThread }],\n',
              '        pageInfo: { hasNextPage: true, endCursor: state.missingThreadCursor ? null : "cursor-1" }\n',
              '      } } } }\n',
              '    });\n',
              '  }\n',
              '  if (\n',
              '    afterArguments.length !== 1 ||\n',
              '    afterArguments[0] !== "after=cursor-1" ||\n',
              '    !hasAfterVariable ||\n',
              '    !hasAfterField\n',
              '  ) fail("wrong review thread cursor");\n',
              '  output({\n',
              '    data: { repository: { pullRequest: { reviewThreads: {\n',
              '      nodes: [{ isResolved: true }],\n',
              '      pageInfo: { hasNextPage: false, endCursor: null }\n',
              '    } } } }\n',
              '  });\n',
          ]
          test_lines[harness_start:harness_end] = new_harness

          assertion_starts = [
              i - 1 for i, line in enumerate(test_lines)
              if 'ghCalls.filter((call) => call.argv.includes("graphql")).length' in line
              and i > 0
              and test_lines[i - 1].strip() == "equal("
          ]
          if len(assertion_starts) != 1:
              raise SystemExit(f"expected one old cursor assertion, found {len(assertion_starts)}")
          assertion_start = assertion_starts[0]
          assertion_end = next(
              (i for i in range(assertion_start + 1, len(test_lines)) if test_lines[i].strip() == ");"),
              None,
          )
          if assertion_end is None:
              raise SystemExit("old cursor assertion end not found")
          new_assertions = [
              '  const reviewThreadCalls = ghCalls.filter(\n',
              '    (call) =>\n',
              '      call.argv.includes("graphql") &&\n',
              '      !call.argv.some((value) => value.includes("updateRefs"))\n',
              '  );\n',
              '  equal(\n',
              '    reviewThreadCalls.length,\n',
              '    2,\n',
              '    "review-thread cursor pagination requests every page"\n',
              '  );\n',
              '  const firstReviewThreadQuery =\n',
              '    reviewThreadCalls[0].argv.find((value) => value.startsWith("query=")) ?? "";\n',
              '  const secondReviewThreadQuery =\n',
              '    reviewThreadCalls[1].argv.find((value) => value.startsWith("query=")) ?? "";\n',
              '  check(\n',
              '    !firstReviewThreadQuery.includes("$after") &&\n',
              '      !firstReviewThreadQuery.includes("after:$after") &&\n',
              '      !reviewThreadCalls[0].argv.some((value) => value.startsWith("after=")),\n',
              '    "first review-thread request omits every cursor declaration, field, and argument"\n',
              '  );\n',
              '  check(\n',
              '    secondReviewThreadQuery.includes("$after:String!") &&\n',
              '      secondReviewThreadQuery.includes("after:$after") &&\n',
              '      reviewThreadCalls[1].argv.filter((value) => value === "after=cursor-1").length === 1,\n',
              '    "later review-thread request uses the exact returned cursor"\n',
              '  );\n',
          ]
          test_lines[assertion_start:assertion_end + 1] = new_assertions
          test_path.write_text("".join(test_lines), encoding="utf-8")
          PY

      - if: steps.gate.outputs.run == 'true'
        run: npm ci

      - if: steps.gate.outputs.run == 'true'
        run: npm run test:regulatory:implementation-merge-production-adapter

      - name: Commit and push exact correction
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected=$'lib/regulatory/__tests__/registry-implementation-merge-production-adapter.test.mjs\nlib/regulatory/registry-implementation-merge-production-adapter.ts'
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/regulatory/registry-implementation-merge-production-adapter.ts lib/regulatory/__tests__/registry-implementation-merge-production-adapter.test.mjs
          git commit -m "Fix initial review thread pagination cursor"
          git push origin HEAD:feat/regulatory-implementation-merge-authorization
