name: Aurora Short Notice Fix Generator

on:
  push:
    branches: [fix/aurora-short-notice-false-positive]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/aurora-short-notice-false-positive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply bounded fix
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('lib/analyzer/deterministic.ts')
          s = p.read_text()
          marker = 'const CATEGORIES: DeterministicCategory[] = ['
          helper = r'''const SHORT_NOTICE_DAY_COUNT_SOURCE = String.raw`(?:\d{1,3}|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty)`;
const SUBCONTRACTOR_NOTICE_DUTY_RE = new RegExp(
  String.raw`\bSubcontractor\b[^.]{0,120}\b(?:must|shall|is\s+required\s+to)\b[^.]{0,100}\b(?:notify|provide|give|submit)\b[^.]{0,140}\b(?:within|no\s+later\s+than)\s+${SHORT_NOTICE_DAY_COUNT_SOURCE}\s*(?:calendar|business|working)?\s*days?\b`,
  "i"
);
const PROTECTIVE_SHORT_NOTICE_RE =
  /\b(?:does|shall|will|may|can)\s+not\s+(?:waive|forfeit|bar|relinquish)|\b(?:is|are|shall|will)\s+not\s+(?:be\s+)?(?:waived|forfeited|barred)|\bunless\b[^.]{0,180}\bmaterial\s+prejudice\b|\bunless\b[^.]{0,180}\b(?:Prime(?:\s+Contractor)?|Prime)\b[^.]{0,100}\b(?:demonstrates?|shows?|establishes?)\b[^.]{0,80}\bprejudice\b/i;
const AFFIRMATIVE_SHORT_NOTICE_CONSEQUENCE_RE =
  /(?<!not\s)(?:waiv(?:e|es|ed)|forfeit(?:s|ed)?|bar(?:s|red)?|relinquish(?:es|ed)?|constitutes?\s+(?:a\s+)?(?:complete\s+)?waiver|results?\s+in\s+(?:a\s+)?(?:complete\s+)?waiver|deemed\s+waived)[^.]{0,240}(?:request\s+for\s+equitable\s+adjustment|\bclaim\b|additional\s+compensation|\bcompensation\b|delay\s+relief|schedule\s+(?:relief|extension)|time\s+extension|adjustment\s+rights?)/i;
const REVERSED_SHORT_NOTICE_CONSEQUENCE_RE =
  /(?:request\s+for\s+equitable\s+adjustment|\bclaim\b|additional\s+compensation|\bcompensation\b|delay\s+relief|schedule\s+(?:relief|extension)|time\s+extension|adjustment\s+rights?)[^.]{0,180}(?<!not\s)(?:is|are|shall\s+be|will\s+be|must\s+be)?\s*(?:deemed\s+)?(?:waived|forfeited|barred|relinquished)/i;

export function hasShortNoticeWaiverRiskEvidence(text: string): boolean {
  if (!SUBCONTRACTOR_NOTICE_DUTY_RE.test(text)) return false;
  if (PROTECTIVE_SHORT_NOTICE_RE.test(text)) return false;
  return AFFIRMATIVE_SHORT_NOTICE_CONSEQUENCE_RE.test(text) || REVERSED_SHORT_NOTICE_CONSEQUENCE_RE.test(text);
}

function findShortNoticeWaiverCandidate(documentText: string): string | null {
  return findClauseCandidate(documentText, hasShortNoticeWaiverRiskEvidence);
}

'''
          assert marker in s
          s = s.replace(marker, helper + marker, 1)
          start_marker = '  {\n    familyKey: "payment",\n    regulation: "Short Notice-of-Claim / Change Notice Waiver",'
          end_marker = '  {\n    familyKey: "structure",\n    regulation: "Missing / Deferred Contract Documents",'
          start = s.index(start_marker)
          end = s.index(end_marker, start)
          category = '''  {
    familyKey: "payment",
    regulation: "Short Notice-of-Claim / Change Notice Waiver",
    severity: "Medium-High",
    patterns: [],
    findCandidate: findShortNoticeWaiverCandidate,
    riskAnalysis:
      "This clause conditions the Subcontractor's right to compensation or a schedule extension on giving notice within a narrow window, meaning a missed or late notice - even for a legitimate change or delay caused by the Prime or Government - can permanently forfeit the Subcontractor's claim.",
    redlineFix:
      "Extend the notice period to a commercially reasonable window, add a materiality/prejudice qualifier so late notice does not forfeit the claim unless it actually prejudiced the Prime, and add a reasonable-excuse exception.",
  },
'''
          p.write_text(s[:start] + category + s[end:])

          p = Path('lib/analyzer/sanity.ts')
          s = p.read_text()
          import_marker = '  hasTerminationForConvenienceRiskEvidence,\n'
          assert import_marker in s
          s = s.replace(import_marker, import_marker + '  hasShortNoticeWaiverRiskEvidence,\n', 1)
          guard_marker = '  // (B) Bare prime-contract identifier:'
          assert guard_marker in s
          guard = r'''  // Require finding-local proof that the Subcontractor owns the deadline and
  // that missing it affirmatively waives/forfeits a claim or adjustment.
  // Express anti-waiver/material-prejudice language is protective, not risky.
  if (
    finding.familyKey === "payment" &&
    NOTICE_WAIVER_REGULATION_RE.test(finding.regulation) &&
    !hasShortNoticeWaiverRiskEvidence(finding.foundText)
  ) {
    return "Finding's own verified quote does not establish a mandatory Subcontractor short-notice obligation with an affirmative claim/adjustment forfeiture consequence, or it contains express anti-waiver/material-prejudice protection; not a short notice-of-claim trap.";
  }

'''
          p.write_text(s.replace(guard_marker, guard + guard_marker, 1))

          Path('lib/analyzer/__tests__/short-notice-protective-regression.test.mjs').write_text(r'''import { runDeterministicDetectors, hasShortNoticeWaiverRiskEvidence } from "../deterministic.ts";
import { verifyFindings } from "../sanity.ts";

const R = "Short Notice-of-Claim / Change Notice Waiver";
const invoice = "Prime Contractor will notify Subcontractor of any invoice defect within 7 business days after receipt and will provide a reasonable opportunity to correct it. A late or corrected invoice does not waive Subcontractor's right to payment.";
const aurora = "Subcontractor should notify Prime Contractor within 15 business days after recognizing a potential change. A later notice does not waive adjustment rights unless Prime Contractor demonstrates material prejudice caused by the delay.";
const orion = "If Subcontractor believes any Prime Contractor direction changes scope, price, staffing, deliverables, security requirements, or schedule, Subcontractor must notify Prime Contractor in writing within 2 business days after receiving the direction. Failure to provide timely notice waives Subcontractor's right to request additional compensation, equitable adjustment, or schedule relief related to the direction.";
const variants = [
  [false, "Prime Contractor shall notify Subcontractor of a billing defect within 5 calendar days. A delayed invoice shall not forfeit Subcontractor's entitlement to payment."],
  [false, "Subcontractor must give written notice to Prime Contractor within 4 calendar days after recognizing a potential change. Failure to provide timely notice does not waive Subcontractor's right to an equitable adjustment unless Prime demonstrates material prejudice."],
  [false, "Subcontractor shall submit written notice no later than 3 business days after recognizing a change. Late notice shall not bar the claim unless Prime Contractor demonstrates material prejudice caused by the delay."],
  [true, "Subcontractor shall give written notice to Prime Contractor within 5 business days after recognizing a scope change. Failure to provide timely notice forfeits Subcontractor's entitlement to equitable adjustment and additional compensation."],
  [true, "Subcontractor is required to submit written notice no later than 3 calendar days after recognizing a delay. Missing the deadline bars the Subcontractor's claim for schedule relief."],
];
let failures = 0;
function check(label, condition) { if (condition) console.log(`PASS: ${label}`); else { console.error(`FAIL: ${label}`); failures++; } }
const find = (text) => runDeterministicDetectors(text).find((finding) => finding.regulation === R);
const model = (foundText) => ({ triggerType: "Contract Risk Trigger", regulation: R, severity: "Medium-High", foundText, riskAnalysis: "Late notice permanently waives compensation or schedule rights.", redlineFix: "Remove automatic waiver.", familyKey: "payment" });
check("A1 Aurora 7-day Prime invoice notice negative", !hasShortNoticeWaiverRiskEvidence(invoice) && !find(invoice));
check("A2 Aurora invoice model false positive rejected", verifyFindings([model(invoice)], invoice).verified.length === 0);
check("B1 Aurora 15-day anti-waiver/material-prejudice negative", !hasShortNoticeWaiverRiskEvidence(aurora) && !find(aurora));
check("B2 Aurora protected-change model false positive rejected", verifyFindings([model(aurora)], aurora).verified.length === 0);
const orionFinding = find(orion);
check("C1 Orion 2-day actual waiver positive", hasShortNoticeWaiverRiskEvidence(orion) && Boolean(orionFinding));
check("C2 Orion quote remains grounded", Boolean(orionFinding && orion.includes(orionFinding.foundText) && orionFinding.foundText.includes("2 business days") && orionFinding.foundText.includes("waives Subcontractor's right")));
check("C3 Orion model true positive survives sanity", verifyFindings([model(orion)], orion).verified.length === 1);
variants.forEach(([expected, text], index) => check(`D${index + 1} variant ${expected ? "positive" : "negative"} preserved`, Boolean(find(text)) === expected));
if (failures) { console.error(`\n${failures} check(s) failed.`); process.exit(1); }
console.log("\nAll Aurora/Orion short-notice regression checks passed.");
''')

          p = Path('package.json')
          s = p.read_text()
          old = 'lib/analyzer/__tests__/plain-text-parity-regression.test.mjs"'
          new = 'lib/analyzer/__tests__/plain-text-parity-regression.test.mjs && node --experimental-loader ./lib/analyzer/__tests__/ts-relative-import.loader.mjs lib/analyzer/__tests__/short-notice-protective-regression.test.mjs"'
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
      - run: npm ci
      - run: node --experimental-loader ./lib/analyzer/__tests__/ts-relative-import.loader.mjs lib/analyzer/__tests__/short-notice-protective-regression.test.mjs
      - run: npm run test:accuracy:core
      - run: npx tsc --noEmit
      - name: Commit bounded fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/analyzer/deterministic.ts lib/analyzer/sanity.ts lib/analyzer/__tests__/short-notice-protective-regression.test.mjs package.json
          git diff --cached --check
          git commit -m "Fix protective short-notice false positives"
          git push origin HEAD:fix/aurora-short-notice-false-positive
