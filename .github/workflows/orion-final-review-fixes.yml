name: Orion Final Review Fixes

on:
  push:
    branches:
      - fix/orion-parity-grounding-invoice-waiver
    paths:
      - .github/workflows/orion-final-review-fixes.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply three narrow review corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          deterministic_path = Path("lib/analyzer/deterministic.ts")
          deterministic = deterministic_path.read_text()

          old_object_prefix = r"(?:all|any|the|such|stated|those|Subcontractor[\s-]created)"
          new_object_prefix = r"(?:all|any|the|such|stated|those|Subcontractor(?:['\u2019]s|[\s-](?:created|owned)))"
          if old_object_prefix not in deterministic:
              raise SystemExit("Expected active Improvements object prefix was not found")
          deterministic = deterministic.replace(old_object_prefix, new_object_prefix, 1)

          old_attachment_guard = r'''  return /^\s*(?:[-–—:]\s*)?(?:is\s+)?$/i.test(betweenTitleAndStatus);'''
          new_attachment_guard = r'''  return /^\s*(?:\([A-Z0-9][A-Z0-9&/.\s-]{0,30}\)\s*)?(?:,\s*(?:dated|effective|revision|rev\.?|version)\s+[A-Za-z0-9,./\s-]{1,50}\s*)?(?:[-–—:]\s*)?(?:is\s+)?$/i.test(
    betweenTitleAndStatus
  );'''
          if old_attachment_guard not in deterministic:
              raise SystemExit("Expected Attachment List title/status guard was not found")
          deterministic = deterministic.replace(old_attachment_guard, new_attachment_guard, 1)

          old_forum_split = r'''    .split(/\s*;\s*|,\s*(?:but|however|while|whereas)\s+/i)'''
          new_forum_split = r'''    .split(
      /\s*;\s*|,\s*(?:but|however|while|whereas)\s+|\s+and\s+(?=(?:(?:all|any)\s+)?(?:actions?|lawsuits?|claims?|disputes?|proceedings?)\b[^.]{0,120}(?:(?:must|shall|will)\s+be|(?:is|are)\s+required\s+to\s+be)\s+(?:brought|filed)\b)/i
    )'''
          if old_forum_split not in deterministic:
              raise SystemExit("Expected forum clause splitter was not found")
          deterministic = deterministic.replace(old_forum_split, new_forum_split, 1)
          deterministic_path.write_text(deterministic)

          test_path = Path("lib/analyzer/__tests__/orion-parity-regression.test.mjs")
          tests = test_path.read_text()
          marker = '''if (failures > 0) {'''
          additions = '''for (const [label, clause] of [
  ["possessive Improvements grant", "Prime Contractor may use Subcontractor's Improvements without additional payment to Subcontractor."],
  ["owned Improvements grant", "Prime Contractor may use Subcontractor-owned Improvements without additional payment to Subcontractor."],
]) {
  const result = productionPath(`2.17 Improvements\n${clause}`);
  check(
    `${label}: genuine unpaid Prime use still triggers`,
    result.findings.some(
      (finding) => finding.regulation === "Conditioned Pre-Existing IP Retention / Unpaid Use of Improvements"
    )
  );
}

const plainAndOptionalThenMandatoryForum = productionPath(`
2.23 Venue
The parties may agree to venue in Fairfax County or another mutually convenient forum and any action shall be brought in Arlington County, Virginia.
`);
check(
  "plain-and optional forum does not hide later mandatory Arlington forum",
  plainAndOptionalThenMandatoryForum.findings.some(
    (finding) => finding.regulation === "Out-of-State Venue, Governing Law, or Arbitration Burden"
  )
);

const detailedAttachmentRows = productionPath(`
5. Attachment List
1. Statement of Work (SOW) Not included.
2. Prime Contract Flow-Down Matrix, dated July 1 - Not provided.
6. Certifications
Subcontractor certifies that its representations remain current.
`);
const detailedAttachmentFinding = detailedAttachmentRows.findings.find(
  (finding) => finding.regulation === "Missing / Deferred Contract Documents"
);
check(
  "parenthetical and dated Attachment List rows remain in bounded evidence",
  Boolean(
    detailedAttachmentFinding &&
      /Statement of Work/i.test(detailedAttachmentFinding.foundText) &&
      /Flow-Down Matrix/i.test(detailedAttachmentFinding.foundText)
  ),
  detailedAttachmentFinding?.foundText ?? "missing finding"
);
check(
  "detailed Attachment List rows do not pull in the next peer section",
  Boolean(detailedAttachmentFinding && !/Certifications/i.test(detailedAttachmentFinding.foundText)),
  detailedAttachmentFinding?.foundText ?? "missing finding"
);

'''
          if marker not in tests:
              raise SystemExit("Orion regression insertion marker was not found")
          tests = tests.replace(marker, additions + marker, 1)
          test_path.write_text(tests)
          PY

      - name: Run focused Orion regression suite
        run: npm run test:accuracy:orion

      - name: Run full analyzer accuracy suite
        run: npm run test:accuracy

      - name: Run TypeScript validation
        run: npx tsc --noEmit

      - name: Run production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
        run: npm run build

      - name: Commit verified fixes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/orion-final-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/analyzer/deterministic.ts lib/analyzer/__tests__/orion-parity-regression.test.mjs .github/workflows/orion-final-review-fixes.yml
          git diff --cached --check
          git commit -m "Resolve final Orion review findings"
          git push origin HEAD:fix/orion-parity-grounding-invoice-waiver
