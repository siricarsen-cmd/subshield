name: Billing Runtime Readiness

on:
  pull_request:
    paths:
      - "app/api/analyze-contract/**"
      - "app/api/auth/claim/**"
      - "app/api/create-checkout/**"
      - "app/api/create-portal/**"
      - "app/api/delete-review/**"
      - "app/api/webhooks/stripe/**"
      - "lib/app-base-url.ts"
      - "lib/billing-portal-customer.ts"
      - "lib/stripe.ts"
      - "lib/server-credit-database.ts"
      - "lib/checkout-session.ts"
      - "lib/credit-fulfillment.ts"
      - "lib/review-credit-lifecycle.ts"
      - "lib/stripe-credit-grants.ts"
      - "lib/stripe-plans.ts"
      - "lib/stripe-subscription-invoice.ts"
      - "lib/__tests__/billing-portal-customer.test.mjs"
      - "lib/__tests__/billing-runtime-readiness.test.mjs"
      - "lib/__tests__/credit-fulfillment.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/billing-runtime-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  billing-runtime-readiness:
    name: Secrets / URLs / credits / builds
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate request-time secrets and application URLs
        run: >-
          node --experimental-loader
          ./lib/analyzer/__tests__/ts-relative-import.loader.mjs
          lib/__tests__/billing-runtime-readiness.test.mjs

      - name: Preserve checkout, subscription, and credit behavior
        run: >-
          node --experimental-loader
          ./lib/analyzer/__tests__/ts-relative-import.loader.mjs
          lib/__tests__/credit-fulfillment.test.mjs

      - name: Preserve duplicate-customer billing portal behavior
        run: >-
          node --experimental-loader
          ./lib/analyzer/__tests__/ts-relative-import.loader.mjs
          lib/__tests__/billing-portal-customer.test.mjs

      - name: Lint changed TypeScript files
        run: >-
          npx eslint
          app/api/analyze-contract/route.ts
          app/api/auth/claim/route.ts
          app/api/create-checkout/route.ts
          app/api/create-portal/route.ts
          app/api/delete-review/route.ts
          app/api/webhooks/stripe/route.ts
          lib/app-base-url.ts
          lib/billing-portal-customer.ts
          lib/stripe.ts
          lib/server-credit-database.ts

      - name: Validate TypeScript
        run: npx tsc --noEmit

      - name: Preserve analyzer accuracy
        run: npm run test:accuracy

      - name: Preserve regulatory grounding
        run: npm run test:regulatory

      - name: Build production application
        env:
          VERCEL_ENV: production
          NEXT_PUBLIC_BASE_URL: https://www.subshield.net
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          NEXT_PUBLIC_STRIPE_PRICE_SINGLE_REVIEW_CYCLE: price_ci_single
          NEXT_PUBLIC_STRIPE_PRICE_ACTIVE_BIDDER_PLAN: price_ci_active
          NEXT_PUBLIC_STRIPE_PRICE_ENTERPRISE_PLAN: price_ci_enterprise
          OPENAI_API_KEY: sk-ci-placeholder
          RESEND_API_KEY: re_ci_placeholder
          CONTACT_FROM_EMAIL: ci@example.com
          CONTACT_TO_EMAIL: ci@example.com
        run: npm run build

      - name: Build Preview without server secrets
        env:
          VERCEL_ENV: preview
          VERCEL_URL: subshield-preview-ci.vercel.app
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_STRIPE_PRICE_SINGLE_REVIEW_CYCLE: price_ci_single
          NEXT_PUBLIC_STRIPE_PRICE_ACTIVE_BIDDER_PLAN: price_ci_active
          NEXT_PUBLIC_STRIPE_PRICE_ENTERPRISE_PLAN: price_ci_enterprise
        run: |
          rm -rf .next
          npm run build
