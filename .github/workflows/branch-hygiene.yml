name: Branch Hygiene

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/branch-hygiene.yml"
  pull_request:
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-hygiene
  cancel-in-progress: false

jobs:
  cleanup-existing:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: Remove verified historical branches
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main with push credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Delete merged and explicitly retired branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          declare -A seen=()
          deleted=0
          missing=0
          protected=0
          failures=0

          delete_verified_branch() {
            local branch="$1"

            if [[ -z "$branch" || -n "${seen[$branch]:-}" ]]; then
              return
            fi
            seen["$branch"]=1

            case "$branch" in
              "$DEFAULT_BRANCH"|main|backup/*|dependabot/*)
                echo "PRESERVE $branch"
                protected=$((protected + 1))
                return
                ;;
            esac

            if ! git check-ref-format --branch "$branch" >/dev/null 2>&1; then
              echo "REFUSE invalid branch name: $branch" >&2
              failures=$((failures + 1))
              return
            fi

            if ! git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "ABSENT $branch"
              missing=$((missing + 1))
              return
            fi

            if git push origin --delete "$branch"; then
              echo "DELETED $branch"
              deleted=$((deleted + 1))
            else
              echo "FAILED $branch" >&2
              failures=$((failures + 1))
            fi
          }

          mapfile -t merged_branches < <(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls?state=closed&per_page=100" \
              --jq '.[] | select(.merged_at != null) | .head.ref'
          )

          retired_branches=(
            "automation/pr61-invalidated-binding-cleanup"
            "automation/pr61-monotonic-transfer"
            "automation/pr61-terminal-invalidation"
            "automation/pr61-wallclock-test-isolation"
            "feat/regulatory-draft-human-review"
            "test/regulatory-live-source-smoke"
          )

          for branch in "${merged_branches[@]}" "${retired_branches[@]}"; do
            delete_verified_branch "$branch"
          done

          {
            echo "## Branch hygiene"
            echo
            echo "- Deleted: $deleted"
            echo "- Already absent: $missing"
            echo "- Preserved by policy: $protected"
            echo "- Failures: $failures"
            echo
            echo "Permanent exclusions: default branch, main, backup/*, and dependabot/*."
          } >> "$GITHUB_STEP_SUMMARY"

          if (( failures > 0 )); then
            exit 1
          fi

  cleanup-merged-head:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Remove newly merged branch
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out main with push credentials
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Delete the exact merged head when allowed
        shell: bash
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          case "$BRANCH_NAME" in
            ""|"$DEFAULT_BRANCH"|main|backup/*|dependabot/*)
              echo "Preserved by branch-hygiene policy: $BRANCH_NAME"
              exit 0
              ;;
          esac

          git check-ref-format --branch "$BRANCH_NAME" >/dev/null

          if ! git ls-remote --exit-code --heads origin "refs/heads/$BRANCH_NAME" >/dev/null 2>&1; then
            echo "Merged branch is already absent: $BRANCH_NAME"
            exit 0
          fi

          git push origin --delete "$BRANCH_NAME"
          echo "Deleted merged branch: $BRANCH_NAME"

  publish-pr107-validated-source:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == false &&
      github.event.pull_request.base.ref == 'fix/orion-parity-grounding-invoice-waiver' &&
      github.event.pull_request.head.ref == 'automation/pr107-final-publish-trigger' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Publish validated PR 107 source
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact PR 107 branch with push credentials
        uses: actions/checkout@v4
        with:
          ref: fix/orion-parity-grounding-invoice-waiver
          fetch-depth: 0

      - name: Confirm immutable temporary head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
          test -f .github/scripts/pr107_final_review_patch.py
          test -f lib/analyzer/.pr107-guard-trigger

      - name: Apply two bounded source fixes and six regressions
        run: python3 .github/scripts/pr107_final_review_patch.py

      - name: Verify bounded source edit scope and hashes
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff --name-only | sort | tr '\n' ' ')"
          expected="lib/analyzer/__tests__/orion-parity-regression.test.mjs lib/analyzer/deterministic.ts "
          test "$actual" = "$expected"
          echo "750997e1265c871249c28105ad64023109ff8424e0385b0c3b9afc47180435e6  lib/analyzer/deterministic.ts" | sha256sum --check --strict
          echo "a810ef1a9da95e5e11e2b34524721a08b2f5e106b9ca8947f096e7c439d42b98  lib/analyzer/__tests__/orion-parity-regression.test.mjs" | sha256sum --check --strict

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run complete analyzer accuracy chain
        run: npm run test:accuracy

      - name: Validate TypeScript
        run: npx tsc --noEmit

      - name: Build production application
        env:
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          NEXT_PUBLIC_STRIPE_PRICE_SINGLE_REVIEW_CYCLE: price_ci_single
          NEXT_PUBLIC_STRIPE_PRICE_ACTIVE_BIDDER_PLAN: price_ci_active
          NEXT_PUBLIC_STRIPE_PRICE_ENTERPRISE_PLAN: price_ci_enterprise
          OPENAI_API_KEY: sk-ci-placeholder
          RESEND_API_KEY: re_ci_placeholder
          CONTACT_FROM_EMAIL: ci@example.com
          CONTACT_TO_EMAIL: ci@example.com
        run: npm run build

      - name: Remove temporary guard files and verify exact final scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/branch-hygiene.yml > .github/workflows/branch-hygiene.yml
          git show 73036f67d39f48fff72a6aa549dbf142ddef691a:.github/workflows/analyzer-accuracy.yml > .github/workflows/analyzer-accuracy.yml
          rm .github/scripts/pr107_final_review_patch.py
          rm lib/analyzer/.pr107-guard-trigger
          actual="$(git diff --name-only origin/main | sort | tr '\n' ' ')"
          expected="lib/analyzer/__fixtures__/orion-parity-regression-fixture.mjs lib/analyzer/__tests__/orion-parity-regression.test.mjs lib/analyzer/anchors.ts lib/analyzer/deterministic.ts lib/analyzer/sanity.ts package.json "
          echo "Final PR files: $actual"
          test "$actual" = "$expected"

      - name: Commit and push verified six-file candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix final exact-head review blockers"
          git push origin HEAD:fix/orion-parity-grounding-invoice-waiver
