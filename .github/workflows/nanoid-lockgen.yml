name: Nanoid Lockfile Generator

on:
  push:
    branches:
      - fix/nanoid-ghsa-2v37-7h3g-55p8
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  lockgen:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository branch
        uses: actions/checkout@v4
        with:
          ref: fix/nanoid-ghsa-2v37-7h3g-55p8
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Resolve smallest nanoid update in lockfile
        run: npm update nanoid --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Show resolved production dependency path
        run: |
          node -e "const l=require('./package-lock.json'); console.log('nanoid', l.packages['node_modules/nanoid']?.version); console.log('postcss', l.packages['node_modules/postcss']?.version); console.log('postcss->nanoid', l.packages['node_modules/postcss']?.dependencies?.nanoid)"
      - name: Production audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit npm-generated lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Resolve nanoid production advisory"
          git push origin HEAD:fix/nanoid-ghsa-2v37-7h3g-55p8
