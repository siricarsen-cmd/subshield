name: One-time source exactness fix

on:
  push:
    branches:
      - feat/regulatory-source-coverage-completion

permissions:
  contents: write

jobs:
  apply-source-exactness-fix:
    if: ${{ !contains(github.event.head_commit.message, '[source-exactness-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/regulatory-source-coverage-completion
          fetch-depth: 0

      - name: Update anchors, assertions, and documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, observed {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          package = 'lib/regulatory/source-coverage-citation-packages.ts'
          replace_once(package,
              'Service Contracts identifies wage rates for service employees under the Service Contract Act',
              'Service Contract Act (SCA)')
          replace_once(package, 'Search by wage determination number', 'Search by WD Number')
          replace_once(package,
              'startAnchor: "(6) Subcontracts. The contractor or subcontractor must insert",',
              'startAnchor: "(a)(6) Subcontracts. The contractor or subcontractor must insert",')
          replace_once(package,
              'to a Federal or State agency contracting for or financing the building or work',
              'to the agency contracting for or financing the building or work')
          replace_once(package,
              '"within seven days after the regular payment date",',
              '"within 7 days after the regular payment date",')
          replace_once(package,
              '"only process, store, or transmit FCI and not CUI",',
              '"only process, store, or transmit FCI (and not CUI)",')

          old_baseline = '''        locator: "CUI Registry — categories, authorities, and implementing guidance",
          startAnchor: "The CUI Registry is the Government-wide online repository",
          endAnchor:
            "Contractors should not follow CUI program requirements or markings until directed to do so in a contract or agreement",
          requiredAnchors: [
            "CUI categories, markings and controls",
            "safeguarding or dissemination authority",
            "government contracting activity",
          ],'''
          new_baseline = '''        locator: "CUI Registry — government-wide guidance and agency implementation",
          startAnchor: "Established by Executive Order 13556",
          endAnchor: "Registry Change Log",
          requiredAnchors: [
            "requires safeguarding or dissemination controls",
            "Government-wide online repository",
            "agency personnel and contractors should first consult",
            "Categories, Markings and Controls",
          ],'''
          replace_once(package, old_baseline, new_baseline)

          old_unmarked = '''        locator: "CUI Registry — category, authority, and contracting-activity guidance",
          startAnchor: "The CUI Registry is the Government-wide online repository",
          endAnchor:
            "Contractors should not follow CUI program requirements or markings until directed to do so in a contract or agreement",
          requiredAnchors: [
            "category description, category marking, and safeguarding or dissemination authority",
            "Questions regarding the status of marked or unmarked information",
            "government contracting activity",
          ],'''
          new_unmarked = '''        locator: "CUI Registry — program scope and agency implementation guidance",
          startAnchor: "Established by Executive Order 13556",
          endAnchor: "Registry Change Log",
          requiredAnchors: [
            "requires safeguarding or dissemination controls",
            "Government-wide online repository",
            "agency personnel and contractors should first consult",
            "Categories, Markings and Controls",
          ],'''
          replace_once(package, old_unmarked, new_unmarked)

          test = 'lib/regulatory/__tests__/source-coverage-citation-packages.test.mjs'
          replace_once(test,
              '/within seven days after the regular payment date/i.test(citation.excerpt)',
              '/within 7 days after the regular payment date/i.test(citation.excerpt)')

          old_baseline_test = '''check(
  "CUI source coverage does not authorize blanket treatment of every Prime record as CUI",
  baseline.prohibitedInferences.some((item) => /Do not infer that every subcontractor system is covered/i.test(item)) &&
    baseline.citations.some(
      (citation) =>
        citation.sourceId === "cui-registry" &&
        /category description, category marking, and safeguarding or dissemination authority/i.test(
          citation.excerpt
        )
    )
);'''
          new_baseline_test = '''check(
  "CUI source coverage preserves government-wide guidance and agency implementation without proving a specific category",
  baseline.prohibitedInferences.some((item) => /Do not infer that every subcontractor system is covered/i.test(item)) &&
    baseline.citations.some(
      (citation) =>
        citation.sourceId === "cui-registry" &&
        /Government-wide online repository/i.test(citation.excerpt) &&
        /agency personnel and contractors should first consult/i.test(citation.excerpt)
    )
);'''
          replace_once(test, old_baseline_test, new_baseline_test)

          old_unmarked_test = '''check(
  "unmarked-CUI package directs status questions to authoritative category and contracting-activity facts",
  unmarked.citations.some(
    (citation) =>
      citation.sourceId === "cui-registry" &&
      /Questions regarding the status of marked or unmarked information/i.test(citation.excerpt) &&
      /government contracting activity/i.test(citation.excerpt)
  ) &&
    unmarked.regulatoryApplicabilityStatus === "Not established"
);'''
          new_unmarked_test = '''check(
  "unmarked-CUI package preserves program scope and agency implementation guidance without claiming category proof",
  unmarked.citations.some(
    (citation) =>
      citation.sourceId === "cui-registry" &&
      /requires safeguarding or dissemination controls/i.test(citation.excerpt) &&
      /agency personnel and contractors should first consult/i.test(citation.excerpt)
  ) &&
    unmarked.regulatoryApplicabilityStatus === "Not established"
);'''
          replace_once(test, old_unmarked_test, new_unmarked_test)

          docs = 'docs/accuracy/regulatory-source-coverage-v1.md'
          old_docs = '''The controlled CUI source preserves that the Registry supplies government-wide categories, markings, controls, and authority information, while agency and contract implementation facts remain necessary.

A Prime or customer representative's unsupported label may create a conservative contractual handling duty under the subcontract, but the benchmark does not treat that label alone as proof of a federal CUI category or authority.'''
          new_docs = '''The controlled CUI source establishes that the program concerns unclassified information requiring safeguarding or dissemination controls pursuant to law, Federal regulations, and Government-wide policies. It also establishes that the Registry is the Government-wide repository for Federal-level guidance and directs agency personnel and contractors to consult agency implementing policies and program management. The retained excerpt does not identify a particular CUI category or authority.

A Prime or customer representative's unsupported label may create a conservative contractual handling duty under the subcontract, but the benchmark does not treat that label alone as proof of a federal CUI category or authority.'''
          replace_once(docs, old_docs, new_docs)

          Path('.github/workflows/one-time-source-exactness-fix.yml').unlink()
          PY

      - name: Commit source-exact corrections
        shell: bash
        run: |
          git config user.name "subshield-automation"
          git config user.email "actions@users.noreply.github.com"
          git add lib/regulatory/source-coverage-citation-packages.ts \
            lib/regulatory/__tests__/source-coverage-citation-packages.test.mjs \
            docs/accuracy/regulatory-source-coverage-v1.md \
            .github/workflows/one-time-source-exactness-fix.yml
          git commit -m "fix: enforce source-exact regulatory excerpts [source-exactness-fixed]"
          git push origin HEAD:feat/regulatory-source-coverage-completion
