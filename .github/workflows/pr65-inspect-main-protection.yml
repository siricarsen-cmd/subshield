name: PR65 Inspect Main Protection

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.pull_request.head.ref == 'feat/regulatory-implementation-merge-authorization'
    runs-on: ubuntu-latest
    steps:
      - name: Inspect branch protection and rulesets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo '--- branch protection ---'
          gh api repos/siricarsen-cmd/subshield/branches/main/protection \
            --jq '{required_status_checks, enforce_admins, required_pull_request_reviews, restrictions, required_linear_history, allow_force_pushes, allow_deletions, required_conversation_resolution}'
          echo "branch-protection-exit=$?"
          echo '--- rulesets ---'
          gh api 'repos/siricarsen-cmd/subshield/rulesets?includes_parents=true' \
            --jq 'map({id,name,target,enforcement,bypass_actors,conditions,rules})'
          echo "rulesets-exit=$?"
          exit 0
