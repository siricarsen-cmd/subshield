name: Analyzer Accuracy Benchmarks

on:
  pull_request:
    paths:
      - "lib/analyzer/**"
      - "lib/regulatory/benchmark-applicability-mappings.ts"
      - "lib/regulatory/historical-grounding-policy.ts"
      - "lib/regulatory/source-coverage-citation-packages.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/analyzer-accuracy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-final-codex-edge-fixes:
    name: Apply final Codex edge fixes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/orion-parity-grounding-invoice-waiver
          fetch-depth: 0

      - name: Detect correction task
        id: gate
        shell: bash
        run: |
          if test -f ORION_FINAL_CODEX_EDGE_PATCH.py; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js 24
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: Apply reviewed corrections
        if: steps.gate.outputs.run == 'true'
        run: python3 ORION_FINAL_CODEX_EDGE_PATCH.py

      - name: Run Orion regression suite
        if: steps.gate.outputs.run == 'true'
        run: npm run test:accuracy:orion

      - name: Run full accuracy suite
        if: steps.gate.outputs.run == 'true'
        run: npm run test:accuracy

      - name: Validate TypeScript
        if: steps.gate.outputs.run == 'true'
        run: npx tsc --noEmit

      - name: Build production application
        if: steps.gate.outputs.run == 'true'
        env:
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          NEXT_PUBLIC_STRIPE_PRICE_SINGLE_REVIEW_CYCLE: price_ci_single
          NEXT_PUBLIC_STRIPE_PRICE_ACTIVE_BIDDER_PLAN: price_ci_active
          NEXT_PUBLIC_STRIPE_PRICE_ENTERPRISE_PLAN: price_ci_enterprise
          OPENAI_API_KEY: sk-ci-placeholder
          RESEND_API_KEY: re_ci_placeholder
          CONTACT_FROM_EMAIL: ci@example.com
          CONTACT_TO_EMAIL: ci@example.com
        run: npm run build

      - name: Restore workflow, remove task, and commit
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          git show 6dd980ce8083e34e3232ed781f093871c5f72c5d:.github/workflows/analyzer-accuracy.yml > .github/workflows/analyzer-accuracy.yml
          rm ORION_FINAL_CODEX_EDGE_PATCH.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/analyzer/deterministic.ts lib/analyzer/__tests__/orion-parity-regression.test.mjs .github/workflows/analyzer-accuracy.yml ORION_FINAL_CODEX_EDGE_PATCH.py
          git commit -m "Cover described invoices, Prime affiliates, and venue branches"
          git push origin HEAD:fix/orion-parity-grounding-invoice-waiver

  accuracy-benchmarks:
    name: QA-B / QA-C / QA-D / QA-E1
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run QA-B / QA-D / QA-E1 core benchmark
        id: core
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run test:accuracy:core 2>&1 | tee core-accuracy-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload core benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-accuracy-output
          path: core-accuracy-output.txt
          if-no-files-found: error

      - name: Run QA-C cyber benchmark
        id: qa_c
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run test:accuracy:qa-c 2>&1 | tee qa-c-accuracy-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload QA-C benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-c-accuracy-output
          path: qa-c-accuracy-output.txt
          if-no-files-found: error

      - name: Validate TypeScript
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx tsc --noEmit 2>&1 | tee typescript-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload TypeScript output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-output
          path: typescript-output.txt
          if-no-files-found: error

      - name: Build production application
        id: build
        continue-on-error: true
        shell: bash
        env:
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          NEXT_PUBLIC_STRIPE_PRICE_SINGLE_REVIEW_CYCLE: price_ci_single
          NEXT_PUBLIC_STRIPE_PRICE_ACTIVE_BIDDER_PLAN: price_ci_active
          NEXT_PUBLIC_STRIPE_PRICE_ENTERPRISE_PLAN: price_ci_enterprise
          OPENAI_API_KEY: sk-ci-placeholder
          RESEND_API_KEY: re_ci_placeholder
          CONTACT_FROM_EMAIL: ci@example.com
          CONTACT_TO_EMAIL: ci@example.com
        run: |
          set +e
          npm run build 2>&1 | tee production-build-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload production build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-build-output
          path: production-build-output.txt
          if-no-files-found: error

      - name: Enforce all validation results
        if: always()
        shell: bash
        run: |
          core_status="${{ steps.core.outputs.status }}"
          qa_c_status="${{ steps.qa_c.outputs.status }}"
          typecheck_status="${{ steps.typecheck.outputs.status }}"
          build_status="${{ steps.build.outputs.status }}"
          echo "Core benchmark status: ${core_status:-missing}"
          echo "QA-C benchmark status: ${qa_c_status:-missing}"
          echo "TypeScript status: ${typecheck_status:-missing}"
          echo "Production build status: ${build_status:-missing}"
          test "$core_status" = "0"
          test "$qa_c_status" = "0"
          test "$typecheck_status" = "0"
          test "$build_status" = "0"
