name: Analyzer Accuracy Benchmarks

on:
  pull_request:
    paths:
      - "lib/analyzer/**"
      - ".github/scripts/apply-orion-scope.py"
      - ".github/workflows/analyzer-accuracy.yml"

permissions:
  contents: write

jobs:
  apply-orion-scope-correction:
    name: Apply Orion scope correction
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'fix/orion-parity-grounding-invoice-waiver'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/orion-parity-grounding-invoice-waiver
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply reviewed corrections
        run: python .github/scripts/apply-orion-scope.py

      - name: Install locked dependencies
        run: npm ci

      - name: Run analyzer accuracy suite
        run: npm run test:accuracy

      - name: Validate TypeScript
        run: npx tsc --noEmit

      - name: Build production application
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
        run: npm run build

      - name: Commit verified correction and remove temporary files
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/analyzer-accuracy.yml
          rm -f .github/scripts/apply-orion-scope.py
          rm -f .github/workflows/orion-scope-final.yml
          rm -f ORION_SCOPE_FINAL_TRIGGER.txt ORION_SCOPE_DIAGNOSTIC.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bind Orion guards to finding and payment scope"
          git push origin HEAD:fix/orion-parity-grounding-invoice-waiver
