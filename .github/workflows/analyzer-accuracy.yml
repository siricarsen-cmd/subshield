name: Analyzer Accuracy Benchmarks

on:
  pull_request:
    paths:
      - "lib/analyzer/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/analyzer-accuracy.yml"

permissions:
  contents: write

jobs:
  apply-verified-orion-hardening:
    name: Apply verified Orion hardening
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'fix/orion-parity-grounding-invoice-waiver'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/orion-parity-grounding-invoice-waiver
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply corrected reviewed patch
        shell: bash
        run: |
          python - <<'PY'
          import re
          import subprocess

          prior = subprocess.check_output(
              ["git", "show", "32473f4831137c644227c97377508879de23b769:.github/workflows/analyzer-accuracy.yml"],
              text=True,
          )
          match = re.search(r"python - <<'PY'\n(.*?)\n\s+PY", prior, re.S)
          if not match:
              raise SystemExit("Unable to extract the reviewed Orion hardening script")

          lines = match.group(1).splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          old = r'''function numberedBlockLooksLikeAttachmentRow(block: string): boolean {
            const sentenceEnd = block.search(/[.!?](?:\s|$)/);
            const firstSentence = sentenceEnd >= 0 ? block.slice(0, sentenceEnd + 1) : block;
            return ATTACHMENT_ROW_STATUS_RE.test(firstSentence);
          }'''
          new = r'''function numberedBlockLooksLikeAttachmentRow(block: string): boolean {
            return ATTACHMENT_ROW_STATUS_RE.test(block);
          }'''
          if script.count(old) != 1:
              raise SystemExit(f"Expected one numbered-row classifier, found {script.count(old)}")
          script = script.replace(old, new, 1)
          exec(compile(script, "<verified-orion-hardening>", "exec"))
          PY

      - name: Install locked dependencies
        run: npm ci

      - name: Run full analyzer accuracy suite
        run: npm run test:accuracy

      - name: Validate TypeScript
        run: npx tsc --noEmit

      - name: Build production application
        env:
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          NEXT_PUBLIC_STRIPE_PRICE_SINGLE_REVIEW_CYCLE: price_ci_single
          NEXT_PUBLIC_STRIPE_PRICE_ACTIVE_BIDDER_PLAN: price_ci_active
          NEXT_PUBLIC_STRIPE_PRICE_ENTERPRISE_PLAN: price_ci_enterprise
          OPENAI_API_KEY: sk-ci-placeholder
          RESEND_API_KEY: re_ci_placeholder
          CONTACT_FROM_EMAIL: ci@example.com
          CONTACT_TO_EMAIL: ci@example.com
        run: npm run build

      - name: Commit verified hardening and restore workflow
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/analyzer-accuracy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden Orion finding scope and attachment structure"
          git push origin HEAD:fix/orion-parity-grounding-invoice-waiver
