name: Analyzer Accuracy Benchmarks

on:
  pull_request:
    paths:
      - "lib/analyzer/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/analyzer-accuracy.yml"

permissions:
  contents: write

jobs:
  apply-final-orion-language-hardening:
    name: Apply final Orion language hardening
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'fix/orion-parity-grounding-invoice-waiver'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/orion-parity-grounding-invoice-waiver
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply reviewed language and structure hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              file_path.write_text(text.replace(old, new, 1))

          replace_once(
              'lib/analyzer/deterministic.ts',
              r'''const ATTACHMENT_ROW_STATUS_RE =
            /\b(?:included|not\s+included|to\s+be\s+provided|provided\s+after|not\s+attached|attached|missing|omitted)\b/i;''',
              r'''const ATTACHMENT_ROW_STATUS_RE =
            /\b(?:included|not\s+included|to\s+be\s+provided|provided\s+after|not\s+attached|attached|missing|omitted)\b/i;
          const ATTACHMENT_ROW_DOCUMENT_RE =
            /statement\s+of\s+work|\bSOW\b|prime\s+contract(?:\s+excerpts?)?|flow[\s-]?down\s+(?:lists?|matrix|matrices)|cybersecurity|CUI\s+requirements?|wage\s+determination|labor\s+category|quality\s+surveillance|acceptance\s+criteria|system\s+security\s+plan|\bSSP\b|(?:exhibit|attachment|appendix|schedule)\s+[A-Z0-9]/i;''',
              'attachment row document vocabulary',
          )

          replace_once(
              'lib/analyzer/deterministic.ts',
              r'''function numberedBlockLooksLikeAttachmentRow(block: string): boolean {
            return ATTACHMENT_ROW_STATUS_RE.test(block);
          }''',
              r'''function numberedBlockLooksLikeAttachmentRow(block: string): boolean {
            const content = block.replace(/^\s*(?:Section\s+)?\d+\.\s+/, "");
            const sentenceEnd = content.search(/[.!?](?:\s|$)/);
            const firstSentence = sentenceEnd >= 0 ? content.slice(0, sentenceEnd + 1) : content;
            return ATTACHMENT_ROW_DOCUMENT_RE.test(firstSentence) && ATTACHMENT_ROW_STATUS_RE.test(firstSentence);
          }''',
              'attachment row structural classifier',
          )

          replace_once(
              'lib/analyzer/deterministic.ts',
              r'''function hasPaymentRightPreservationEvidence(block: string): boolean {
            if (OTHER_INVOICE_SCOPE_RE.test(block) && !SAME_SCOPE_PAYMENT_REMAINS_RE.test(block)) return false;
            return EXPLICIT_PAYMENT_RIGHT_PRESERVED_RE.test(block) || SAME_SCOPE_PAYMENT_REMAINS_RE.test(block);
          }''',
              r'''function hasPaymentRightPreservationEvidence(block: string): boolean {
            const sentences = block.split(/(?<=[.!?])\s+/);
            return sentences.some((sentence) => {
              if (OTHER_INVOICE_SCOPE_RE.test(sentence)) return false;
              return EXPLICIT_PAYMENT_RIGHT_PRESERVED_RE.test(sentence) || SAME_SCOPE_PAYMENT_REMAINS_RE.test(sentence);
            });
          }''',
              'sentence-scoped payment preservation',
          )

          replace_once(
              'lib/analyzer/deterministic.ts',
              r'''const DIRECT_PRIME_ACTIVE_USE_RE =
            /(?:Prime\s+Contractor\b(?!['\u2019]s\b)(?!\s+(?:customer|client|affiliate|agency|end[\s-]?user)\b)|Prime\b(?!['\u2019]s\b)(?!\s+Contractor\b)(?!\s+(?:customer|client|affiliate|agency|end[\s-]?user)\b))\s+may\s+use/i;''',
              r'''const DIRECT_PRIME_ACTIVE_USE_RE =
            /(?:Prime\s+Contractor\b(?!['\u2019]s\b)(?!\s+(?:customer|client|affiliate|agency|end[\s-]?user)\b)|Prime\b(?!['\u2019]s\b)(?!\s+Contractor\b)(?!\s+(?:customer|client|affiliate|agency|end[\s-]?user)\b))\s+(?:(?:may|shall|will)\s+use|(?:has|shall\s+have|will\s+have)\s+the\s+right\s+to\s+use|(?:is|shall\s+be|will\s+be)\s+entitled\s+to\s+use)/i;''',
              'expanded direct Prime use grants',
          )

          replace_once(
              'lib/analyzer/deterministic.ts',
              r'''const VENUE_OR_ARBITRATION_EVIDENCE_RE =
            /(?:exclusive\s+)?(?:venue|jurisdiction)\s+(?:shall\s+be\s+|is\s+|lies\s+|must\s+be\s+)?(?:in|located\s+in)[^.]{0,120}(?:courts?|County|State|Commonwealth)|binding\s+arbitration|(?:(?:any\s+)?(?:action|lawsuit|claim|dispute|proceeding)|arbitration|mediation|court\s+proceeding)[^.]{0,180}(?:must|shall)\s+be\s+(?:brought|filed)\s+(?:exclusively\s+)?in|Prime(?:\s+Contractor)?\s+elects?\s+(?:another|a\s+different|an\s+alternate)\s+forum/i;''',
              r'''const BASE_FORUM_EVIDENCE_RE =
            /(?:exclusive\s+)?(?:venue|jurisdiction)\s+(?:shall\s+be\s+|is\s+|lies\s+|must\s+be\s+)?(?:in|located\s+in)[^.]{0,120}(?:courts?|County|State|Commonwealth)|binding\s+arbitration|Prime(?:\s+Contractor)?\s+elects?\s+(?:another|a\s+different|an\s+alternate)\s+forum/i;
          const DIRECT_MANDATORY_FORUM_RE =
            /(?:(?:(?:all|any)\s+)?(?:actions?|lawsuits?|claims?|disputes?|proceedings?)|arbitration|mediation|court\s+proceedings?)[^.]{0,180}(?:(?:must|shall|will)\s+be|(?:is|are)\s+required\s+to\s+be)\s+(?:brought|filed)\s+(?:exclusively\s+)?in/i;
          const EXCLUSIVE_FORUM_RE =
            /(?:the\s+)?exclusive\s+forum(?:\s+for[^.]{0,100})?\s+(?:shall|must|will)\s+be[^.]{0,140}(?:courts?|County|State|Commonwealth)/i;

          export function hasMandatoryForumEvidence(text: string): boolean {
            return BASE_FORUM_EVIDENCE_RE.test(text) || DIRECT_MANDATORY_FORUM_RE.test(text) || EXCLUSIVE_FORUM_RE.test(text);
          }''',
              'shared mandatory forum evidence',
          )

          deterministic_path = Path('lib/analyzer/deterministic.ts')
          deterministic = deterministic_path.read_text()
          deterministic = deterministic.replace(
              '      VENUE_OR_ARBITRATION_EVIDENCE_RE.test(block) &&',
              '      hasMandatoryForumEvidence(block) &&',
              1,
          )
          deterministic = deterministic.replace(
              '  if (VENUE_OR_ARBITRATION_EVIDENCE_RE.test(foundText)) {',
              '  if (hasMandatoryForumEvidence(foundText)) {',
              1,
          )
          deterministic_path.write_text(deterministic)

          sanity_path = Path('lib/analyzer/sanity.ts')
          sanity = sanity_path.read_text()
          import_old = '  hasTerminationForConvenienceRiskEvidence,\n  hasUnpaidPrimeImprovementsUseEvidence,'
          import_new = '  hasTerminationForConvenienceRiskEvidence,\n  hasMandatoryForumEvidence,\n  hasUnpaidPrimeImprovementsUseEvidence,'
          if sanity.count(import_old) != 1:
              raise SystemExit('mandatory forum helper import marker missing or duplicated')
          sanity = sanity.replace(import_old, import_new, 1)
          sanity, count = re.subn(
              r'  const forumBurdenEvidence =\n    /.*?\.test\(quote\);',
              '  const forumBurdenEvidence = hasMandatoryForumEvidence(quote);',
              sanity,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('forum evidence helper replacement failed')
          sanity_path.write_text(sanity)

          test_path = Path('lib/analyzer/__tests__/orion-parity-regression.test.mjs')
          tests = test_path.read_text()
          marker = 'const reverseIpActor = productionPath(`\n'
          additions = '''const performedWorkOtherInvoices = productionPath(`
          2.8 Invoice Requirements
          Failure to submit a complete invoice within 30 calendar days waives the right to payment for the affected invoice, but all amounts for performed work under other invoices remain payable.
          `);
          check(
            "performed-work amounts under other invoices do not hide affected-invoice forfeiture",
            performedWorkOtherInvoices.findings.some((finding) => finding.regulation === "Invoice Submission Deadline / Payment Waiver")
          );

          for (const [label, clause] of [
            ["Prime right-to-use grant", "Prime Contractor shall have the right to use Improvements without additional payment to Subcontractor."],
            ["Prime entitlement-to-use grant", "Prime Contractor is entitled to use Improvements without additional payment to Subcontractor."],
          ]) {
            const result = productionPath(`2.17 Improvements\n${clause}`);
            const finding = result.findings.find((candidate) => candidate.regulation === "Conditioned Pre-Existing IP Retention / Unpaid Use of Improvements");
            check(`${label}: direct unpaid Prime use triggers`, Boolean(finding));
            check(`${label}: analysis remains finding-local`, Boolean(finding && verifyFindings([finding], finding.foundText).verified.length === 1));
          }

          for (const [label, clause] of [
            ["exclusive forum", "The exclusive forum for all disputes shall be the state courts in Arlington County, Virginia."],
            ["all actions will", "All actions will be brought exclusively in Arlington County, Virginia."],
            ["required filing", "Any lawsuit is required to be filed in Arlington County, Virginia."],
          ]) {
            const result = productionPath(`2.23 Venue\n${clause}`);
            const finding = result.findings.find((candidate) => candidate.regulation === "Out-of-State Venue, Governing Law, or Arbitration Burden");
            check(`${label}: mandatory forum language triggers`, Boolean(finding));
            check(`${label}: mandatory forum analysis remains finding-local`, Boolean(finding && verifyFindings([finding], finding.foundText).verified.length === 1));
          }

          const certificationStatusWords = productionPath(`
          5. Attachment List
          Attachment B Prime Contract Flow-Down Matrix Not included in current package.
          6. Certifications
          The certifications included in this section remain current.
          `);
          const certificationBoundedMissing = certificationStatusWords.findings.find((finding) => finding.regulation === "Missing / Deferred Contract Documents");
          check(
            "structural Certifications section containing status words is excluded",
            Boolean(certificationBoundedMissing && !/Certifications|certifications included/i.test(certificationBoundedMissing.foundText)),
            certificationBoundedMissing?.foundText ?? "missing finding"
          );

          '''
          if tests.count(marker) != 1:
              raise SystemExit('final language hardening insertion marker missing or duplicated')
          test_path.write_text(tests.replace(marker, additions + marker, 1))
          PY

      - name: Install locked dependencies
        run: npm ci

      - name: Run full analyzer accuracy suite
        run: npm run test:accuracy

      - name: Validate TypeScript
        run: npx tsc --noEmit

      - name: Build production application
        env:
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          NEXT_PUBLIC_STRIPE_PRICE_SINGLE_REVIEW_CYCLE: price_ci_single
          NEXT_PUBLIC_STRIPE_PRICE_ACTIVE_BIDDER_PLAN: price_ci_active
          NEXT_PUBLIC_STRIPE_PRICE_ENTERPRISE_PLAN: price_ci_enterprise
          OPENAI_API_KEY: sk-ci-placeholder
          RESEND_API_KEY: re_ci_placeholder
          CONTACT_FROM_EMAIL: ci@example.com
          CONTACT_TO_EMAIL: ci@example.com
        run: npm run build

      - name: Commit verified hardening and restore workflow
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/analyzer-accuracy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand Orion payment IP venue and structure coverage"
          git push origin HEAD:fix/orion-parity-grounding-invoice-waiver
