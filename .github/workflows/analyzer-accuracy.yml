name: Analyzer Accuracy Benchmarks

on:
  pull_request:
    paths:
      - "lib/analyzer/**"
      - "lib/regulatory/benchmark-applicability-mappings.ts"
      - "lib/regulatory/historical-grounding-policy.ts"
      - "lib/regulatory/source-coverage-citation-packages.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/analyzer-accuracy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accuracy-benchmarks:
    name: QA-B / QA-C / QA-D / QA-E1
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run QA-B / QA-D / QA-E1 core benchmark
        id: core
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run test:accuracy:core 2>&1 | tee core-accuracy-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload core benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-accuracy-output
          path: core-accuracy-output.txt
          if-no-files-found: error

      - name: Run QA-C cyber benchmark
        id: qa_c
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run test:accuracy:qa-c 2>&1 | tee qa-c-accuracy-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload QA-C benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-c-accuracy-output
          path: qa-c-accuracy-output.txt
          if-no-files-found: error

      - name: Validate TypeScript
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx tsc --noEmit 2>&1 | tee typescript-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload TypeScript output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-output
          path: typescript-output.txt
          if-no-files-found: error

      - name: Build production application
        id: build
        continue-on-error: true
        shell: bash
        env:
          # Non-secret placeholders used only to let Next.js evaluate modules
          # during CI. No network, payment, email, database, or AI call is made.
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          NEXT_PUBLIC_STRIPE_PRICE_SINGLE_REVIEW_CYCLE: price_ci_single
          NEXT_PUBLIC_STRIPE_PRICE_ACTIVE_BIDDER_PLAN: price_ci_active
          NEXT_PUBLIC_STRIPE_PRICE_ENTERPRISE_PLAN: price_ci_enterprise
          OPENAI_API_KEY: sk-ci-placeholder
          RESEND_API_KEY: re_ci_placeholder
          CONTACT_FROM_EMAIL: ci@example.com
          CONTACT_TO_EMAIL: ci@example.com
        run: |
          set +e
          npm run build 2>&1 | tee production-build-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload production build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-build-output
          path: production-build-output.txt
          if-no-files-found: error

      - name: Enforce all validation results
        if: always()
        shell: bash
        run: |
          core_status="${{ steps.core.outputs.status }}"
          qa_c_status="${{ steps.qa_c.outputs.status }}"
          typecheck_status="${{ steps.typecheck.outputs.status }}"
          build_status="${{ steps.build.outputs.status }}"
          echo "Core benchmark status: ${core_status:-missing}"
          echo "QA-C benchmark status: ${qa_c_status:-missing}"
          echo "TypeScript status: ${typecheck_status:-missing}"
          echo "Production build status: ${build_status:-missing}"
          test "$core_status" = "0"
          test "$qa_c_status" = "0"
          test "$typecheck_status" = "0"
          test "$build_status" = "0"

  publish-pr65-squash-race-fix:
    name: Publish PR 65 squash-race correction
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/regulatory-implementation-merge-authorization'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Gate one-use publication
        id: gate
        shell: bash
        run: |
          if [ "$(git log -1 --pretty=%s)" = "Publish PR 65 concurrent squash correction v2" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply structural source and regression changes
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('lib/regulatory/registry-implementation-merge-authorization.ts')
          source_lines = source_path.read_text(encoding='utf-8').splitlines(keepends=True)

          sha_indices = [
              i for i, line in enumerate(source_lines)
              if line.strip() == 'SHA_RE.test(snapshot.mergeCommitSha ?? "") &&'
          ]
          if len(sha_indices) != 1:
              raise SystemExit(f'merge SHA predicate count: {len(sha_indices)}')
          if any('snapshot.mergeCommitSha === authorization.hostedHeadSha' in line for line in source_lines):
              raise SystemExit('merge SHA identity requirement already present')
          sha_index = sha_indices[0]
          indent = source_lines[sha_index][:-len(source_lines[sha_index].lstrip())]
          source_lines.insert(
              sha_index + 1,
              f'{indent}snapshot.mergeCommitSha === authorization.hostedHeadSha &&\n',
          )

          relationship_indices = [
              i for i, line in enumerate(source_lines)
              if 'status === "ambiguous-hosted-mutation"' in line
              and 'mutation === "accepted"' in line
              and 'mutation === "ambiguous"' in line
              and 'mutation === "refused"' not in line
          ]
          if len(relationship_indices) != 1:
              raise SystemExit(f'ambiguous outcome relationship count: {len(relationship_indices)}')
          relationship_index = relationship_indices[0]
          source_lines[relationship_index] = source_lines[relationship_index].replace(
              'mutation === "ambiguous"',
              'mutation === "ambiguous" || mutation === "refused"',
          )

          refused_starts = [
              i for i, line in enumerate(source_lines)
              if line.strip() == 'if (mutation.kind === "refused") {'
          ]
          if len(refused_starts) != 1:
              raise SystemExit(f'refused mutation branch count: {len(refused_starts)}')
          refused_start = refused_starts[0]
          refused_return = next(
              i for i in range(refused_start + 1, len(source_lines))
              if source_lines[i].strip() == 'return await terminalResult(authorization, binding, outcome);'
          )
          deterministic_else = [
              i for i in range(refused_start + 1, refused_return)
              if source_lines[i].strip() == '} else {'
              and any(
                  '"github-deterministic-refusal"' in source_lines[j]
                  for j in range(i + 1, min(i + 10, refused_return))
              )
          ]
          if len(deterministic_else) != 1:
              raise SystemExit(f'deterministic else count: {len(deterministic_else)}')
          else_index = deterministic_else[0]
          else_indent = source_lines[else_index][:-len(source_lines[else_index].lstrip())]
          inner = else_indent + '  '
          source_lines[else_index:else_index + 1] = [
              f'{else_indent}}} else if (postmergeSnapshot.merged) {{\n',
              f'{inner}outcome = buildHostedOutcome(\n',
              f'{inner}  authorization,\n',
              f'{inner}  "ambiguous-hosted-mutation",\n',
              f'{inner}  "concurrent-non-fast-forward-merge",\n',
              f'{inner}  "refused"\n',
              f'{inner});\n',
              f'{else_indent}}} else {{\n',
          ]
          source_path.write_text(''.join(source_lines), encoding='utf-8')

          test_path = Path('lib/regulatory/__tests__/registry-implementation-merge-authorization.test.mjs')
          test_lines = test_path.read_text(encoding='utf-8').splitlines(keepends=True)

          race_indices = [
              i for i, line in enumerate(test_lines)
              if line.strip() == 'if (state.alreadyMerged) { state.mainSha = state.headSha; state.merged = true; state.mergeSha = state.headSha; }'
          ]
          if len(race_indices) != 1:
              raise SystemExit(f'already-merged fixture count: {len(race_indices)}')
          race_index = race_indices[0]
          race_indent = test_lines[race_index][:-len(test_lines[race_index].lstrip())]
          test_lines[race_index:race_index + 1] = [
              f'{race_indent}if (state.alreadyMerged) {{\n',
              f'{race_indent}  const raceSha = state.concurrentSquash ? state.otherSha : state.headSha;\n',
              f'{race_indent}  state.mainSha = raceSha;\n',
              f'{race_indent}  state.merged = true;\n',
              f'{race_indent}  state.mergeSha = raceSha;\n',
              f'{race_indent}}}\n',
          ]

          option_indices = [
              i for i, line in enumerate(test_lines)
              if line.strip() == 'alreadyMerged: options.alreadyMerged === true,'
          ]
          if len(option_indices) != 1:
              raise SystemExit(f'already-merged option count: {len(option_indices)}')
          option_index = option_indices[0]
          option_indent = test_lines[option_index][:-len(test_lines[option_index].lstrip())]
          test_lines.insert(
              option_index + 1,
              f'{option_indent}concurrentSquash: options.concurrentSquash === true,\n',
          )

          labels = [
              i for i, line in enumerate(test_lines)
              if line.strip() == '"already merged race",'
          ]
          if len(labels) != 1:
              raise SystemExit(f'already-merged test label count: {len(labels)}')
          label_index = labels[0]
          case_end = next(
              i for i in range(label_index + 1, len(test_lines))
              if test_lines[i].strip() == '],'
          )
          array_indent = test_lines[label_index - 1][:-len(test_lines[label_index - 1].lstrip())]
          value_indent = array_indent + '  '
          test_lines[case_end + 1:case_end + 1] = [
              f'{array_indent}[\n',
              f'{value_indent}"concurrent squash race",\n',
              f'{value_indent}{{ mutationKind: "refused", alreadyMerged: true, concurrentSquash: true }},\n',
              f'{value_indent}"ambiguous-hosted-mutation",\n',
              f'{array_indent}],\n',
          ]

          retry_labels = [
              i for i, line in enumerate(test_lines)
              if line.strip() == '`${label} never retries`'
          ]
          if len(retry_labels) != 1:
              raise SystemExit(f'never-retries assertion count: {len(retry_labels)}')
          retry_label = retry_labels[0]
          retry_end = next(
              i for i in range(retry_label + 1, len(test_lines))
              if test_lines[i].strip() == ');'
          )
          statement_indent = test_lines[retry_end][:-len(test_lines[retry_end].lstrip())]
          inner_indent = statement_indent + '  '
          test_lines[retry_end + 1:retry_end + 1] = [
              f'{statement_indent}if (label === "concurrent squash race") {{\n',
              f'{inner_indent}check(\n',
              f'{inner_indent}  terminal.status === "terminal" &&\n',
              f'{inner_indent}    terminal.outcome.status === "ambiguous-hosted-mutation" &&\n',
              f'{inner_indent}    terminal.outcome.receipt === undefined,\n',
              f'{inner_indent}  "concurrent squash race emits no success receipt"\n',
              f'{inner_indent});\n',
              f'{statement_indent}}}\n',
          ]
          test_path.write_text(''.join(test_lines), encoding='utf-8')
          PY

      - name: Install locked dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: Run focused merge authorization suite
        if: steps.gate.outputs.run == 'true'
        run: npm run test:regulatory:implementation-merge-authorization

      - name: Run focused merge adapter suite
        if: steps.gate.outputs.run == 'true'
        run: npm run test:regulatory:implementation-merge-production-adapter

      - name: Verify and publish exact two-file change
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected=$'lib/regulatory/__tests__/registry-implementation-merge-authorization.test.mjs\nlib/regulatory/registry-implementation-merge-authorization.ts'
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/regulatory/registry-implementation-merge-authorization.ts lib/regulatory/__tests__/registry-implementation-merge-authorization.test.mjs
          git commit -m "Refuse concurrent squash as fast-forward race"
          git push origin HEAD:feat/regulatory-implementation-merge-authorization
