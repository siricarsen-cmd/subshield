name: Analyzer Accuracy Benchmarks

on:
  pull_request:
    paths:
      - "lib/analyzer/**"
      - "lib/regulatory/benchmark-applicability-mappings.ts"
      - "lib/regulatory/historical-grounding-policy.ts"
      - "lib/regulatory/source-coverage-citation-packages.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/analyzer-accuracy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  accuracy-benchmarks:
    name: QA-B / QA-C / QA-D / QA-E1
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run QA-B / QA-D / QA-E1 core benchmark
        id: core
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run test:accuracy:core 2>&1 | tee core-accuracy-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload core benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-accuracy-output
          path: core-accuracy-output.txt
          if-no-files-found: error

      - name: Run QA-C cyber benchmark
        id: qa_c
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run test:accuracy:qa-c 2>&1 | tee qa-c-accuracy-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload QA-C benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-c-accuracy-output
          path: qa-c-accuracy-output.txt
          if-no-files-found: error

      - name: Validate TypeScript
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx tsc --noEmit 2>&1 | tee typescript-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload TypeScript output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-output
          path: typescript-output.txt
          if-no-files-found: error

      - name: Build production application
        id: build
        continue-on-error: true
        shell: bash
        env:
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          NEXT_PUBLIC_STRIPE_PRICE_SINGLE_REVIEW_CYCLE: price_ci_single
          NEXT_PUBLIC_STRIPE_PRICE_ACTIVE_BIDDER_PLAN: price_ci_active
          NEXT_PUBLIC_STRIPE_PRICE_ENTERPRISE_PLAN: price_ci_enterprise
          OPENAI_API_KEY: sk-ci-placeholder
          RESEND_API_KEY: re_ci_placeholder
          CONTACT_FROM_EMAIL: ci@example.com
          CONTACT_TO_EMAIL: ci@example.com
        run: |
          set +e
          npm run build 2>&1 | tee production-build-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload production build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-build-output
          path: production-build-output.txt
          if-no-files-found: error

      - name: Enforce all validation results
        if: always()
        shell: bash
        run: |
          core_status="${{ steps.core.outputs.status }}"
          qa_c_status="${{ steps.qa_c.outputs.status }}"
          typecheck_status="${{ steps.typecheck.outputs.status }}"
          build_status="${{ steps.build.outputs.status }}"
          echo "Core benchmark status: ${core_status:-missing}"
          echo "QA-C benchmark status: ${qa_c_status:-missing}"
          echo "TypeScript status: ${typecheck_status:-missing}"
          echo "Production build status: ${build_status:-missing}"
          test "$core_status" = "0"
          test "$qa_c_status" = "0"
          test "$typecheck_status" = "0"
          test "$build_status" = "0"

  guarded-final-review-fixes:
    name: Guarded final review fixes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_BRANCH: ${{ github.head_ref }}

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Confirm temporary scope
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/scripts/pr107_final_review_patch.py
          test "$(git diff --name-only HEAD^ HEAD | sort | tr '\n' ' ')" = ".github/workflows/analyzer-accuracy.yml "
          test "$(git diff --name-only HEAD~2 HEAD^ | sort | tr '\n' ' ')" = ".github/scripts/pr107_final_review_patch.py "

      - name: Apply two bounded source fixes and six regressions
        run: python3 .github/scripts/pr107_final_review_patch.py

      - name: Verify source edit scope
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff --name-only | sort | tr '\n' ' ')"
          expected="lib/analyzer/__tests__/orion-parity-regression.test.mjs lib/analyzer/deterministic.ts "
          echo "Source changes: $actual"
          test "$actual" = "$expected"

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run complete analyzer accuracy chain
        run: npm run test:accuracy

      - name: Validate TypeScript
        run: npx tsc --noEmit

      - name: Build production application
        env:
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          NEXT_PUBLIC_STRIPE_PRICE_SINGLE_REVIEW_CYCLE: price_ci_single
          NEXT_PUBLIC_STRIPE_PRICE_ACTIVE_BIDDER_PLAN: price_ci_active
          NEXT_PUBLIC_STRIPE_PRICE_ENTERPRISE_PLAN: price_ci_enterprise
          OPENAI_API_KEY: sk-ci-placeholder
          RESEND_API_KEY: re_ci_placeholder
          CONTACT_FROM_EMAIL: ci@example.com
          CONTACT_TO_EMAIL: ci@example.com
        run: npm run build

      - name: Remove temporary guard and verify exact final scope
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/analyzer-accuracy.yml > .github/workflows/analyzer-accuracy.yml
          rm .github/scripts/pr107_final_review_patch.py
          git fetch origin main
          actual="$(git diff --name-only origin/main | sort | tr '\n' ' ')"
          expected="lib/analyzer/__fixtures__/orion-parity-regression-fixture.mjs lib/analyzer/__tests__/orion-parity-regression.test.mjs lib/analyzer/anchors.ts lib/analyzer/deterministic.ts lib/analyzer/sanity.ts package.json "
          echo "Final PR files: $actual"
          test "$actual" = "$expected"

      - name: Commit verified source candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix final exact-head review blockers"
          git push origin "HEAD:${TARGET_BRANCH}"
