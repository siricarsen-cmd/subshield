name: Analyzer Accuracy Benchmarks

on:
  pull_request:
    paths:
      - ".github/workflows/analyzer-accuracy.yml"
      - ".github/scripts/orion-governing-law-whitespace-fix.py"

permissions:
  contents: write

jobs:
  fix-governing-law-whitespace:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply verified analyzer patch
        run: python .github/scripts/orion-governing-law-whitespace-fix.py

      - name: Restore workflow, remove script, and commit
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/analyzer-accuracy.yml
          rm .github/scripts/orion-governing-law-whitespace-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/analyzer/deterministic.ts .github/workflows/analyzer-accuracy.yml .github/scripts/orion-governing-law-whitespace-fix.py
          git diff --cached --check
          git commit -m "Fix governing-law jurisdiction spacing"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
