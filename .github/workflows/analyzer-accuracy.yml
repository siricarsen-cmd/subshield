name: Analyzer Accuracy Benchmarks

on:
  pull_request:
    paths:
      - "lib/analyzer/**"
      - "lib/regulatory/benchmark-applicability-mappings.ts"
      - "lib/regulatory/historical-grounding-policy.ts"
      - "lib/regulatory/source-coverage-citation-packages.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/analyzer-accuracy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  accuracy-benchmarks:
    name: QA-B / QA-C / QA-D / QA-E1
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run QA-B / QA-D / QA-E1 core benchmark
        id: core
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run test:accuracy:core 2>&1 | tee core-accuracy-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload core benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-accuracy-output
          path: core-accuracy-output.txt
          if-no-files-found: error

      - name: Run QA-C cyber benchmark
        id: qa_c
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run test:accuracy:qa-c 2>&1 | tee qa-c-accuracy-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload QA-C benchmark output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-c-accuracy-output
          path: qa-c-accuracy-output.txt
          if-no-files-found: error

      - name: Validate TypeScript
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx tsc --noEmit 2>&1 | tee typescript-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload TypeScript output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-output
          path: typescript-output.txt
          if-no-files-found: error

      - name: Build production application
        id: build
        continue-on-error: true
        shell: bash
        env:
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          NEXT_PUBLIC_STRIPE_PRICE_SINGLE_REVIEW_CYCLE: price_ci_single
          NEXT_PUBLIC_STRIPE_PRICE_ACTIVE_BIDDER_PLAN: price_ci_active
          NEXT_PUBLIC_STRIPE_PRICE_ENTERPRISE_PLAN: price_ci_enterprise
          OPENAI_API_KEY: sk-ci-placeholder
          RESEND_API_KEY: re_ci_placeholder
          CONTACT_FROM_EMAIL: ci@example.com
          CONTACT_TO_EMAIL: ci@example.com
        run: |
          set +e
          npm run build 2>&1 | tee production-build-output.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload production build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-build-output
          path: production-build-output.txt
          if-no-files-found: error

      - name: Enforce all validation results
        if: always()
        shell: bash
        run: |
          core_status="${{ steps.core.outputs.status }}"
          qa_c_status="${{ steps.qa_c.outputs.status }}"
          typecheck_status="${{ steps.typecheck.outputs.status }}"
          build_status="${{ steps.build.outputs.status }}"
          echo "Core benchmark status: ${core_status:-missing}"
          echo "QA-C benchmark status: ${qa_c_status:-missing}"
          echo "TypeScript status: ${typecheck_status:-missing}"
          echo "Production build status: ${build_status:-missing}"
          test "$core_status" = "0"
          test "$qa_c_status" = "0"
          test "$typecheck_status" = "0"
          test "$build_status" = "0"

  harden-final-orion-edges:
    name: Harden final Orion edge cases
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'fix/orion-parity-grounding-invoice-waiver'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/orion-parity-grounding-invoice-waiver
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply structural grounding hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              file_path.write_text(text.replace(old, new, 1))

          replace_once(
              'lib/analyzer/deterministic.ts',
              r'''const ATTACHMENT_LIST_START_RE = /\b(?:(\d+)\.\s*)?Attachment\s+List\b/i;
          const ATTACHMENT_LIST_NAMED_END_RE =
            /\b(?:\d+\.\s*)?(?:Subcontractor\s+Questions\s+Form|Quote\s+Submission\s+Instructions)\b/i;
          const NUMBERED_SECTION_HEADING_RE =
            /\b(\d+)\.\s+(?!\d)(?:[A-Z][A-Za-z0-9/&()'\u2019-]*(?:\s+[A-Z][A-Za-z0-9/&()'\u2019-]*){0,10})\b/g;

          function findAttachmentListEnd(afterStart: string, attachmentSectionNumber: number | null): number | null {
            const namedEnd = ATTACHMENT_LIST_NAMED_END_RE.exec(afterStart)?.index ?? null;
            let numberedEnd: number | null = null;

            if (attachmentSectionNumber !== null) {
              NUMBERED_SECTION_HEADING_RE.lastIndex = 0;
              for (const match of afterStart.matchAll(NUMBERED_SECTION_HEADING_RE)) {
                const candidateNumber = Number(match[1]);
                if (candidateNumber > attachmentSectionNumber) {
                  numberedEnd = match.index ?? null;
                  break;
                }
              }
            }

            if (namedEnd === null) return numberedEnd;
            if (numberedEnd === null) return namedEnd;
            return Math.min(namedEnd, numberedEnd);
          }''',
              r'''interface AttachmentListStart {
            index: number;
            heading: string;
          }

          const ATTACHMENT_LIST_START_RE =
            /(?:\b(?:Section\s+)?\d+\.\s+Attachment\s+List\b|\bAttachment\s+List\s*:)/gi;
          const ATTACHMENT_LIST_REFERENCE_CONTEXT_RE =
            /(?:see|refer(?:red)?\s+to|review|consult)\s+(?:the\s+)?(?:section\s+)?$/i;
          const ATTACHMENT_LIST_NAMED_END_RE =
            /\b(?:\d+\.\s*)?(?:Subcontractor\s+Questions\s+Form|Quote\s+Submission\s+Instructions)\b/i;
          const NUMBERED_SECTION_HEADING_RE =
            /\b(?:Section\s+)?(\d+)\.\s+(?!\d)([A-Z][A-Za-z0-9/&()'\u2019-]*(?:\s+[A-Z][A-Za-z0-9/&()'\u2019-]*){0,10})\b/g;
          const ATTACHMENT_ROW_STATUS_RE =
            /\b(?:included|not\s+included|to\s+be\s+provided|provided\s+after|not\s+attached|attached|missing|omitted)\b/i;

          function findAttachmentListStart(documentText: string): AttachmentListStart | null {
            ATTACHMENT_LIST_START_RE.lastIndex = 0;
            for (const match of documentText.matchAll(ATTACHMENT_LIST_START_RE)) {
              const index = match.index ?? 0;
              const precedingContext = documentText.slice(Math.max(0, index - 48), index);
              if (ATTACHMENT_LIST_REFERENCE_CONTEXT_RE.test(precedingContext)) continue;
              return { index, heading: match[0] };
            }
            return null;
          }

          function numberedHeadingLooksLikeAttachmentRow(
            afterStart: string,
            matches: RegExpMatchArray[],
            index: number
          ): boolean {
            const match = matches[index];
            const start = match.index ?? 0;
            const nextStart = matches[index + 1]?.index ?? afterStart.length;
            const candidate = afterStart.slice(start, Math.min(nextStart, start + 320));
            const firstSentence = candidate.split(/[.!?](?:\s|$)/, 1)[0] ?? candidate;
            return ATTACHMENT_ROW_STATUS_RE.test(firstSentence);
          }

          function findAttachmentListEnd(afterStart: string): number | null {
            const namedEnd = ATTACHMENT_LIST_NAMED_END_RE.exec(afterStart)?.index ?? null;
            NUMBERED_SECTION_HEADING_RE.lastIndex = 0;
            const numberedMatches = [...afterStart.matchAll(NUMBERED_SECTION_HEADING_RE)];
            let numberedEnd: number | null = null;

            for (let index = 0; index < numberedMatches.length; index++) {
              if (numberedHeadingLooksLikeAttachmentRow(afterStart, numberedMatches, index)) continue;
              numberedEnd = numberedMatches[index].index ?? null;
              break;
            }

            if (namedEnd === null) return numberedEnd;
            if (numberedEnd === null) return namedEnd;
            return Math.min(namedEnd, numberedEnd);
          }''',
              'structural Attachment List start and end detection',
          )

          replace_once(
              'lib/analyzer/deterministic.ts',
              r'''  const start = ATTACHMENT_LIST_START_RE.exec(documentText);
            if (start) {
              const afterStart = documentText.slice(start.index + start[0].length);
              const attachmentSectionNumber = start[1] ? Number(start[1]) : null;
              const endOffset = findAttachmentListEnd(afterStart, attachmentSectionNumber);
              const finish = endOffset !== null
                ? start.index + start[0].length + endOffset
                : Math.min(documentText.length, start.index + 1800);
              const attachmentBlock = documentText
                .slice(start.index, finish)''',
              r'''  const start = findAttachmentListStart(documentText);
            if (start) {
              const afterStart = documentText.slice(start.index + start.heading.length);
              const endOffset = findAttachmentListEnd(afterStart);
              const finish = endOffset !== null
                ? start.index + start.heading.length + endOffset
                : Math.min(documentText.length, start.index + 1800);
              const attachmentBlock = documentText
                .slice(start.index, finish)''',
              'focused Attachment List range calculation',
          )

          replace_once(
              'lib/analyzer/deterministic.ts',
              r'''const PAYMENT_RIGHT_PRESERVED_RE =
            /(?:does|shall|will)\s+not\s+(?:waive|forfeit)[^.]{0,80}(?:right|entitlement)\s+to\s+payment|(?:right|entitlement)\s+to\s+payment[^.]{0,80}(?:is|shall|will)\s+not\s+(?:waived|forfeited)|(?:all\s+)?(?:amounts?|payment)[^.]{0,100}(?:remain|remains|shall\s+remain|will\s+remain)\s+(?:payable|due)/i;

          function findInvoicePaymentWaiverCandidate(documentText: string): string | null {
            return findClauseCandidate(
              documentText,
              (block) => INVOICE_PAYMENT_WAIVER_RE.test(block) && !PAYMENT_RIGHT_PRESERVED_RE.test(block)
            );
          }''',
              r'''const EXPLICIT_PAYMENT_RIGHT_PRESERVED_RE =
            /(?:does|shall|will)\s+not\s+(?:waive|forfeit)[^.]{0,80}(?:right|entitlement)\s+to\s+payment|(?:right|entitlement)\s+to\s+payment[^.]{0,80}(?:is|shall|will)\s+not\s+(?:waived|forfeited)/i;
          const SAME_SCOPE_PAYMENT_REMAINS_RE =
            /(?:except(?:\s+that)?|however|provided\s+that|but|notwithstanding)[^.]{0,180}(?:(?:affected|subject|late|delayed)\s+(?:invoice|amounts?|payment)|(?:amounts?|payment)\s+(?:for\s+(?:performed|completed|accepted)\s+(?:work|services|deliverables)|(?:for|under)\s+(?:the\s+)?(?:affected|subject|late|delayed)\s+invoice))[^.]{0,100}(?:remain|remains|shall\s+remain|will\s+remain)\s+(?:payable|due)/i;
          const REVERSE_SAME_SCOPE_PAYMENT_REMAINS_RE =
            /(?:(?:affected|subject|late|delayed)\s+(?:invoice|amounts?|payment)|(?:amounts?|payment)\s+(?:for\s+(?:performed|completed|accepted)\s+(?:work|services|deliverables)|(?:for|under)\s+(?:the\s+)?(?:affected|subject|late|delayed)\s+invoice))[^.]{0,100}(?:remain|remains|shall\s+remain|will\s+remain)\s+(?:payable|due)[^.]{0,100}(?:notwithstanding|despite)[^.]{0,80}(?:late|delayed|untimely)\s+invoice/i;
          const OTHER_INVOICE_SCOPE_RE = /\b(?:other|unrelated|separate)\s+invoices?\b/i;

          function hasPaymentRightPreservationEvidence(block: string): boolean {
            if (EXPLICIT_PAYMENT_RIGHT_PRESERVED_RE.test(block)) return true;
            if (OTHER_INVOICE_SCOPE_RE.test(block)) return false;
            return SAME_SCOPE_PAYMENT_REMAINS_RE.test(block) || REVERSE_SAME_SCOPE_PAYMENT_REMAINS_RE.test(block);
          }

          function findInvoicePaymentWaiverCandidate(documentText: string): string | null {
            return findClauseCandidate(
              documentText,
              (block) => INVOICE_PAYMENT_WAIVER_RE.test(block) && !hasPaymentRightPreservationEvidence(block)
            );
          }''',
              'same-scope payment-preservation guard',
          )

          old_ip = r'''const UNPAID_IMPROVEMENTS_USE_RE =
            /(?:improvements?|adaptations?)[^.]{0,180}may\s+be\s+used\s+by\s+Prime(?:\s+Contractor)?[^.]{0,160}without\s+(?:additional\s+)?(?:payment|compensation|charge|fee)|Prime(?:\s+Contractor)?\s+may\s+use[^.]{0,160}(?:improvements?|adaptations?)[^.]{0,160}without\s+(?:additional\s+)?(?:payment|compensation|charge|fee)/i;

          function findConditionedPreExistingIpCandidate(documentText: string): string | null {
            return findClauseCandidate(
              documentText,
              (block) => CONDITIONED_PREEXISTING_IP_RE.test(block) || UNPAID_IMPROVEMENTS_USE_RE.test(block)
            );
          }

          function buildConditionedPreExistingIpAnalysis(foundText: string): string {
            const conditioned = CONDITIONED_PREEXISTING_IP_RE.test(foundText);
            const unpaidUse = UNPAID_IMPROVEMENTS_USE_RE.test(foundText);'''
          new_ip = r'''const DIRECT_PRIME_PASSIVE_USE_RE =
            /may\s+be\s+used\s+by\s+(?:Prime\s+Contractor\b(?!['\u2019]s\b)(?!\s+(?:customer|client|affiliate|agency|end[\s-]?user)\b)|Prime\b(?!['\u2019]s\b)(?!\s+Contractor\b)(?!\s+(?:customer|client|affiliate|agency|end[\s-]?user)\b))/i;
          const DIRECT_PRIME_ACTIVE_USE_RE =
            /(?:Prime\s+Contractor\b(?!['\u2019]s\b)(?!\s+(?:customer|client|affiliate|agency|end[\s-]?user)\b)|Prime\b(?!['\u2019]s\b)(?!\s+Contractor\b)(?!\s+(?:customer|client|affiliate|agency|end[\s-]?user)\b))\s+may\s+use/i;
          const IMPROVEMENTS_OR_ADAPTATIONS_RE = /improvements?|adaptations?/i;
          const WITHOUT_ADDITIONAL_PAYMENT_RE =
            /without\s+(?:additional\s+)?(?:payment|compensation|charge|fee)/i;

          export function hasUnpaidPrimeImprovementsUseEvidence(text: string): boolean {
            const sentences = text.split(/(?<=[.!?])\s+/);
            return sentences.some(
              (sentence) =>
                IMPROVEMENTS_OR_ADAPTATIONS_RE.test(sentence) &&
                WITHOUT_ADDITIONAL_PAYMENT_RE.test(sentence) &&
                (DIRECT_PRIME_PASSIVE_USE_RE.test(sentence) || DIRECT_PRIME_ACTIVE_USE_RE.test(sentence))
            );
          }

          function findConditionedPreExistingIpCandidate(documentText: string): string | null {
            return findClauseCandidate(
              documentText,
              (block) => CONDITIONED_PREEXISTING_IP_RE.test(block) || hasUnpaidPrimeImprovementsUseEvidence(block)
            );
          }

          function buildConditionedPreExistingIpAnalysis(foundText: string): string {
            const conditioned = CONDITIONED_PREEXISTING_IP_RE.test(foundText);
            const unpaidUse = hasUnpaidPrimeImprovementsUseEvidence(foundText);'''
          replace_once('lib/analyzer/deterministic.ts', old_ip, new_ip, 'direct Prime unpaid-improvements evidence helper')

          replace_once(
              'lib/analyzer/sanity.ts',
              r'''  hasComprehensiveTerminationRecoveryEvidence,
            hasProtectiveTerminationForConvenienceRestrictionEvidence,
            hasTerminationForConvenienceRiskEvidence,''',
              r'''  hasComprehensiveTerminationRecoveryEvidence,
            hasProtectiveTerminationForConvenienceRestrictionEvidence,
            hasTerminationForConvenienceRiskEvidence,
            hasUnpaidPrimeImprovementsUseEvidence,''',
              'import shared unpaid-improvements evidence helper',
          )

          replace_once(
              'lib/analyzer/sanity.ts',
              r'''  const unpaidImprovementEvidence =
              /(?:improvements?|adaptations?)[^.]{0,180}may\s+be\s+used\s+by\s+Prime(?:\s+Contractor)?[^.]{0,160}without\s+(?:additional\s+)?(?:payment|compensation|charge|fee)|Prime(?:\s+Contractor)?\s+may\s+use[^.]{0,160}(?:improvements?|adaptations?)[^.]{0,160}without\s+(?:additional\s+)?(?:payment|compensation|charge|fee)/i.test(quote);''',
              r'''  const unpaidImprovementEvidence = hasUnpaidPrimeImprovementsUseEvidence(quote);''',
              'shared finding-local unpaid-improvements evidence',
          )

          test_path = Path('lib/analyzer/__tests__/orion-parity-regression.test.mjs')
          tests = test_path.read_text()
          marker = 'const reverseIpActor = productionPath(`\n'
          additions = '''const unrelatedInvoicePaymentsRemainPayable = productionPath(`
          2.8 Invoice Requirements
          Failure to submit a complete invoice within 30 calendar days waives the right to payment for the affected invoice, but all undisputed amounts under other invoices remain payable.
          `);
          check(
            "unrelated payable invoices do not hide affected-invoice forfeiture",
            unrelatedInvoicePaymentsRemainPayable.findings.some((finding) => finding.regulation === "Invoice Submission Deadline / Payment Waiver")
          );

          const affectedAmountProtected = productionPath(`
          2.8 Invoice Requirements
          Failure to submit a complete invoice within 30 calendar days waives the right to payment, except that the affected amount remains payable for performed work.
          `);
          check(
            "same affected amount remains payable suppresses invoice payment waiver",
            !affectedAmountProtected.findings.some((finding) => finding.regulation === "Invoice Submission Deadline / Payment Waiver")
          );

          const primeCustomerUse = productionPath(`
          2.17 Improvements
          Improvements may be used by Prime Contractor's customer without additional payment to Prime Contractor.
          `);
          check(
            "Prime Contractor customer use does not become direct Prime use",
            !primeCustomerUse.findings.some((finding) => finding.regulation === "Conditioned Pre-Existing IP Retention / Unpaid Use of Improvements")
          );

          const earlyNumberedAttachmentList = productionPath(`
          1. Attachment List
          2. Prime Contract Flow-Down Matrix Not included in current package.
          3. Cybersecurity and CUI Requirements To be provided after award.
          4. Certifications
          Subcontractor certifies that its representations remain current.
          `);
          const earlyBoundedMissing = earlyNumberedAttachmentList.findings.find((finding) => finding.regulation === "Missing / Deferred Contract Documents");
          check(
            "early Attachment List retains higher-numbered attachment rows",
            Boolean(earlyBoundedMissing && /Flow-Down Matrix/i.test(earlyBoundedMissing.foundText) && /Cybersecurity and CUI Requirements/i.test(earlyBoundedMissing.foundText))
          );
          check(
            "early Attachment List excludes the next structural section",
            Boolean(earlyBoundedMissing && !/Certifications/i.test(earlyBoundedMissing.foundText))
          );

          const incidentalAttachmentReference = productionPath(`
          1. Instructions
          See the Attachment List before signing.
          2. Other Materials
          This section contains general administrative information.
          3. Attachment List
          Attachment B Prime Contract Flow-Down Matrix Not included in current package.
          4. Certifications
          Subcontractor certifies that its representations remain current.
          `);
          const incidentalBoundedMissing = incidentalAttachmentReference.findings.find((finding) => finding.regulation === "Missing / Deferred Contract Documents");
          check(
            "incidental Attachment List reference is not selected as the heading",
            Boolean(incidentalBoundedMissing && /^3\.\s*Attachment\s+List/i.test(incidentalBoundedMissing.foundText))
          );
          check(
            "incidental reference does not pull other sections into evidence",
            Boolean(incidentalBoundedMissing && !/Other Materials|Certifications/i.test(incidentalBoundedMissing.foundText))
          );

          const labeledAttachmentList = productionPath(`
          Attachment List:
          Attachment B Prime Contract Flow-Down Matrix Not included in current package.
          6. Certifications
          Subcontractor certifies that its representations remain current.
          `);
          const labeledBoundedMissing = labeledAttachmentList.findings.find((finding) => finding.regulation === "Missing / Deferred Contract Documents");
          check(
            "colon-labeled Attachment List remains supported and bounded",
            Boolean(labeledBoundedMissing && /Flow-Down Matrix/i.test(labeledBoundedMissing.foundText) && !/Certifications/i.test(labeledBoundedMissing.foundText))
          );

          '''
          if tests.count(marker) != 1:
              raise SystemExit('structural hardening regression insertion marker missing or duplicated')
          test_path.write_text(tests.replace(marker, additions + marker, 1))
          PY

      - name: Install locked dependencies
        run: npm ci

      - name: Run full analyzer accuracy suite
        run: npm run test:accuracy

      - name: Validate TypeScript
        run: npx tsc --noEmit

      - name: Build production application
        env:
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          NEXT_PUBLIC_STRIPE_PRICE_SINGLE_REVIEW_CYCLE: price_ci_single
          NEXT_PUBLIC_STRIPE_PRICE_ACTIVE_BIDDER_PLAN: price_ci_active
          NEXT_PUBLIC_STRIPE_PRICE_ENTERPRISE_PLAN: price_ci_enterprise
          OPENAI_API_KEY: sk-ci-placeholder
          RESEND_API_KEY: re_ci_placeholder
          CONTACT_FROM_EMAIL: ci@example.com
          CONTACT_TO_EMAIL: ci@example.com
        run: npm run build

      - name: Commit verified hardening and restore workflow
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/analyzer-accuracy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden Orion finding scope and attachment structure"
          git push origin HEAD:fix/orion-parity-grounding-invoice-waiver
