name: Analyzer Accuracy Benchmarks

on:
  pull_request:
    paths:
      - ".github/workflows/analyzer-accuracy.yml"
      - ".github/workflows/one-time-next-security-update.yml"
      - "package.json"
      - "package-lock.json"
      - "app/api/analyze-contract/route.ts"

permissions:
  contents: write
  issues: write

concurrency:
  group: nextjs-security-update-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  hosted-security-update:
    if: github.head_ref == 'fix/nextjs-16-2-12-security-update'
    name: Generate and validate Next.js security patch
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate, validate, and publish final branch
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_PUBLIC_BASE_URL: https://www.subshield.net
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          NEXT_PUBLIC_STRIPE_PRICE_SINGLE_REVIEW_CYCLE: price_ci_single
          NEXT_PUBLIC_STRIPE_PRICE_ACTIVE_BIDDER_PLAN: price_ci_active
          NEXT_PUBLIC_STRIPE_PRICE_ENTERPRISE_PLAN: price_ci_enterprise
          OPENAI_API_KEY: sk-ci-placeholder
          RESEND_API_KEY: re_ci_placeholder
          CONTACT_FROM_EMAIL: ci@example.com
          CONTACT_TO_EMAIL: ci@example.com
        shell: bash
        run: |
          set -Eeuo pipefail
          phase="initialization"
          log_file="/tmp/next-security-update.log"
          touch "$log_file"
          exec > >(tee -a "$log_file") 2>&1

          report_failure() {
            status=$?
            trap - ERR
            {
              echo "### Hosted security updater failed"
              echo
              echo "- PR: #${{ github.event.pull_request.number }}"
              echo "- Head: \`${GITHUB_SHA}\`"
              echo "- Failed phase: **${phase}**"
              echo "- Exit status: \`${status}\`"
              echo "- Production was not changed and no partial dependency update was committed."
              echo
              echo "Last diagnostic lines:"
              echo '```text'
              tail -n 120 "$log_file"
              echo '```'
            } > /tmp/next-security-update-failure.md
            gh issue comment 66 --repo "$GITHUB_REPOSITORY" --body-file /tmp/next-security-update-failure.md || true
            exit "$status"
          }
          trap report_failure ERR

          phase="install patched packages and regenerate lockfile"
          npm install --save-exact next@16.2.12 eslint-config-next@16.2.12

          phase="correct stale analyzer duration comment"
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'app/api/analyze-contract/route.ts';
          const source = fs.readFileSync(path, 'utf8');
          const oldText = `// OCR fallback (rasterize + tesseract.js) can legitimately take tens of
          // seconds on a scanned PDF. Raise the function's max duration accordingly -
          // confirm this matches your actual Vercel plan (Hobby caps at 10s regardless
          // of this value; Pro/Enterprise can go higher) before deploying.`;
          const newText = `// OCR fallback (rasterize + tesseract.js) can legitimately take tens of
          // seconds on a scanned PDF. The deployed Vercel plan/project's current Fluid
          // Compute and function-duration settings must support this configured limit.`;
          if (!source.includes(oldText)) {
            throw new Error('Expected analyzer duration comment was not found.');
          }
          fs.writeFileSync(path, source.replace(oldText, newText));
          NODE

          phase="clean install from regenerated lockfile"
          npm ci

          phase="full repository lint diagnostic"
          trap - ERR
          set +e
          npm run lint 2>&1 | tee /tmp/full-repository-lint.txt
          full_lint_status=${PIPESTATUS[0]}
          set -e
          trap report_failure ERR
          echo "Full repository lint exit status: ${full_lint_status}"
          if [ "$full_lint_status" -ne 0 ]; then
            echo "Inherited full-repository lint debt is recorded; patch-local lint remains blocking."
          fi

          phase="patch-local lint"
          npx eslint app/api/analyze-contract/route.ts

          phase="TypeScript validation"
          npx tsc --noEmit

          phase="analyzer accuracy suite"
          npm run test:accuracy

          phase="full regulatory suite"
          npm run test:regulatory

          phase="production build with nonsecret placeholders"
          npm run build

          phase="production dependency audit"
          npm audit --omit=dev --audit-level=high

          phase="exact-version and diff verification"
          node -e "const p=require('./package.json'); if(p.dependencies.next!=='16.2.12'||p.devDependencies['eslint-config-next']!=='16.2.12') process.exit(1)"
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' 'app/api/analyze-contract/route.ts' 'package-lock.json' 'package.json' | sort)"
          test "$changed" = "$expected"

          phase="restore permanent workflow and publish validated update"
          git show origin/main:.github/workflows/analyzer-accuracy.yml > .github/workflows/analyzer-accuracy.yml
          rm -f .github/workflows/one-time-next-security-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json app/api/analyze-contract/route.ts .github/workflows/analyzer-accuracy.yml .github/workflows/one-time-next-security-update.yml
          git diff --cached --check
          git commit -m "chore: update Next.js to 16.2.12"
          git push origin HEAD:${{ github.head_ref }}
          trap - ERR
