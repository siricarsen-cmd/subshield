name: One-time performance start hardening

on:
  push:
    branches:
      - feat/regulatory-contract-date-evidence

permissions:
  contents: write

jobs:
  harden-performance-start:
    if: ${{ !contains(github.event.head_commit.message, '[performance-start-hardened]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/regulatory-contract-date-evidence
          fetch-depth: 0

      - name: Require explicit performance start or range semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('lib/regulatory/contract-date-evidence.ts')
          text = source.read_text(encoding='utf-8')
          old = '''  {
    basis: "performance-started",
    anchor:
      /\\b(?:period\\s+of\\s+performance|performance\\s+start\\s+date|start\\s+of\\s+performance|commencement\\s+date|notice\\s+to\\s+proceed\\s+date)\\b/i,
  },'''
          new = '''  {
    basis: "performance-started",
    anchor:
      /\\bperiod\\s+of\\s+performance\\b\\s*(?::|(?:begins?|starts?|commences?|from)\\b)/i,
  },
  {
    basis: "performance-started",
    anchor:
      /\\b(?:performance\\s+start\\s+date|start\\s+of\\s+performance|commencement\\s+date|notice\\s+to\\s+proceed\\s+date)\\b/i,
  },'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one performance rule, observed {text.count(old)}')
          source.write_text(text.replace(old, new), encoding='utf-8')

          test = Path('lib/regulatory/__tests__/contract-date-evidence.test.mjs')
          test_text = test.read_text(encoding='utf-8')
          marker = '''check(
  "an unrelated calendar date without a governing-date label is not selected",
  extractContractDateEvidence(NO_LABEL_DOCUMENT).candidates.length === 0
);'''
          addition = '''check(
  "an unrelated calendar date without a governing-date label is not selected",
  extractContractDateEvidence(NO_LABEL_DOCUMENT).candidates.length === 0
);

const PERFORMANCE_END_ONLY = `Period of Performance ends May 1, 2026.`;
check(
  "an end-only period-of-performance date is not treated as the performance start",
  resolveContractDateEvidence(PERFORMANCE_END_ONLY, "performance-started").status ===
    "not-found"
);'''
          if test_text.count(marker) != 1:
              raise SystemExit('Test insertion marker not found exactly once')
          test.write_text(test_text.replace(marker, addition), encoding='utf-8')

          Path('.github/workflows/one-time-performance-start-hardening.yml').unlink()
          PY

      - name: Commit performance-start hardening
        shell: bash
        run: |
          git config user.name "subshield-automation"
          git config user.email "actions@users.noreply.github.com"
          git add lib/regulatory/contract-date-evidence.ts \
            lib/regulatory/__tests__/contract-date-evidence.test.mjs \
            .github/workflows/one-time-performance-start-hardening.yml
          git commit -m "fix: require explicit performance start semantics [performance-start-hardened]"
          git push origin HEAD:feat/regulatory-contract-date-evidence
