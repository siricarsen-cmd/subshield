name: Temporary PR60 evidence hardening

on:
  push:
    branches:
      - feat/regulatory-implementation-invocation-orchestration
    paths:
      - .github/workflows/temp-pr60-evidence-hardening.yml
      - scripts/temp-pr60-evidence-hardening.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/regulatory-implementation-invocation-orchestration
          fetch-depth: 0
      - name: Apply evidence hardening
        run: python scripts/temp-pr60-evidence-hardening.py
      - name: Commit patched files
        run: |
          git config user.name "SubShield Automation"
          git config user.email "subshield-automation@users.noreply.github.com"
          git add docs/accuracy/regulatory-implementation-invocation-orchestration.md \
            lib/regulatory/registry-implementation-invocation.ts \
            lib/regulatory/__tests__/registry-implementation-invocation.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix: harden invocation audit evidence validation"
          git push origin HEAD:feat/regulatory-implementation-invocation-orchestration
