name: PR107 Verified Correction Artifact

on:
  pull_request:
    paths:
      - .github/workflows/pr107-verified-artifact.yml
      - .github/workflows/pr107-verified-artifact-v2.yml

permissions:
  contents: read

jobs:
  build-verified-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply corrected patch script
        shell: bash
        run: |
          python - <<'EXTRACT'
          from pathlib import Path
          import textwrap

          lines = Path('.github/workflows/pr107-verified-artifact-v2.yml').read_text().splitlines(True)
          start = next(i for i, line in enumerate(lines) if "python - <<'PY'" in line)
          body = []
          for line in lines[start + 1:]:
              if line.strip() == 'PY':
                  break
              body.append(line)
          script = textwrap.dedent(''.join(body))
          exec(compile(script, 'pr107-verified-patch.py', 'exec'))
          EXTRACT

      - run: npm run test:accuracy:orion
      - run: npm run test:accuracy
      - run: npx tsc --noEmit
      - name: Build production application
        env:
          VERCEL_ENV: production
          NEXT_PUBLIC_BASE_URL: https://www.subshield.net
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          NEXT_PUBLIC_STRIPE_PRICE_SINGLE_REVIEW_CYCLE: price_ci_single
          NEXT_PUBLIC_STRIPE_PRICE_ACTIVE_BIDDER_PLAN: price_ci_active
          NEXT_PUBLIC_STRIPE_PRICE_ENTERPRISE_PLAN: price_ci_enterprise
          OPENAI_API_KEY: sk-ci-placeholder
          RESEND_API_KEY: re_ci_placeholder
          CONTACT_FROM_EMAIL: ci@example.com
          CONTACT_TO_EMAIL: ci@example.com
        run: npm run build
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: pr107-verified-correction-files-v3
          path: |
            lib/analyzer/deterministic.ts
            lib/analyzer/sanity.ts
            lib/analyzer/__tests__/orion-parity-regression.test.mjs
          if-no-files-found: error
          retention-days: 7
