name: PR107 Verified Arbitration Scope Fix

on:
  pull_request:
    paths:
      - .github/workflows/pr107-verified-artifact.yml
      - .github/pr107-arbitration-scope-patch.py

permissions:
  contents: write

jobs:
  apply-test-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/orion-parity-grounding-invoice-waiver
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply arbitration optionality and branch-scope patch
        run: python .github/pr107-arbitration-scope-patch.py

      - run: npm run test:accuracy:orion
      - run: npm run test:accuracy
      - run: npx tsc --noEmit

      - name: Build production application
        env:
          VERCEL_ENV: production
          NEXT_PUBLIC_BASE_URL: https://www.subshield.net
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          NEXT_PUBLIC_STRIPE_PRICE_SINGLE_REVIEW_CYCLE: price_ci_single
          NEXT_PUBLIC_STRIPE_PRICE_ACTIVE_BIDDER_PLAN: price_ci_active
          NEXT_PUBLIC_STRIPE_PRICE_ENTERPRISE_PLAN: price_ci_enterprise
          OPENAI_API_KEY: sk-ci-placeholder
          RESEND_API_KEY: re_ci_placeholder
          CONTACT_FROM_EMAIL: ci@example.com
          CONTACT_TO_EMAIL: ci@example.com
        run: npm run build

      - name: Restore exact six-file scope and push
        shell: bash
        run: |
          rm .github/workflows/pr107-verified-artifact.yml
          rm .github/pr107-arbitration-scope-patch.py
          expected=$(printf '%s\n' \
            'lib/analyzer/__fixtures__/orion-parity-regression-fixture.mjs' \
            'lib/analyzer/__tests__/orion-parity-regression.test.mjs' \
            'lib/analyzer/anchors.ts' \
            'lib/analyzer/deterministic.ts' \
            'lib/analyzer/sanity.ts' \
            'package.json')
          actual=$(git diff --name-only 13d4d8f43f24440ebbb0ec77e61736adfd1ad82f | sort)
          test "$actual" = "$expected" || {
            echo 'Unexpected final PR scope:'
            printf '%s\n' "$actual"
            exit 1
          }
          git diff --check
          git config user.name 'siricarsen-cmd'
          git config user.email '287561052+siricarsen-cmd@users.noreply.github.com'
          git add lib/analyzer/deterministic.ts lib/analyzer/__tests__/orion-parity-regression.test.mjs .github/workflows/pr107-verified-artifact.yml .github/pr107-arbitration-scope-patch.py
          git diff --cached --check
          git commit -m 'Address PR107 arbitration scope review cases'
          git push origin HEAD:fix/orion-parity-grounding-invoice-waiver
