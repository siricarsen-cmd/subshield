name: One-time final Orion review correction

on:
  push:
    branches:
      - fix/orion-parity-grounding-invoice-waiver

permissions:
  contents: write

jobs:
  apply-verify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/orion-parity-grounding-invoice-waiver
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply reviewed corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              file_path.write_text(text.replace(old, new, 1))

          replace_once(
              'lib/analyzer/deterministic.ts',
              r'''const ATTACHMENT_LIST_START_RE = /\b(?:\d+\.\s*)?Attachment\s+List\b/i;
const ATTACHMENT_LIST_END_RE =
  /\b\d+\.\s+(?!\d)(?:[A-Z][A-Za-z0-9/&()'\u2019-]*(?:\s+[A-Z][A-Za-z0-9/&()'\u2019-]*){0,10})\b/;

function findMissingDocumentsCandidate(documentText: string): string | null {''',
              r'''const ATTACHMENT_LIST_START_RE = /\b(?:(\d+)\.\s*)?Attachment\s+List\b/i;
const ATTACHMENT_LIST_NAMED_END_RE =
  /\b(?:\d+\.\s*)?(?:Subcontractor\s+Questions\s+Form|Quote\s+Submission\s+Instructions)\b/i;
const NUMBERED_SECTION_HEADING_RE =
  /\b(\d+)\.\s+(?!\d)(?:[A-Z][A-Za-z0-9/&()'\u2019-]*(?:\s+[A-Z][A-Za-z0-9/&()'\u2019-]*){0,10})\b/g;

function findAttachmentListEnd(afterStart: string, attachmentSectionNumber: number | null): number | null {
  const namedEnd = ATTACHMENT_LIST_NAMED_END_RE.exec(afterStart)?.index ?? null;
  let numberedEnd: number | null = null;

  if (attachmentSectionNumber !== null) {
    NUMBERED_SECTION_HEADING_RE.lastIndex = 0;
    for (const match of afterStart.matchAll(NUMBERED_SECTION_HEADING_RE)) {
      const candidateNumber = Number(match[1]);
      if (candidateNumber > attachmentSectionNumber) {
        numberedEnd = match.index ?? null;
        break;
      }
    }
  }

  if (namedEnd === null) return numberedEnd;
  if (numberedEnd === null) return namedEnd;
  return Math.min(namedEnd, numberedEnd);
}

function findMissingDocumentsCandidate(documentText: string): string | null {''',
              'peer-section Attachment List boundary',
          )

          replace_once(
              'lib/analyzer/deterministic.ts',
              r'''    const afterStart = documentText.slice(start.index + start[0].length);
    const end = ATTACHMENT_LIST_END_RE.exec(afterStart);
    const finish = end
      ? start.index + start[0].length + end.index
      : Math.min(documentText.length, start.index + 1800);''',
              r'''    const afterStart = documentText.slice(start.index + start[0].length);
    const attachmentSectionNumber = start[1] ? Number(start[1]) : null;
    const endOffset = findAttachmentListEnd(afterStart, attachmentSectionNumber);
    const finish = endOffset !== null
      ? start.index + start[0].length + endOffset
      : Math.min(documentText.length, start.index + 1800);''',
              'Attachment List end calculation',
          )

          replace_once(
              'lib/analyzer/deterministic.ts',
              r'''const PAYMENT_RIGHT_PRESERVED_RE =
  /(?:does|shall|will)\s+not\s+(?:waive|forfeit)[^.]{0,80}(?:right|entitlement)\s+to\s+payment|(?:right|entitlement)\s+to\s+payment[^.]{0,80}(?:is|shall|will)\s+not\s+(?:waived|forfeited)/i;''',
              r'''const PAYMENT_RIGHT_PRESERVED_RE =
  /(?:does|shall|will)\s+not\s+(?:waive|forfeit)[^.]{0,80}(?:right|entitlement)\s+to\s+payment|(?:right|entitlement)\s+to\s+payment[^.]{0,80}(?:is|shall|will)\s+not\s+(?:waived|forfeited)|(?:all\s+)?(?:amounts?|payment)[^.]{0,100}(?:remain|remains|shall\s+remain|will\s+remain)\s+(?:payable|due)/i;''',
              'equivalent payment-preservation language',
          )

          replace_once(
              'lib/analyzer/deterministic.ts',
              r'''const VENUE_OR_ARBITRATION_EVIDENCE_RE =
  /(?:exclusive\s+)?(?:venue|jurisdiction)\s+(?:shall\s+be\s+|is\s+|lies\s+|must\s+be\s+)?(?:in|located\s+in)[^.]{0,120}(?:courts?|County|State|Commonwealth)|binding\s+arbitration|(?:(?:any\s+)?(?:action|lawsuit|claim|dispute|proceeding)|arbitration|mediation|court\s+proceeding)[^.]{0,180}(?:(?:must|shall)\s+be\s+)?(?:brought|filed)\s+(?:exclusively\s+)?in|Prime(?:\s+Contractor)?\s+elects?\s+(?:another|a\s+different|an\s+alternate)\s+forum/i;
const BILATERAL_DEFENDANT_VENUE_RE =
  /(?:exclusive\s+)?venue[^.]{0,220}(?:where|located\s+where)[^.]{0,80}\bdefendant\b[^.]{0,80}(?:resides?|is\s+located|has\s+its\s+principal\s+place\s+of\s+business)/i;''',
              r'''const VENUE_OR_ARBITRATION_EVIDENCE_RE =
  /(?:exclusive\s+)?(?:venue|jurisdiction)\s+(?:shall\s+be\s+|is\s+|lies\s+|must\s+be\s+)?(?:in|located\s+in)[^.]{0,120}(?:courts?|County|State|Commonwealth)|binding\s+arbitration|(?:(?:any\s+)?(?:action|lawsuit|claim|dispute|proceeding)|arbitration|mediation|court\s+proceeding)[^.]{0,180}(?:must|shall)\s+be\s+(?:brought|filed)\s+(?:exclusively\s+)?in|Prime(?:\s+Contractor)?\s+elects?\s+(?:another|a\s+different|an\s+alternate)\s+forum/i;
const BILATERAL_DEFENDANT_VENUE_RE =
  /(?:(?:exclusive\s+)?venue|(?:any\s+)?(?:action|lawsuit|claim|dispute|proceeding))[^.]{0,240}(?:where|located\s+where|in\s+(?:a\s+)?court\s+where)[^.]{0,100}\bdefendant\b[^.]{0,100}(?:resides?|is\s+located|has\s+its\s+principal\s+place\s+of\s+business)/i;''',
              'mandatory direct forum and bilateral defendant-location guard',
          )

          replace_once(
              'lib/analyzer/sanity.ts',
              r'''  const forumBurdenEvidence =
    /(?:exclusive\s+)?(?:venue|jurisdiction)\b|binding\s+arbitration|(?:(?:any\s+)?(?:action|lawsuit|claim|dispute|proceeding)|arbitration|mediation|court\s+proceeding)[^.]{0,180}(?:brought|filed)\s+(?:exclusively\s+)?in|Prime(?:\s+Contractor)?\s+elects?\s+(?:another|a\s+different|an\s+alternate)\s+forum/i.test(quote);''',
              r'''  const forumBurdenEvidence =
    /(?:exclusive\s+)?(?:venue|jurisdiction)\b|binding\s+arbitration|(?:(?:any\s+)?(?:action|lawsuit|claim|dispute|proceeding)|arbitration|mediation|court\s+proceeding)[^.]{0,180}(?:must|shall)\s+be\s+(?:brought|filed)\s+(?:exclusively\s+)?in|Prime(?:\s+Contractor)?\s+elects?\s+(?:another|a\s+different|an\s+alternate)\s+forum/i.test(quote);''',
              'finding-local mandatory direct forum evidence',
          )

          test_path = Path('lib/analyzer/__tests__/orion-parity-regression.test.mjs')
          tests = test_path.read_text()
          marker = 'const reverseIpActor = productionPath(`\n'
          additions = '''const remainsPayable = productionPath(`
2.8 Invoice Requirements
Failure to submit a complete invoice within 30 calendar days waives the right to payment, except that all amounts for performed work remain payable.
`);
check(
  "amounts-remain-payable exception suppresses invoice payment waiver",
  !remainsPayable.findings.some((finding) => finding.regulation === "Invoice Submission Deadline / Payment Waiver")
);

const permissiveForum = productionPath(`
2.23 Venue
Any action may be brought in Arlington County, Virginia, or in any other court with jurisdiction.
`);
check(
  "permissive nonexclusive Arlington action clause remains clean",
  !permissiveForum.findings.some((finding) => finding.regulation === "Out-of-State Venue, Governing Law, or Arbitration Burden")
);

const actionDefendantVenue = productionPath(`
2.23 Venue
Any action must be brought in a court where the defendant resides.
`);
check(
  "mandatory action at defendant location remains clean",
  !actionDefendantVenue.findings.some((finding) => finding.regulation === "Out-of-State Venue, Governing Law, or Arbitration Burden")
);

const numberedAttachmentRows = productionPath(`
5. Attachment List
1. Statement of Work Included.
2. Prime Contract Flow-Down Matrix Not included in current package.
6. Certifications
Subcontractor certifies that its representations remain current.
`);
const numberedBoundedMissing = numberedAttachmentRows.findings.find((finding) => finding.regulation === "Missing / Deferred Contract Documents");
check(
  "numbered attachment rows remain inside the Attachment List evidence",
  Boolean(numberedBoundedMissing && /Prime Contract Flow-Down Matrix/i.test(numberedBoundedMissing.foundText))
);
check(
  "numbered attachment rows do not pull in the next peer section",
  Boolean(numberedBoundedMissing && !/Certifications/i.test(numberedBoundedMissing.foundText))
);

'''
          if tests.count(marker) != 1:
              raise SystemExit('final-review regression insertion marker missing or duplicated')
          test_path.write_text(tests.replace(marker, additions + marker, 1))
          PY
      - name: Install locked dependencies
        run: npm ci
      - name: Run full analyzer accuracy suite
        run: npm run test:accuracy
      - name: Validate TypeScript
        run: npx tsc --noEmit
      - name: Build production application
        run: NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co NEXT_PUBLIC_SUPABASE_ANON_KEY=build-placeholder npm run build
      - name: Commit verified correction
        shell: bash
        run: |
          rm -f .github/workflows/orion-final-review-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Address final Orion analyzer review findings"
          git push origin HEAD:fix/orion-parity-grounding-invoice-waiver
