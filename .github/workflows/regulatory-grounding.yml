name: Regulatory Grounding Foundation

on:
  pull_request:
    paths:
      - "lib/regulatory/**"
      - "lib/analyzer/types.ts"
      - "docs/accuracy/regulatory-*.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/regulatory-grounding.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regulatory-foundation:
    name: Official sources / types / analyzer regression
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate official source catalog
        run: npm run test:regulatory:catalog

      - name: Validate controlled source ingestion
        run: npm run test:regulatory:ingestion

      - name: Run applicability mappings and source review
        id: applicability
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run test:regulatory:applicability > regulatory-applicability-output.txt 2>&1
          status=$?
          cat regulatory-applicability-output.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload regulatory applicability output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regulatory-applicability-output-${{ github.run_id }}
          path: regulatory-applicability-output.txt
          if-no-files-found: error
          retention-days: 90

      - name: Enforce applicability result
        if: always()
        shell: bash
        run: |
          status="${{ steps.applicability.outputs.status }}"
          echo "Regulatory applicability status: ${status:-missing}"
          test "$status" = "0"

      - name: Run clause-level citation packages
        id: citations
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run test:regulatory:citations > regulatory-citation-output.txt 2>&1
          status=$?
          cat regulatory-citation-output.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload regulatory citation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regulatory-citation-output-${{ github.run_id }}
          path: regulatory-citation-output.txt
          if-no-files-found: error
          retention-days: 90

      - name: Enforce citation-package result
        if: always()
        shell: bash
        run: |
          status="${{ steps.citations.outputs.status }}"
          echo "Regulatory citation-package status: ${status:-missing}"
          test "$status" = "0"

      - name: Run full regulatory source coverage
        id: coverage
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run test:regulatory:coverage > regulatory-source-coverage-output.txt 2>&1
          status=$?
          cat regulatory-source-coverage-output.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload regulatory source coverage output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regulatory-source-coverage-output-${{ github.run_id }}
          path: regulatory-source-coverage-output.txt
          if-no-files-found: error
          retention-days: 90

      - name: Enforce source-coverage result
        if: always()
        shell: bash
        run: |
          status="${{ steps.coverage.outputs.status }}"
          echo "Regulatory source-coverage status: ${status:-missing}"
          test "$status" = "0"

      - name: Preserve analyzer accuracy benchmarks
        run: npm run test:accuracy

      - name: Validate TypeScript
        run: npx tsc --noEmit

      - name: Build production application
        env:
          # Non-secret placeholders used only to let Next.js evaluate modules
          # during CI. No network, payment, email, database, AI, or government-
          # source request is made by this build.
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          NEXT_PUBLIC_STRIPE_PRICE_SINGLE_REVIEW_CYCLE: price_ci_single
          NEXT_PUBLIC_STRIPE_PRICE_ACTIVE_BIDDER_PLAN: price_ci_active
          NEXT_PUBLIC_STRIPE_PRICE_ENTERPRISE_PLAN: price_ci_enterprise
          OPENAI_API_KEY: sk-ci-placeholder
          RESEND_API_KEY: re_ci_placeholder
          CONTACT_FROM_EMAIL: ci@example.com
          CONTACT_TO_EMAIL: ci@example.com
        run: npm run build
