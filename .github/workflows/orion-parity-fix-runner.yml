name: One-time Orion marker inspector

on:
  push:
    branches:
      - fix/orion-parity-grounding-invoice-waiver

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/orion-parity-grounding-invoice-waiver
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Record exact marker comparison
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          script = Path('ORION_DECOMPRESSED_BUILDER.py').read_text()
          script = script.replace('  {\n  familyKey:', '  {\n    familyKey:')
          marker_match = re.search(r"broad_setoff_marker = '''(.*?)'''", script, re.S)
          if not marker_match:
              raise SystemExit('Could not extract broad_setoff_marker assignment')
          marker = marker_match.group(1)

          deterministic = Path('lib/analyzer/deterministic.ts').read_text()
          needle = 'regulation: "Broad Setoff / Backcharge / Withholding Rights"'
          idx = deterministic.index(needle)
          source_excerpt = deterministic[deterministic.rfind('  {', 0, idx): deterministic.find('    severity:', idx) + len('    severity: "Medium-High",')]

          Path('ORION_RUNNER_DIAGNOSTIC.txt').write_text(
              'MARKER_REPR=' + repr(marker) + '\n' +
              'SOURCE_REPR=' + repr(source_excerpt) + '\n' +
              'EXACT_MATCH=' + str(marker in deterministic) + '\n'
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ORION_RUNNER_DIAGNOSTIC.txt
          git commit -m "Inspect Orion category insertion marker"
          git push origin HEAD:fix/orion-parity-grounding-invoice-waiver
