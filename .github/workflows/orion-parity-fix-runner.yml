name: One-time exact-marker Orion parity implementation

on:
  push:
    branches:
      - fix/orion-parity-grounding-invoice-waiver

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/orion-parity-grounding-invoice-waiver
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply, verify, and commit
        shell: bash
        run: |
          set +e
          LOG=ORION_RUNNER_DIAGNOSTIC.txt
          : > "$LOG"

          python - <<'PY' >> "$LOG" 2>&1
          from pathlib import Path

          script = Path('ORION_DECOMPRESSED_BUILDER.py').read_text()

          flexible_replace = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count == 1:
                  return text.replace(old, new, 1)
              lines = old.splitlines(keepends=True)
              pattern_parts = []
              for line in lines:
                  stripped = line.lstrip(" \\t")
                  prefix = r"^[ \\t]*" if line != stripped else ""
                  pattern_parts.append(prefix + re.escape(stripped))
              pattern = "".join(pattern_parts)
              matches = list(re.finditer(pattern, text, flags=re.MULTILINE))
              if len(matches) != 1:
                  raise SystemExit(f"{label}: expected one exact or indentation-tolerant match, found {len(matches)}")
              match = matches[0]
              return text[:match.start()] + new + text[match.end():]

          '''
          start = script.index('def replace_once')
          end = script.index('def replace_block', start)
          script = script[:start] + flexible_replace + script[end:]

          # Align category marker/property indentation with deterministic.ts.
          for prop in ('familyKey', 'regulation', 'severity', 'patterns', 'findCandidate', 'riskAnalysis', 'redlineFix', 'buildRiskAnalysis'):
              script = script.replace(f'\n  {prop}:', f'\n    {prop}:')

          exec(compile(script, '<orion-parity-builder>', 'exec'))
          PY
          STATUS=$?

          if [ "$STATUS" -eq 0 ]; then npm ci >> "$LOG" 2>&1; STATUS=$?; fi
          if [ "$STATUS" -eq 0 ]; then npm run test:accuracy >> "$LOG" 2>&1; STATUS=$?; fi
          if [ "$STATUS" -eq 0 ]; then npx tsc --noEmit >> "$LOG" 2>&1; STATUS=$?; fi
          if [ "$STATUS" -eq 0 ]; then npm run build >> "$LOG" 2>&1; STATUS=$?; fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$STATUS" -ne 0 ]; then
            git add "$LOG"
            git commit -m "Update Orion parity runner diagnostic"
            git push origin HEAD:fix/orion-parity-grounding-invoice-waiver
            exit "$STATUS"
          fi

          rm -f "$LOG" ORION_DECOMPRESSED_BUILDER.py
          rm -f ORION_PARITY_FIX_TASK.md ORION_RUN_TRIGGER.txt
          rm -f .github/workflows/orion-parity-fix-builder.yml
          rm -f .github/workflows/orion-parity-fix-runner.yml
          git add -A
          git commit -m "Fix Orion parity grounding and invoice waiver detection"
          git push origin HEAD:fix/orion-parity-grounding-invoice-waiver
