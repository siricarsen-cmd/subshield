name: One-time Orion parity patch extractor

on:
  push:
    branches:
      - fix/orion-parity-grounding-invoice-waiver

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/orion-parity-grounding-invoice-waiver
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract readable patch script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import re
          import zlib

          builder = Path('.github/workflows/orion-parity-fix-builder.yml').read_text()
          match = re.search(r'b64decode\("([^"]+)"\)', builder)
          if not match:
              raise SystemExit('Could not locate encoded builder payload')
          script = zlib.decompress(base64.b64decode(match.group(1))).decode()
          Path('ORION_DECOMPRESSED_BUILDER.py').write_text(script)
          PY
          rm -f ORION_RUNNER_DIAGNOSTIC.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ORION_DECOMPRESSED_BUILDER.py ORION_RUNNER_DIAGNOSTIC.txt
          git commit -m "Extract readable Orion parity patch"
          git push origin HEAD:fix/orion-parity-grounding-invoice-waiver
