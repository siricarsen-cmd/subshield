name: PR107 Exact Head Review Fixes

on:
  push:
    branches:
      - fix/orion-parity-grounding-invoice-waiver
    paths:
      - .github/workflows/pr107-exact-head-review-fixes.yml

permissions:
  contents: write

jobs:
  apply-test-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/orion-parity-grounding-invoice-waiver
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply four exact-head review fixes and regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          sanity_path = Path("lib/analyzer/sanity.ts")
          sanity = sanity_path.read_text()

          old_forum = r'''  const explicitForumSelectionClaim =
            /forum\s+(?:far|stated|required)|must\s+be\s+brought|filed\s+in|(?:must|shall|required\s+to)\s+(?:litigate|arbitrate)/i.test(claim);'''
          new_forum = r'''  const filedInForumClaim =
            /filed\s+in\s+(?:(?:a|the)\s+)?(?:courts?|forum)\b|filed\s+in\s+(?:(?:the\s+)?(?:State|Commonwealth)\s+of\s+)?[A-Z][A-Za-z.'-]*(?:\s+[A-Z][A-Za-z.'-]*){0,4}\s+(?:County|State|Commonwealth|District|City)\b/i.test(claim);
          const explicitForumSelectionClaim =
            /forum\s+(?:far|stated|required)|must\s+be\s+brought|(?:must|shall|required\s+to)\s+(?:litigate|arbitrate)/i.test(claim) ||
            filedInForumClaim;'''
          sanity = replace_once(sanity, old_forum, new_forum, "filed-in forum claim scope")

          old_unpaid = r'''  const unpaidImprovementClaim =
            /(?:improvements?|adaptations?)[^.]{0,100}(?:without\s+(?:additional\s+)?(?:payment|compensation)|unpaid|free\s+use|royalty[\s-]?free|free\s+of\s+charge)|(?:without\s+(?:additional\s+)?(?:payment|compensation)|unpaid|free\s+use|royalty[\s-]?free|free\s+of\s+charge)[^.]{0,100}(?:improvements?|adaptations?)/i.test(claim);'''
          new_unpaid = r'''  const primeImprovementUseClaim =
            /\bPrime(?:\s+Contractor)?\b[^.]{0,180}\b(?:use|uses|using|license|licensed|receives?|retains?|may\s+use|right\s+to\s+use)\b[^.]{0,140}\b(?:improvements?|adaptations?)\b|\b(?:improvements?|adaptations?)\b[^.]{0,140}\b(?:used|licensed)\b[^.]{0,80}\b(?:by|to)\s+(?:the\s+)?Prime(?:\s+Contractor)?\b/i.test(claim);
          const unpaidImprovementClaim =
            primeImprovementUseClaim &&
            /(?:improvements?|adaptations?)[^.]{0,100}(?:without\s+(?:additional\s+)?(?:payment|compensation)|unpaid|free\s+use|royalty[\s-]?free|free\s+of\s+charge)|(?:without\s+(?:additional\s+)?(?:payment|compensation)|unpaid|free\s+use|royalty[\s-]?free|free\s+of\s+charge)[^.]{0,100}(?:improvements?|adaptations?)/i.test(claim);'''
          sanity = replace_once(sanity, old_unpaid, new_unpaid, "Prime-use finding-local scope")
          sanity_path.write_text(sanity)

          deterministic_path = Path("lib/analyzer/deterministic.ts")
          deterministic = deterministic_path.read_text()

          old_payment = r'''const EXPLICIT_PAYMENT_RIGHT_PRESERVED_RE =
            /(?:does|shall|will)\s+not\s+(?:waive|forfeit)[^.]{0,80}(?:right|entitlement)\s+to\s+payment|(?:right|entitlement)\s+to\s+payment[^.]{0,80}(?:is|shall|will)\s+not\s+(?:waived|forfeited)/i;'''
          new_payment = r'''const EXPLICIT_PAYMENT_RIGHT_PRESERVED_RE =
            /(?:does|shall|will)\s+not\s+(?:waive|forfeit)[^.]{0,80}(?:right|entitlement)\s+to\s+payment|(?:right|entitlement)\s+to\s+payment[^.]{0,80}(?:is|shall|will)\s+not\s+(?:waived|forfeited)|(?:payment|amounts?)[^.]{0,80}(?:is|are|shall|will)\s+not\s+(?:waived|forfeited)|(?:does|shall|will)\s+not\s+(?:waive|forfeit)\s+(?:the\s+)?(?:payment|amounts?)/i;'''
          deterministic = replace_once(
              deterministic,
              old_payment,
              new_payment,
              "bare payment preservation",
          )

          old_modifiers = r'''(?:\s+(?:that|which|are|were|is|was|created|developed|generated|made|produced|conceived|arising|during|under|in|for|through|the|this|such|subcontract|agreement|performance|by|Subcontractor)){0,16}'''
          new_modifiers = r'''(?:\s+(?!(?:deliverables?|services?|work\s+products?|may|shall|will)\b)[A-Za-z][A-Za-z'-]*){0,20}'''
          deterministic = replace_once(
              deterministic,
              old_modifiers,
              new_modifiers,
              "passive improvement modifiers",
          )
          deterministic_path.write_text(deterministic)

          test_path = Path("lib/analyzer/__tests__/orion-parity-regression.test.mjs")
          tests = test_path.read_text()
          marker = "\nif (failures > 0) {\n"
          if tests.count(marker) != 1:
              raise SystemExit(f"test insertion marker: expected one match, found {tests.count(marker)}")

          additions = r'''

          const filedInWritingQuote =
            "Any claim must be filed in writing within three business days after the event giving rise to the claim.";
          const filedInWritingFinding = {
            triggerType: "Contract Risk Trigger",
            regulation: "Short Claim Notice / Waiver",
            severity: "Medium-High",
            foundText: filedInWritingQuote,
            riskAnalysis:
              "This clause requires any claim to be filed in writing within three business days, creating a short notice deadline.",
            redlineFix: "Extend the claim-notice period and preserve claims absent material prejudice.",
          };
          const filedInWritingVerification = verifyFindings(
            [filedInWritingFinding],
            filedInWritingQuote
          );
          check(
            "filed-in-writing deadline analysis survives the forum-selection sanity guard",
            filedInWritingVerification.verified.length === 1,
            filedInWritingVerification.dropped.map(({ reason }) => reason).join(" | ")
          );

          const uncompensatedProcessImprovementQuote =
            "Subcontractor shall implement all required process Improvements without additional compensation.";
          const uncompensatedProcessImprovementFinding = {
            triggerType: "Contract Risk Trigger",
            regulation: "Additional Work Without Compensation",
            severity: "Medium-High",
            foundText: uncompensatedProcessImprovementQuote,
            riskAnalysis:
              "This clause requires process Improvements without additional compensation, creating uncompensated additional-work exposure.",
            redlineFix: "Require a bilateral change order and equitable adjustment for additional process improvements.",
          };
          const uncompensatedProcessVerification = verifyFindings(
            [uncompensatedProcessImprovementFinding],
            uncompensatedProcessImprovementQuote
          );
          check(
            "uncompensated process-improvement finding is not mistaken for a Prime-use license claim",
            uncompensatedProcessVerification.verified.length === 1,
            uncompensatedProcessVerification.dropped.map(({ reason }) => reason).join(" | ")
          );

          const barePaymentPreservation = productionPath(`
          2.8 Invoice Requirements
          Failure to submit a complete invoice within 30 calendar days waives the right to payment. However, payment shall not be waived if the invoice is submitted during the cure period.
          `);
          check(
            "bare payment-shall-not-be-waived savings language suppresses permanent payment-loss finding",
            !barePaymentPreservation.findings.some(
              (finding) => finding.regulation === "Invoice Submission Deadline / Payment Waiver"
            )
          );

          const ordinaryModifierPassiveUse = productionPath(`
          2.17 Improvements
          All Improvements developed in the course of performance may be used by the Prime Contractor without additional payment to Subcontractor.
          `);
          const ordinaryModifierIpFinding = ordinaryModifierPassiveUse.findings.find(
            (finding) => finding.regulation === "Conditioned Pre-Existing IP Retention / Unpaid Use of Improvements"
          );
          check(
            "ordinary passive-grant modifiers preserve unpaid Prime-use detection",
            Boolean(ordinaryModifierIpFinding)
          );
          check(
            "ordinary-modifier passive Prime-use finding remains quote-local",
            Boolean(
              ordinaryModifierIpFinding &&
                verifyFindings([ordinaryModifierIpFinding], ordinaryModifierIpFinding.foundText).verified.length === 1
            )
          );

          const competingObjectAfterModifiers = productionPath(`
          2.17 Improvements
          Improvements developed for Subcontractor and Deliverables may be used by Prime Contractor without additional payment.
          `);
          check(
            "broader passive modifiers do not bind Prime's Deliverables use to Improvements",
            !competingObjectAfterModifiers.findings.some(
              (finding) => finding.regulation === "Conditioned Pre-Existing IP Retention / Unpaid Use of Improvements"
            )
          );
          '''
          tests = tests.replace(marker, additions + marker, 1)
          test_path.write_text(tests)
          PY

      - run: npm run test:accuracy:orion
      - run: npm run test:accuracy
      - run: npx tsc --noEmit
      - name: Build production application
        env:
          VERCEL_ENV: production
          NEXT_PUBLIC_BASE_URL: https://www.subshield.net
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          NEXT_PUBLIC_STRIPE_PRICE_SINGLE_REVIEW_CYCLE: price_ci_single
          NEXT_PUBLIC_STRIPE_PRICE_ACTIVE_BIDDER_PLAN: price_ci_active
          NEXT_PUBLIC_STRIPE_PRICE_ENTERPRISE_PLAN: price_ci_enterprise
          OPENAI_API_KEY: sk-ci-placeholder
          RESEND_API_KEY: re_ci_placeholder
          CONTACT_FROM_EMAIL: ci@example.com
          CONTACT_TO_EMAIL: ci@example.com
        run: npm run build

      - name: Restore exact six-file scope and push verified correction
        shell: bash
        run: |
          rm .github/workflows/pr107-exact-head-review-fixes.yml
          expected=$(printf '%s\n' \
            'lib/analyzer/__fixtures__/orion-parity-regression-fixture.mjs' \
            'lib/analyzer/__tests__/orion-parity-regression.test.mjs' \
            'lib/analyzer/anchors.ts' \
            'lib/analyzer/deterministic.ts' \
            'lib/analyzer/sanity.ts' \
            'package.json')
          actual=$(git diff --name-only 13d4d8f43f24440ebbb0ec77e61736adfd1ad82f | sort)
          test "$actual" = "$expected" || {
            echo 'Unexpected final PR scope:'
            printf '%s\n' "$actual"
            exit 1
          }
          git diff --check
          git config user.name 'siricarsen-cmd'
          git config user.email '287561052+siricarsen-cmd@users.noreply.github.com'
          git add lib/analyzer/deterministic.ts lib/analyzer/sanity.ts lib/analyzer/__tests__/orion-parity-regression.test.mjs .github/workflows/pr107-exact-head-review-fixes.yml
          git diff --cached --check
          git commit -m 'Address PR107 exact-head review findings'
          git push origin HEAD:fix/orion-parity-grounding-invoice-waiver
