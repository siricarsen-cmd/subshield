name: One-time simplified Orion parity implementation

on:
  push:
    branches:
      - fix/orion-parity-grounding-invoice-waiver

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/orion-parity-grounding-invoice-waiver
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply, verify, and commit
        shell: bash
        run: |
          set +e
          LOG=ORION_RUNNER_DIAGNOSTIC.txt
          : > "$LOG"

          python ORION_RUNNER_WRAPPER.py >> "$LOG" 2>&1
          STATUS=$?
          if [ "$STATUS" -eq 0 ]; then npm ci >> "$LOG" 2>&1; STATUS=$?; fi
          if [ "$STATUS" -eq 0 ]; then npm run test:accuracy >> "$LOG" 2>&1; STATUS=$?; fi
          if [ "$STATUS" -eq 0 ]; then npx tsc --noEmit >> "$LOG" 2>&1; STATUS=$?; fi
          if [ "$STATUS" -eq 0 ]; then NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co NEXT_PUBLIC_SUPABASE_ANON_KEY=build-placeholder npm run build >> "$LOG" 2>&1; STATUS=$?; fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$STATUS" -ne 0 ]; then
            git add "$LOG"
            git commit -m "Record simplified Orion runner diagnostic"
            git push origin HEAD:fix/orion-parity-grounding-invoice-waiver
            exit "$STATUS"
          fi

          rm -f ORION_DECOMPRESSED_BUILDER.py ORION_PARITY_FIX_TASK.md ORION_RUN_TRIGGER.txt ORION_RUNNER_DIAGNOSTIC.txt ORION_RUNNER_WRAPPER.py
          rm -f .github/workflows/orion-parity-fix-builder.yml .github/workflows/orion-parity-fix-runner.yml .github/workflows/orion-parity-fix-runner-v2.yml
          git add -A
          git commit -m "Fix Orion parity grounding and invoice waiver detection"
          git push origin HEAD:fix/orion-parity-grounding-invoice-waiver
