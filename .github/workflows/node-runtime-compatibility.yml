name: Node Runtime Compatibility

on:
  pull_request:
    paths:
      - ".nvmrc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
      - "next.config.ts"
      - "app/**"
      - "lib/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-compatibility:
    name: Node ${{ matrix.node }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Record runtime
        run: |
          node --version
          npm --version

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify native and document-processing packages load
        run: >-
          node --input-type=module -e "
          await import('sharp');
          await import('@napi-rs/canvas');
          await import('pdf-parse');
          await import('pdfjs-dist/legacy/build/pdf.mjs');
          await import('tesseract.js');
          console.log('Native and document-processing imports passed.');
          "

      - name: Validate TypeScript
        run: npx tsc --noEmit

      - name: Preserve analyzer accuracy
        run: npm run test:accuracy

      - name: Preserve regulatory grounding on production runtime
        if: matrix.node == 24
        run: npm run test:regulatory

      - name: Build production application
        env:
          VERCEL_ENV: production
          NEXT_PUBLIC_BASE_URL: https://www.subshield.net
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          NEXT_PUBLIC_STRIPE_PRICE_SINGLE_REVIEW_CYCLE: price_ci_single
          NEXT_PUBLIC_STRIPE_PRICE_ACTIVE_BIDDER_PLAN: price_ci_active
          NEXT_PUBLIC_STRIPE_PRICE_ENTERPRISE_PLAN: price_ci_enterprise
          OPENAI_API_KEY: sk-ci-placeholder
          RESEND_API_KEY: re_ci_placeholder
          CONTACT_FROM_EMAIL: ci@example.com
          CONTACT_TO_EMAIL: ci@example.com
        run: npm run build

      - name: Build Preview without server secrets on production runtime
        if: matrix.node == 24
        env:
          VERCEL_ENV: preview
          VERCEL_URL: subshield-node-24-preview-ci.vercel.app
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_STRIPE_PRICE_SINGLE_REVIEW_CYCLE: price_ci_single
          NEXT_PUBLIC_STRIPE_PRICE_ACTIVE_BIDDER_PLAN: price_ci_active
          NEXT_PUBLIC_STRIPE_PRICE_ENTERPRISE_PLAN: price_ci_enterprise
        run: |
          rm -rf .next
          npm run build
