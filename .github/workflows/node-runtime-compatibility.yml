name: Node 22 Compatibility

on:
  pull_request:
    paths:
      - ".nvmrc"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"
      - ".github/workflows/**"
      - "scripts/check-node-runtime-policy.mjs"
      - "scripts/check-vercel-runtime-policy.mjs"
      - "next.config.ts"
      - "app/**"
      - "lib/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-22-compatibility:
    name: Node 22 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate runtime policy contracts
        run: |
          node scripts/check-node-runtime-policy.mjs
          node scripts/check-vercel-runtime-policy.mjs

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify native and document-processing packages load
        run: >-
          node --input-type=module -e "
          await import('sharp');
          await import('@napi-rs/canvas');
          await import('pdf-parse');
          await import('pdfjs-dist/legacy/build/pdf.mjs');
          await import('tesseract.js');
          console.log('Native and document-processing imports passed.');
          "

      - name: Validate TypeScript
        run: npx tsc --noEmit

      - name: Preserve analyzer accuracy
        run: npm run test:accuracy

      - name: Build production application
        env:
          VERCEL_ENV: production
          NEXT_PUBLIC_BASE_URL: https://www.subshield.net
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          NEXT_PUBLIC_STRIPE_PRICE_SINGLE_REVIEW_CYCLE: price_ci_single
          NEXT_PUBLIC_STRIPE_PRICE_ACTIVE_BIDDER_PLAN: price_ci_active
          NEXT_PUBLIC_STRIPE_PRICE_ENTERPRISE_PLAN: price_ci_enterprise
          OPENAI_API_KEY: sk-ci-placeholder
          RESEND_API_KEY: re_ci_placeholder
          CONTACT_FROM_EMAIL: ci@example.com
          CONTACT_TO_EMAIL: ci@example.com
        run: npm run build
