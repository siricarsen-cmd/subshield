          # Reuse broadened cure identity in the later protective-prohibition guard.
          s = s.replace('    CURE_REGULATION_RE.test(finding.regulation) &&\n    CURE_TERMINATION_PROHIBITION_RE.test(finding.foundText) &&', '    isCureFinding &&\n    CURE_TERMINATION_PROHIBITION_RE.test(finding.foundText) &&', 1)
