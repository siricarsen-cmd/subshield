name: PR107 Five-Fix Guard

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/pr107-five-fix-guard.yml
      - .github/scripts/pr107_five_fix.py
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  apply-test-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/orion-parity-grounding-invoice-waiver
          fetch-depth: 0

      - name: Verify guarded starting state
        shell: bash
        run: |
          set -euo pipefail
          base=19a636ff1fe51a99eda0d97f4517adb33b1907ae
          git merge-base --is-ancestor "$base" HEAD
          git diff --name-only "$base"..HEAD | sort -u > /tmp/start-files
          printf '%s\n' ".github/scripts/pr107_five_fix.py" ".github/workflows/pr107-five-fix-guard.yml" | sort -u > /tmp/expected-start-files
          diff -u /tmp/expected-start-files /tmp/start-files

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee /tmp/guard.log

      - name: Apply source and regression changes
        shell: bash
        run: |
          set -o pipefail
          python3 .github/scripts/pr107_five_fix.py 2>&1 | tee -a /tmp/guard.log

      - name: Run focused Orion regressions
        shell: bash
        run: |
          set -o pipefail
          npm run test:accuracy:orion 2>&1 | tee -a /tmp/guard.log

      - name: Run complete analyzer suite
        shell: bash
        run: |
          set -o pipefail
          npm run test:accuracy 2>&1 | tee -a /tmp/guard.log

      - name: Run TypeScript
        shell: bash
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee -a /tmp/guard.log

      - name: Run production build
        env:
          VERCEL_ENV: production
          NEXT_PUBLIC_BASE_URL: https://www.subshield.net
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          NEXT_PUBLIC_STRIPE_PRICE_SINGLE_REVIEW_CYCLE: price_ci_single
          NEXT_PUBLIC_STRIPE_PRICE_ACTIVE_BIDDER_PLAN: price_ci_active
          NEXT_PUBLIC_STRIPE_PRICE_ENTERPRISE_PLAN: price_ci_enterprise
          OPENAI_API_KEY: sk-ci-placeholder
          RESEND_API_KEY: re_ci_placeholder
          CONTACT_FROM_EMAIL: ci@example.com
          CONTACT_TO_EMAIL: ci@example.com
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee -a /tmp/guard.log

      - name: Remove temporary files and verify exact six-file scope
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/pr107_five_fix.py .github/workflows/pr107-five-fix-guard.yml
          git diff --name-only origin/main | sort -u > /tmp/actual-files
          printf '%s\n' \
            "lib/analyzer/__fixtures__/orion-parity-regression-fixture.mjs" \
            "lib/analyzer/__tests__/orion-parity-regression.test.mjs" \
            "lib/analyzer/anchors.ts" \
            "lib/analyzer/deterministic.ts" \
            "lib/analyzer/sanity.ts" \
            "package.json" | sort -u > /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files

      - name: Commit and push verified source candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/analyzer/deterministic.ts lib/analyzer/sanity.ts lib/analyzer/__tests__/orion-parity-regression.test.mjs .github/scripts/pr107_five_fix.py .github/workflows/pr107-five-fix-guard.yml
          git commit -m "Handle final evidence and claim variants"
          git push origin HEAD:fix/orion-parity-grounding-invoice-waiver
          gh pr comment 107 --body "Guarded five-fix workflow passed. New exact source head: \`$(git rev-parse HEAD)\`. All 332 Orion assertions, the full analyzer suite, TypeScript, production build, and exact six-file scope passed."

      - name: Report guard failure
        if: failure()
        shell: bash
        run: |
          {
            echo 'Guarded five-fix workflow stopped without pushing source changes.'
            echo
            echo '<details><summary>Diagnostic tail</summary>'
            echo
            echo '```text'
            if test -f /tmp/guard.log; then tail -n 200 /tmp/guard.log; else echo 'Failure occurred before the diagnostic log was created.'; fi
            echo '```'
            echo '</details>'
          } > /tmp/failure-comment.md
          gh pr comment 107 --body-file /tmp/failure-comment.md
