name: Temporary Authenticated Production Acceptance

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  id-token: write

jobs:
  production-acceptance:
    if: github.head_ref == 'test/production-acceptance-20260803'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out acceptance branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fixture and HTTP dependencies
        run: python -m pip install --disable-pip-version-check requests python-docx pillow reportlab

      - name: Create disposable acceptance account through GitHub OIDC
        shell: bash
        env:
          ACCEPTANCE_ADMIN_URL: https://fqwkvyypjnxkiojbubdf.supabase.co/functions/v1/subshield-production-acceptance-admin
        run: |
          set -euo pipefail
          oidc_json="$(curl --silent --show-error --fail \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=subshield-production-acceptance")"
          oidc_token="$(jq -er '.value' <<<"${oidc_json}")"
          created="$(curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Authorization: Bearer ${oidc_token}" \
            --header "Content-Type: application/json" \
            --data "{\"action\":\"create\",\"runId\":\"${GITHUB_RUN_ID}\"}" \
            "${ACCEPTANCE_ADMIN_URL}")"
          email="$(jq -er '.email' <<<"${created}")"
          password="$(jq -er '.password' <<<"${created}")"
          user_id="$(jq -er '.userId' <<<"${created}")"
          credits="$(jq -er '.credits' <<<"${created}")"
          test "${credits}" = "8"
          echo "::add-mask::${email}"
          echo "::add-mask::${password}"
          echo "::add-mask::${user_id}"
          {
            echo "ACCEPTANCE_EMAIL=${email}"
            echo "ACCEPTANCE_PASSWORD=${password}"
            echo "ACCEPTANCE_USER_ID=${user_id}"
          } >> "${GITHUB_ENV}"

      - name: Run strict scanned PDF production acceptance
        run: python scripts/_temporary_scanned_production_acceptance.py

      - name: Upload sanitized acceptance result
        if: always() && hashFiles('acceptance-result.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-production-acceptance-${{ github.run_id }}
          path: acceptance-result.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove disposable acceptance account and rows
        if: always()
        shell: bash
        env:
          ACCEPTANCE_ADMIN_URL: https://fqwkvyypjnxkiojbubdf.supabase.co/functions/v1/subshield-production-acceptance-admin
        run: |
          set -euo pipefail
          if [[ -z "${ACCEPTANCE_USER_ID:-}" ]]; then
            echo "No disposable account was created; cleanup is not required."
            exit 0
          fi
          oidc_json="$(curl --silent --show-error --fail \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=subshield-production-acceptance")"
          oidc_token="$(jq -er '.value' <<<"${oidc_json}")"
          cleaned="$(curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Authorization: Bearer ${oidc_token}" \
            --header "Content-Type: application/json" \
            --data "{\"action\":\"cleanup\",\"userId\":\"${ACCEPTANCE_USER_ID}\"}" \
            "${ACCEPTANCE_ADMIN_URL}")"
          test "$(jq -er '.ok' <<<"${cleaned}")" = "true"
          echo "Disposable acceptance account and rows removed."
