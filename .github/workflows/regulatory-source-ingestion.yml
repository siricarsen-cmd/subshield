name: Regulatory Source Ingestion

on:
  workflow_dispatch:
    inputs:
      source_id:
        description: "Approved catalog source ID, or starter for the controlled starter set"
        required: true
        default: "starter"
        type: string
  schedule:
    - cron: "17 13 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: regulatory-source-ingestion
  cancel-in-progress: false

jobs:
  ingest-approved-sources:
    name: Fetch official sources and prepare pending review evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Fetch and store pending official-source snapshots
        id: ingest
        continue-on-error: true
        shell: bash
        env:
          REQUESTED_SOURCE: ${{ github.event.inputs.source_id || 'starter' }}
        run: |
          set +e
          if [[ "$REQUESTED_SOURCE" == "starter" ]]; then
            npm run regulatory:ingest -- \
              --starter \
              --output-dir data/regulatory-snapshots \
              --result-file regulatory-ingestion-result.json \
              2>&1 | tee regulatory-ingestion-summary.txt
          else
            if [[ ! "$REQUESTED_SOURCE" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
              echo "Invalid source ID: $REQUESTED_SOURCE" | tee regulatory-ingestion-summary.txt
              status=2
              echo "status=$status" >> "$GITHUB_OUTPUT"
              exit "$status"
            fi
            npm run regulatory:ingest -- \
              --source-id "$REQUESTED_SOURCE" \
              --output-dir data/regulatory-snapshots \
              --result-file regulatory-ingestion-result.json \
              2>&1 | tee regulatory-ingestion-summary.txt
          fi
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload ingestion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regulatory-ingestion-evidence-${{ github.run_id }}
          path: |
            regulatory-ingestion-summary.txt
            regulatory-ingestion-result.json
          if-no-files-found: error
          retention-days: 90

      - name: Prepare pending regulatory update review packets
        id: reviews
        if: steps.ingest.outputs.status == '0'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          created_at="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          npm run regulatory:prepare-ingestion-reviews -- \
            --ingestion-result regulatory-ingestion-result.json \
            --snapshot-root data/regulatory-snapshots \
            --packet-root data/regulatory-update-reviews \
            --requested-by "SubShield regulatory update monitor" \
            --created-at "$created_at" \
            --result-file regulatory-update-review-result.json \
            2>&1 | tee regulatory-update-review-summary.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload update-review evidence
        if: always() && steps.ingest.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: regulatory-update-review-evidence-${{ github.run_id }}
          path: |
            regulatory-update-review-summary.txt
            regulatory-update-review-result.json
          if-no-files-found: error
          retention-days: 90

      - name: Detect controlled evidence changes
        id: changes
        if: steps.ingest.outputs.status == '0' && steps.reviews.outputs.status == '0'
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- data/regulatory-snapshots data/regulatory-update-reviews)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pending source-update pull request
        if: steps.ingest.outputs.status == '0' && steps.reviews.outputs.status == '0' && steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SOURCE: ${{ github.event.inputs.source_id || 'starter' }}
        run: |
          branch="automation/regulatory-source-updates-${GITHUB_RUN_ID}"
          packet_count="$(jq -r '.packetCount' regulatory-update-review-result.json)"
          initial_count="$(jq -r '.initialSnapshotCount' regulatory-update-review-result.json)"
          manual_baseline_count="$(jq -r '.manualBaselineReviewCount' regulatory-update-review-result.json)"
          no_packet_count="$(jq -r '.noPacketCount' regulatory-update-review-result.json)"

          git config user.name "subshield-regulatory-bot"
          git config user.email "subshield-regulatory-bot@users.noreply.github.com"
          git switch -c "$branch"
          git add data/regulatory-snapshots
          if [[ -d data/regulatory-update-reviews ]]; then
            git add data/regulatory-update-reviews
          fi
          git commit -m "chore: retain pending regulatory source review evidence"
          git push --set-upstream origin "$branch"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "Review pending official regulatory source updates" \
            --body "## Automated controlled ingestion

Fetched approved public government sources for: **${REQUESTED_SOURCE}**.

All newly retained source snapshots and generated review packets remain **pending**, **not applied**, and **not customer-facing**. No source was approved, no applicability mapping or governing-date policy was changed, and no analyzer or report behavior was modified.

### Controlled outcome

- Pending update review packets: **${packet_count}**
- First snapshots requiring direct source review: **${initial_count}**
- Changes blocked pending an approved comparison baseline: **${manual_baseline_count}**
- Unchanged or transport-only retrievals requiring no packet: **${no_packet_count}**

### Required independent review

- Confirm source authenticity and retrieval provenance.
- Review substantive text and version/effective-date changes.
- Confirm normalization did not distort legal meaning.
- Review each immutable update packet and its anchor-impact analysis.
- Decide whether applicability mappings, historical policies, citation templates, or benchmarks require a separately approved change.
- Do not approve or merge merely because retrieval and automation succeeded.

Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Report unchanged sources
        if: steps.ingest.outputs.status == '0' && steps.reviews.outputs.status == '0' && steps.changes.outputs.changed == 'false'
        run: echo "No normalized official-source content or pending review evidence changed; no pull request was created."

      - name: Enforce controlled ingestion and review preparation
        if: always()
        shell: bash
        run: |
          ingestion_status="${{ steps.ingest.outputs.status }}"
          review_status="${{ steps.reviews.outputs.status }}"
          echo "Regulatory ingestion status: ${ingestion_status:-missing}"
          echo "Regulatory review-preparation status: ${review_status:-missing}"
          test "$ingestion_status" = "0"
          test "$review_status" = "0"
