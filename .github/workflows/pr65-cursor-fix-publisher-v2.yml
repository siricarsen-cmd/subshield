name: PR 65 cursor fix publisher v2

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/regulatory-implementation-merge-authorization'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - id: gate
        shell: bash
        run: |
          if [ "$(git log -1 --pretty=%s)" = "Trigger PR 65 cursor fix publisher v2" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply exact two-file correction
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          adapter_path = Path("lib/regulatory/registry-implementation-merge-production-adapter.ts")
          adapter = adapter_path.read_text(encoding="utf-8")
          old_query = '''    const query = [
            "query($number:Int!,$after:String){",
            'repository(owner:"siricarsen-cmd",name:"subshield"){',
            "pullRequest(number:$number){",
            "reviewThreads(first:100,after:$after){",
            "nodes{isResolved}",
            "pageInfo{hasNextPage endCursor}",
            "}}}}",
          ].join("");
          '''
          old_query = old_query.replace("          ", "", 0)
          old_query = '''    const query = [
            "query($number:Int!,$after:String){",
            'repository(owner:"siricarsen-cmd",name:"subshield"){',
            "pullRequest(number:$number){",
            "reviewThreads(first:100,after:$after){",
            "nodes{isResolved}",
            "pageInfo{hasNextPage endCursor}",
            "}}}}",
          ].join("");
          '''
          # Normalize only the known indentation in this exact literal.
          old_query = old_query.replace('\n            ', '\n      ').replace('\n          ].join', '\n    ].join')
          if adapter.count(old_query) != 1:
              raise SystemExit("adapter query block mismatch")
          adapter = adapter.replace(old_query, "", 1)

          old_args = '''      const args = [
            "graphql",
            "-f",
            `query=${query}`,
            "-F",
            `number=${prNumber}`,
            ...(cursor ? ["-f", `after=${cursor}`] : ["-f", "after="]),
          ];
          '''
          old_args = old_args.replace('\n            ', '\n        ').replace('\n          ];', '\n      ];')
          new_args = '''      const query = [
            cursor
              ? "query($number:Int!,$after:String!){"
              : "query($number:Int!){",
            'repository(owner:"siricarsen-cmd",name:"subshield"){',
            "pullRequest(number:$number){",
            cursor
              ? "reviewThreads(first:100,after:$after){"
              : "reviewThreads(first:100){",
            "nodes{isResolved}",
            "pageInfo{hasNextPage endCursor}",
            "}}}}",
          ].join("");
          const args = [
            "graphql",
            "-f",
            `query=${query}`,
            "-F",
            `number=${prNumber}`,
            ...(cursor ? ["-f", `after=${cursor}`] : []),
          ];
          '''
          new_args = new_args.replace('\n            ', '\n        ').replace('\n              ', '\n          ').replace('\n          ].join', '\n      ].join').replace('\n          const args', '\n      const args').replace('\n          ];', '\n      ];')
          if adapter.count(old_args) != 1:
              raise SystemExit("adapter args block mismatch")
          adapter = adapter.replace(old_args, new_args, 1)
          adapter_path.write_text(adapter, encoding="utf-8")

          test_path = Path("lib/regulatory/__tests__/registry-implementation-merge-production-adapter.test.mjs")
          test = test_path.read_text(encoding="utf-8")
          old_harness = '''  const after = api.find(value => value.startsWith("after="))?.slice(6) ?? "";
          if (!after) output({
            data: { repository: { pullRequest: { reviewThreads: {
              nodes: [{ isResolved: !state.unresolvedThread }],
              pageInfo: { hasNextPage: true, endCursor: state.missingThreadCursor ? null : "cursor-1" }
            } } } }
          });
          output({
            data: { repository: { pullRequest: { reviewThreads: {
              nodes: [{ isResolved: true }],
              pageInfo: { hasNextPage: false, endCursor: null }
            } } } }
          });
          '''
          old_harness = old_harness.replace('\n          ', '\n  ').replace('\n            ', '\n    ').replace('\n              ', '\n      ')
          new_harness = '''  const afterArguments = api.filter(value => value.startsWith("after="));
          const hasAfterVariable = query.includes("$after");
          const hasAfterField = query.includes("after:$after");
          if (afterArguments.length === 0) {
            if (hasAfterVariable || hasAfterField) fail("first-page cursor must be omitted");
            output({
              data: { repository: { pullRequest: { reviewThreads: {
                nodes: [{ isResolved: !state.unresolvedThread }],
                pageInfo: { hasNextPage: true, endCursor: state.missingThreadCursor ? null : "cursor-1" }
              } } } }
            });
          }
          if (
            afterArguments.length !== 1 ||
            afterArguments[0] !== "after=cursor-1" ||
            !hasAfterVariable ||
            !hasAfterField
          ) fail("wrong review thread cursor");
          output({
            data: { repository: { pullRequest: { reviewThreads: {
              nodes: [{ isResolved: true }],
              pageInfo: { hasNextPage: false, endCursor: null }
            } } } }
          });
          '''
          new_harness = new_harness.replace('\n          ', '\n  ').replace('\n            ', '\n    ').replace('\n              ', '\n      ').replace('\n                ', '\n        ')
          if test.count(old_harness) != 1:
              raise SystemExit("test harness block mismatch")
          test = test.replace(old_harness, new_harness, 1)

          old_assertions = '''  equal(
            ghCalls.filter((call) => call.argv.includes("graphql")).length,
            2,
            "review-thread cursor pagination requests every page"
          );
          '''
          old_assertions = old_assertions.replace('\n            ', '\n    ').replace('\n          );', '\n  );')
          new_assertions = '''  const reviewThreadCalls = ghCalls.filter(
            (call) =>
              call.argv.includes("graphql") &&
              !call.argv.some((value) => value.includes("updateRefs"))
          );
          equal(
            reviewThreadCalls.length,
            2,
            "review-thread cursor pagination requests every page"
          );
          const firstReviewThreadQuery =
            reviewThreadCalls[0].argv.find((value) => value.startsWith("query=")) ?? "";
          const secondReviewThreadQuery =
            reviewThreadCalls[1].argv.find((value) => value.startsWith("query=")) ?? "";
          check(
            !firstReviewThreadQuery.includes("$after") &&
              !firstReviewThreadQuery.includes("after:$after") &&
              !reviewThreadCalls[0].argv.some((value) => value.startsWith("after=")),
            "first review-thread request omits every cursor declaration, field, and argument"
          );
          check(
            secondReviewThreadQuery.includes("$after:String!") &&
              secondReviewThreadQuery.includes("after:$after") &&
              reviewThreadCalls[1].argv.filter((value) => value === "after=cursor-1").length === 1,
            "later review-thread request uses the exact returned cursor"
          );
          '''
          new_assertions = new_assertions.replace('\n            ', '\n    ').replace('\n              ', '\n      ').replace('\n          );', '\n  );')
          if test.count(old_assertions) != 1:
              raise SystemExit("test assertion block mismatch")
          test = test.replace(old_assertions, new_assertions, 1)
          test_path.write_text(test, encoding="utf-8")
          PY

      - if: steps.gate.outputs.run == 'true'
        run: npm ci

      - if: steps.gate.outputs.run == 'true'
        run: npm run test:regulatory:implementation-merge-production-adapter

      - name: Commit and push exact correction
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected=$'lib/regulatory/__tests__/registry-implementation-merge-production-adapter.test.mjs\nlib/regulatory/registry-implementation-merge-production-adapter.ts'
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/regulatory/registry-implementation-merge-production-adapter.ts lib/regulatory/__tests__/registry-implementation-merge-production-adapter.test.mjs
          git commit -m "Fix initial review thread pagination cursor"
          git push origin HEAD:feat/regulatory-implementation-merge-authorization
