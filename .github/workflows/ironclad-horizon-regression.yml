name: Ironclad Horizon Regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ironclad-horizon:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run focused Ironclad regression
        run: node --experimental-loader ./lib/analyzer/__tests__/ts-relative-import.loader.mjs lib/analyzer/__tests__/ironclad-horizon-regression.test.mjs
      - name: Validate TypeScript
        run: npx tsc --noEmit
