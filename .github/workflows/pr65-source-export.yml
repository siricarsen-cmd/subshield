name: PR65 Source Export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.ref == 'feat/regulatory-implementation-merge-authorization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/regulatory-implementation-merge-authorization
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Package exact source and runtime
        run: |
          tar -czf /tmp/pr65-source.tar.gz \
            AGENTS.md package.json package-lock.json tsconfig.json next.config.ts \
            docs/accuracy \
            lib/regulatory \
            lib/analyzer/__tests__/ts-relative-import.loader.mjs
          NODE_PREFIX="$(dirname "$(dirname "$(command -v node)")")"
          tar -C "$(dirname "$NODE_PREFIX")" -czf /tmp/pr65-node24.tar.gz "$(basename "$NODE_PREFIX")"
      - uses: actions/upload-artifact@v4
        with:
          name: pr65-source
          path: /tmp/pr65-source.tar.gz
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: pr65-node24
          path: /tmp/pr65-node24.tar.gz
          if-no-files-found: error
          retention-days: 1
