name: Temporary PR60 test pattern

on:
  push:
    branches:
      - feat/regulatory-implementation-invocation-orchestration
    paths:
      - .github/workflows/temp-pr60-test-pattern.yml
      - scripts/temp-pr60-test-pattern.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/regulatory-implementation-invocation-orchestration
          fetch-depth: 0
      - name: Correct focused assertion pattern
        run: python scripts/temp-pr60-test-pattern.py
      - name: Commit patched test
        run: |
          git config user.name "SubShield Automation"
          git config user.email "subshield-automation@users.noreply.github.com"
          git add lib/regulatory/__tests__/registry-implementation-invocation.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "test: match authorization snapshot refusal"
          git push origin HEAD:feat/regulatory-implementation-invocation-orchestration
